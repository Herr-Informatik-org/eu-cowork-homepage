<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  /* Schriften selbst gehostet, keine Anfrage an Google Fonts (D8).
     Identischer Satz wie in assets/content.css. */
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/space-grotesk-400-latin.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/space-grotesk-500-latin.woff2') format('woff2')}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/space-grotesk-600-latin.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/inter-400-latin.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/inter-500-latin.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/inter-600-latin.woff2') format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/jetbrains-mono-400-latin.woff2') format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/jetbrains-mono-500-latin.woff2') format('woff2')}
</style>
<style>
  /* ---- Design v2, Kopfleiste -------------------------------------------
     Tokens identisch zu assets/content.css. Die Darstellung liegt bewusst
     in Klassen und nicht in inline-styles: nur so greifen :hover, :active
     und :focus-visible (Inline-Stile schlagen jede Regel). ---------------- */
  /* Die Leiste selbst bleibt randlos (das Milchglas muss bis an den Bildschirm
     reichen), ihr INHALT ist auf dieselben 1200px gekappt wie jede Sektion.
     Das leistet das zweite Glied im max(): ab 1360px Fensterbreite wächst der
     Innenabstand über die 80px des clamp() hinaus, sodass Wortmarke und CTA
     exakt auf der Content-Kante der Sektionen sitzen. Ohne das driftete die
     Navigation bei 1920px 360px nach aussen und die Leiste zerfiel optisch in
     drei weit auseinander liegende Inseln. Ein Wrapper-Element wäre der andere
     Weg, hätte aber :focus-visible und das Blatt-Overlay mitverschoben. */
  .euc-hd{
    --hd-ease:cubic-bezier(.23,1,.32,1);
    --hd-max:1200px;
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; gap:24px;
    min-height:68px;
    padding:12px max(clamp(20px,5vw,80px), calc((100% - var(--hd-max)) / 2));
    background:rgba(250,250,247,.72);
    border-bottom:0;
    transition:background 200ms var(--hd-ease);
  }
  .euc-hd.is-scrolled{ background:rgba(250,250,247,.86); }

  /* ---- Leiste über tiefen Sektionen -------------------------------------
     Über den Navy-Blöcken (Mobile App, Self-Host, Roadmap, Schluss-CTA,
     Fussleiste) liest sich das helle Milchglas als graues Band quer über die
     Fläche. Nicht die Anordnung kippt, nur das Material: dieselbe Leiste,
     dunkel getönt. Der Zustand kommt aus demselben Mechanismus wie
     .is-scrolled (ein Zustandsbit, eine Klasse), gespeist von einem
     IntersectionObserver auf einem 68px hohen Band am oberen Rand. */
  .euc-hd.is-on-dark{ background:rgba(11,30,51,.60); }
  .euc-hd.is-on-dark.is-scrolled{ background:rgba(11,30,51,.74); }
  .euc-hd.is-on-dark::after{ background:linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,0)); }
  .euc-hd.is-on-dark .euc-hd-word{ color:#F7FAFC; }
  .euc-hd.is-on-dark .euc-hd-ai{ color:#A5D8E6; }
  .euc-hd.is-on-dark .euc-hd-brand svg path{ stroke:#F7FAFC; }
  .euc-hd.is-on-dark .euc-hd-nav a{ color:#C4D0DD; }
  .euc-hd.is-on-dark .euc-hd-nav a.is-active{ color:#A5D8E6; }
  /* Der Primärknopf ist auf hellem Grund Navy; auf Navy wäre er unsichtbar.
     Er tauscht mit dem Sekundären die Rolle: hell auf dunkel. */
  .euc-hd.is-on-dark .euc-hd-btn{
    color:#0B1E33; background:#F7FAFC;
    box-shadow:0 1px 2px rgba(0,0,0,.18), 0 8px 20px -12px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.6);
  }
  /* Deckend statt transluzent: über der bereits transluzenten Leiste darf
     keine zweite Milchglasfläche liegen. */
  .euc-hd.is-on-dark .euc-hd-btn2{
    color:#F7FAFC; background:#12326B;
    box-shadow:0 1px 2px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(165,216,230,.22);
  }
  .euc-hd.is-on-dark .euc-hd-burger span{ background:#F7FAFC; }
  .euc-hd.is-on-dark .euc-hd-burger:active{ background-color:rgba(255,255,255,.10); }
  .euc-hd.is-on-dark :focus-visible{ outline-color:#A5D8E6; }
  /* Milchglas liegt auf einer Pseudo-Element-Schicht, NICHT auf .euc-hd selbst:
     backdrop-filter macht das Element sonst zum Containing Block fuer das
     position:fixed-Mobilmenue darin, das dann auf Leistenhoehe geclippt wird. */
  .euc-hd::before{
    content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
  }

  /* Scroll-Edge statt 1px-Hairline: 24px weicher Verlauf unter der Leiste,
     sichtbar erst ab scrollY > 8. */
  .euc-hd::after{
    content:''; position:absolute; left:0; right:0; top:100%; height:24px;
    pointer-events:none; opacity:0;
    background:linear-gradient(to bottom, rgba(11,30,51,.055), rgba(11,30,51,0));
    transition:opacity 200ms var(--hd-ease);
  }
  .euc-hd.is-scrolled::after{ opacity:1; }

  .euc-hd-brand{
    display:flex; align-items:center; gap:11px;
    min-height:44px; flex:0 0 auto; text-decoration:none;
  }
  .euc-hd-brand svg{ display:block; }
  .euc-hd-word{
    font-family:'Space Grotesk','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    font-weight:600; font-size:19px; letter-spacing:-0.02em; color:#0B1E33;
    transition:color 200ms var(--hd-ease);
  }
  /* Wortmarke: „EU Cowork" in Tinte, „AI" in Europa-Blau. DE wie EN. */
  .euc-hd-ai{ color:#12326B; font-style:normal; transition:color 200ms var(--hd-ease); }
  .euc-hd-brand svg path{ transition:stroke 200ms var(--hd-ease); }

  .euc-hd-nav{ display:flex; align-items:center; gap:30px; margin-left:auto; margin-right:8px; }
  .euc-hd-nav a{
    display:inline-flex; align-items:center; min-height:44px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    font-size:14.5px; font-weight:500; letter-spacing:0;
    text-decoration:none; color:#5A6472; white-space:nowrap;
    transition:color 150ms ease;
  }
  .euc-hd-nav a.is-active{ color:#12326B; }

  .euc-hd-cta{ display:flex; align-items:center; gap:14px; flex:0 0 auto; }

  /* Zwischen 940px (ab da greift das Burger-Menü) und 1160px reicht die Breite
     nicht mehr für Wortmarke + fünf Punkte + zwei Schaltflächen. Statt die
     Leiste überlaufen zu lassen, fällt zuerst die zweite Schaltfläche weg
     (der Weg dorthin bleibt über „Self-Host" und die Fusszeile offen) und die
     Abstände in der Navigation rücken enger zusammen. */
  @media (max-width:1160px){
    .euc-hd-nav{ gap:22px; }
    .euc-hd-cta .euc-hd-btn2{ display:none; }
  }

  .euc-hd-btn, .euc-hd-btn2{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; border-radius:10px; border:0; cursor:pointer;
    text-decoration:none; white-space:nowrap;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    transition:transform 200ms var(--hd-ease, cubic-bezier(.23,1,.32,1)),
               background 200ms var(--hd-ease, cubic-bezier(.23,1,.32,1)),
               color 200ms var(--hd-ease, cubic-bezier(.23,1,.32,1)),
               box-shadow 200ms var(--hd-ease, cubic-bezier(.23,1,.32,1));
  }
  .euc-hd-btn{
    font-size:14px; font-weight:600; color:#F7FAFC; background:#0B1E33; padding:11px 18px;
    box-shadow:0 1px 2px rgba(11,30,51,.05), 0 8px 20px -12px rgba(11,30,51,.18),
               inset 0 1px 0 rgba(255,255,255,.10);
  }
  /* Deckend, nicht transluzent: über der bereits transluzenten Leiste
     dürfen keine zwei hellen Milchglasflächen stapeln. */
  .euc-hd-btn2{
    font-size:14px; font-weight:500; color:#0B1E33; background:#FFFFFF; padding:11px 16px;
    box-shadow:0 1px 2px rgba(11,30,51,.05),
               inset 0 1px 0 rgba(255,255,255,.34), inset 0 0 0 1px rgba(11,30,51,.06);
  }
  .euc-hd-btn:active, .euc-hd-btn2:active{ transform:scale(.97); }

  .euc-hd-burger{
    margin-left:auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px;
    width:44px; height:44px; padding:0;
    background:none; border:0; border-radius:10px; cursor:pointer;
    transition:background-color 120ms ease;
  }
  /* Der Hover-Hintergrund unten liegt hinter @media (hover:hover) und feuert auf
     dem Telefon nie — der Burger wäre sonst das einzige Bedienelement ohne
     Antwort. Nur Tönung, keine Bewegung: dafür wird er zu oft benutzt. */
  .euc-hd-burger:active{ background-color:rgba(11,30,51,.06); }
  .euc-hd-burger span{ display:block; width:22px; height:1.5px; background:#0B1E33; }

  .euc-hd-sheet{
    position:fixed; inset:0; z-index:200; background:#FAFAF7;
    display:flex; flex-direction:column; padding:14px clamp(20px,5vw,80px) 28px;
    overflow-y:auto;
    opacity:1; transform:none;
    transition:opacity 220ms var(--hd-ease), transform 220ms var(--hd-ease);
  }
  /* Das Blatt kommt von oben, wo der Burger sitzt — die Richtung erzählt die
     Herkunft. Kein scale: eine bildschirmfüllende Fläche, die skaliert, liest
     sich als Zoom, nicht als Blatt. */
  @starting-style{
    .euc-hd-sheet{ opacity:0; transform:translateY(-8px); }
  }
  .euc-hd-sheet-top{ display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .euc-hd-close{
    width:44px; height:44px; margin-right:-10px;
    display:inline-flex; align-items:center; justify-content:center;
    background:none; border:0; border-radius:10px; cursor:pointer;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:26px; line-height:1; color:#0B1E33;
    transition:background 150ms ease;
  }
  .euc-hd-close:active{ background:rgba(11,30,51,.06); }
  .euc-hd-sheet nav{ display:flex; flex-direction:column; margin-top:30px; }
  .euc-hd-sheet nav a{
    display:flex; align-items:center; min-height:56px; padding:12px 0;
    font-family:'Space Grotesk','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    font-size:26px; font-weight:400; letter-spacing:-0.024em; line-height:1.16;
    text-decoration:none; color:#0B1E33; border-bottom:1px solid #E7ECF0;
  }
  .euc-hd-sheet nav a:active{ color:#12326B; }
  .euc-hd-sheet-cta{ display:flex; flex-direction:column; gap:12px; margin-top:30px; }
  .euc-hd-sheet-cta a{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:52px; padding:14px; border-radius:10px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    font-size:15px; text-decoration:none;
    transition:transform 140ms cubic-bezier(.23,1,.32,1);
  }
  .euc-hd-sheet-cta a:active{ transform:scale(.985); }
  .euc-hd-sheet-cta .euc-hd-btn{ font-size:15px; font-weight:600; }
  .euc-hd-sheet-cta .euc-hd-btn2{ font-size:15px; font-weight:500; }

  .euc-hd :focus-visible{ outline:2px solid #12326B; outline-offset:3px; border-radius:6px; }
  .euc-hd-sheet :focus-visible{ outline:2px solid #12326B; outline-offset:3px; border-radius:6px; }

  /* Bewegung nur für echte Zeigegeräte, keine Information hängt an Hover. */
  @media (hover:hover) and (pointer:fine){
    .euc-hd-nav a:hover{ color:#0B1E33; }
    .euc-hd-btn:hover{
      background:#123456; transform:translateY(-2px);
      box-shadow:0 1px 2px rgba(11,30,51,.05), 0 8px 20px -12px rgba(11,30,51,.18),
                 0 24px 48px -28px rgba(11,30,51,.22), inset 0 1px 0 rgba(255,255,255,.10);
    }
    .euc-hd-btn2:hover{
      transform:translateY(-2px);
      box-shadow:0 1px 2px rgba(11,30,51,.05), 0 8px 20px -12px rgba(11,30,51,.18),
                 inset 0 1px 0 rgba(255,255,255,.34), inset 0 0 0 1px rgba(11,30,51,.06);
    }
    .euc-hd-burger:hover{ background:rgba(11,30,51,.05); }
    .euc-hd-sheet nav a:hover{ color:#12326B; }
    /* Auf dunklem Grund kehren sich beide Knöpfe um, also auch ihr Hover. */
    .euc-hd.is-on-dark .euc-hd-nav a:hover{ color:#F7FAFC; }
    .euc-hd.is-on-dark .euc-hd-btn:hover{ background:#FFFFFF; color:#0B1E33; }
    .euc-hd.is-on-dark .euc-hd-btn2:hover{ background:#1B437F; color:#F7FAFC; }
    .euc-hd.is-on-dark .euc-hd-burger:hover{ background:rgba(255,255,255,.10); }
  }

  /* Milchglas ist Zierde, nicht Voraussetzung: ohne backdrop-filter und bei
     reduzierter Transparenz wird die Leiste deckend. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .euc-hd, .euc-hd.is-scrolled{ background:#FAFAF7; }
    .euc-hd.is-on-dark, .euc-hd.is-on-dark.is-scrolled{ background:#0B1E33; }
  }
  @media (prefers-reduced-transparency: reduce){
    .euc-hd, .euc-hd.is-scrolled{ background:#FAFAF7; }
    .euc-hd.is-on-dark, .euc-hd.is-on-dark.is-scrolled{ background:#0B1E33; }
    .euc-hd::before{ backdrop-filter:none; -webkit-backdrop-filter:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    .euc-hd-btn:hover, .euc-hd-btn2:hover{ transform:none; }
    /* Sanfter statt null: reine Opazität bleibt, die Verschiebung fällt weg.
       .euc-hd-sheet (0-1-0) schlägt den *-Selektor auch unter !important. */
    .euc-hd-sheet{ transition:opacity 150ms linear !important; transform:none !important; }
    @starting-style{
      .euc-hd-sheet{ opacity:0; transform:none; }
    }
  }
</style>
</helmet>
<header ref="{{ headerRef }}" class="euc-hd {{ headerClass }}">

  <a href="{{ homeHref }}" class="euc-hd-brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M2.5 21.5 L10.5 6.5 L14.5 14 L17.5 8.5 L23.5 21.5 Z" stroke="#0B1E33" stroke-width="1.5" stroke-linejoin="round"></path>
      <circle cx="17.5" cy="5.4" r="2.1" fill="#F4C542"></circle>
    </svg>
    <span class="euc-hd-word">{{ brandMain }} <span class="euc-hd-ai">{{ brandAi }}</span></span>
  </a>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav class="euc-hd-nav">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
        <a href="{{ item.href }}" class="{{ item.cls }}">{{ item.label }}</a>
      </sc-for>
    </nav>

    <div class="euc-hd-cta">
      <a href="{{ secondaryHref }}" class="euc-hd-btn2">{{ secondaryLabel }}</a>
      <a href="{{ primaryHref }}" class="euc-hd-btn">{{ primaryLabel }}</a>
    </div>
  </sc-if>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="Menu" class="euc-hd-burger">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </sc-if>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="euc-hd-sheet">
      <div class="euc-hd-sheet-top">
        <span class="euc-hd-word">{{ brandMain }} <span class="euc-hd-ai">{{ brandAi }}</span></span>
        <button onClick="{{ toggleMenu }}" aria-label="Close" class="euc-hd-close">&times;</button>
      </div>
      <nav>
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
          <a href="{{ item.href }}" onClick="{{ closeMenu }}">{{ item.label }}</a>
        </sc-for>
      </nav>
      <div class="euc-hd-sheet-cta">
        <a href="{{ primaryHref }}" onClick="{{ closeMenu }}" class="euc-hd-btn">{{ primaryLabel }}</a>
        <a href="{{ secondaryHref }}" onClick="{{ closeMenu }}" class="euc-hd-btn2">{{ secondaryLabel }}</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:88},&quot;activeNav&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;features&quot;,&quot;sovereignty&quot;,&quot;selfhost&quot;,&quot;security&quot;,&quot;faq&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onLanding&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.BRAND = 'EU Cowork AI';
    this.BRAND_MAIN = 'EU Cowork';
    this.BRAND_AI = 'AI';
    this.SELFHOST = '/self-hosting'; // Release-Repository wird zum Launch veroeffentlicht
    this.headerRef = React.createRef();
    const initLang = (typeof localStorage !== 'undefined' && localStorage.getItem('eucowork_lang')) || 'de';
    const initMobile = (typeof window !== 'undefined' && window.innerWidth < 940) || false;
    this.state = { lang: initLang, scrolled: false, menuOpen: false, isMobile: initMobile, onDark: false };
    // Feuert nur beim Überschreiten der Schwelle, nicht bei jedem Scroll-Tick.
    this._onScroll = () => {
      const s = window.scrollY > 8;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    this._darkOn = new Set();
    this._onResize = () => {
      const m = window.innerWidth < 940;
      if (m !== this.state.isMobile) this.setState({ isMobile: m, menuOpen: m ? this.state.menuOpen : false });
      // Das Beobachtungsband hängt an der Fensterhöhe und muss danach neu
      // aufgespannt werden; gebündelt, weil resize in Serie feuert.
      clearTimeout(this._darkResizeT);
      this._darkResizeT = setTimeout(() => this._buildDarkIo(), 160);
    };
    this._onLang = (e) => this.setState({ lang: e.detail });
  }
  componentDidMount(){
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onResize);
    window.addEventListener('eucowork:langchange', this._onLang);
    this._onScroll();
    this._findDarkSections(0);
  }
  componentWillUnmount(){
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('eucowork:langchange', this._onLang);
    clearTimeout(this._darkFindT);
    clearTimeout(this._darkResizeT);
    if (this._darkIo) this._darkIo.disconnect();
  }
  /* -----------------------------------------------------------------------
     Sektionsbewusster Zustand. Dieselbe Mechanik wie .is-scrolled: ein
     Zustandsbit, eine Klasse. Statt der Scrollposition beobachtet ein
     IntersectionObserver ein Band von der Höhe der Leiste am oberen
     Fensterrand; liegt eine als [data-hd-dark] markierte Sektion darin, kippt
     das Material. Seiten ohne solche Sektionen (Rechtstexte, Warteliste)
     bekommen davon nichts mit: kein Treffer, kein Beobachter.
     ----------------------------------------------------------------------- */
  _findDarkSections(tries){
    if (typeof IntersectionObserver === 'undefined') return;
    const els = document.querySelectorAll('[data-hd-dark]');
    if (!els.length){
      // Die Sektionen können nach der Leiste montiert werden (dc-import).
      if (tries < 8) this._darkFindT = setTimeout(() => this._findDarkSections(tries + 1), 250);
      return;
    }
    this._darkEls = els;
    this._buildDarkIo();
  }
  _buildDarkIo(){
    if (!this._darkEls || !this._darkEls.length) return;
    if (this._darkIo) this._darkIo.disconnect();
    this._darkOn.clear();
    const hd = this.headerRef.current;
    const bandH = (hd && hd.offsetHeight) || 68;
    const bottom = Math.max(0, Math.round(window.innerHeight - bandH));
    this._darkIo = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) this._darkOn.add(e.target); else this._darkOn.delete(e.target); });
      const on = this._darkOn.size > 0;
      if (on !== this.state.onDark) this.setState({ onDark: on });
    }, { rootMargin: '0px 0px -' + bottom + 'px 0px', threshold: 0 });
    this._darkEls.forEach(el => this._darkIo.observe(el));
  }
  setLang(l){
    try { localStorage.setItem('eucowork_lang', l); } catch(e){}
    window.dispatchEvent(new CustomEvent('eucowork:langchange', { detail: l }));
  }
  renderVals(){
    const lang = this.state.lang || 'de';
    const onLanding = this.props.onLanding === true;
    const base = onLanding ? '' : '/';
    const active = this.props.activeNav || 'home';
    const T = {
      de: { funktionen:'Funktionen', governance:'Governance', souveraenitaet:'Souveränität', selfhost:'Self-Host', faq:'FAQ',
            primary:'Auf die Warteliste', secondary:'Self-host for free' },
      en: { funktionen:'Features', governance:'Governance', souveraenitaet:'Sovereignty', selfhost:'Self-Host', faq:'FAQ',
            primary:'Join the waitlist', secondary:'Self-host for free' }
    }[lang];
    /* „Governance" zeigt auf die eigene Seite, nicht auf einen Anker: der
       Abschnitt auf der Startseite ist entfallen, der Inhalt lebt vollständig
       unter /governance. */
    const nav = [
      { key:'features',    label:T.funktionen,     href: base + '#funktionen' },
      { key:'governance',  label:T.governance,     href: '/governance' },
      { key:'sovereignty', label:T.souveraenitaet, href: base + '#souveraenitaet' },
      { key:'selfhost',    label:T.selfhost,       href: base + '#self-host' },
      { key:'faq',         label:T.faq,            href: '/faq' }
    ].map(n => ({ ...n, cls: n.key === active ? 'is-active' : '' }));
    const isDe = lang === 'de';
    return {
      brand: this.BRAND,
      brandMain: this.BRAND_MAIN,
      brandAi: this.BRAND_AI,
      homeHref: onLanding ? '#top' : '/',
      nav,
      isDesktop: !this.state.isMobile,
      isMobile: this.state.isMobile,
      menuOpen: this.state.menuOpen,
      headerRef: this.headerRef,
      headerClass: (this.state.scrolled ? 'is-scrolled' : '') + (this.state.onDark ? ' is-on-dark' : ''),
      primaryLabel: T.primary,
      primaryHref: '/warteliste',
      secondaryLabel: T.secondary,
      secondaryHref: this.SELFHOST,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      toDe: () => this.setLang('de'),
      toEn: () => this.setLang('en'),
      deBg: isDe ? '#0B1E33' : 'transparent', deFg: isDe ? '#F7FAFC' : '#5A6472',
      enBg: !isDe ? '#0B1E33' : 'transparent', enFg: !isDe ? '#F7FAFC' : '#5A6472'
    };
  }
}
</script>
</body>
</html>
