<h1>Protection des données</h1>
<p>Comment nous traitons les données personnelles selon la revDSG (Suisse) et le RGPD. Bref, car nous en collectons peu.</p>
<p>Télémétrie désactivée par défaut</p>
<h2>1 Responsable du traitement</h2>
<p>Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Suisse (fournisseur d'EU Cowork AI). Contact : info@herr-informatik.ch.</p>
<h2>2 Quelles données nous traitons</h2>
<p>Les données de compte et de facturation ainsi que les contenus que vous saisissez activement dans le service. Aucun traceur publicitaire, aucune transmission à des régies publicitaires.</p>
<h2>3 Aucun entraînement avec vos données</h2>
<p>Vos contenus ne sont jamais utilisés pour entraîner des modèles. L'absence d'entraînement est garantie contractuellement.</p>
<h2>4 Télémétrie</h2>
<p>Désactivée par défaut. Métriques d'utilisation agrégées et facultatives uniquement après activation explicite.</p>
<h2>5 Lieu du traitement</h2>
<p>Exploitation en Suisse (Green, Lupfig) ; inférence des modèles traitée dans l'UE via EuRouter. En auto-hébergement, les données restent entièrement chez vous.</p>
<h2>6 Durée de conservation</h2>
<p>Les données ne sont conservées que le temps nécessaire au service ou exigé par la loi. Suppression sur demande.</p>
<h2>7 Prise de rendez-vous</h2>
<p>Pour la prise de rendez-vous, nous utilisons Microsoft Bookings, un service de Microsoft Corporation. Lorsque vous réservez un rendez-vous, Microsoft traite les données que vous indiquez (nom, adresse e-mail, créneau choisi, informations facultatives) selon les conditions de Microsoft. La réservation est facultative ; tous les contenus de ce site sont accessibles sans elle.</p>
<h2>8 Vos droits</h2>
<p>Accès, rectification, effacement, limitation et portabilité des données. Demandes à privacy@eu-cowork.example.</p>
<p>Remarque : cette déclaration de protection des données est une version préliminaire. La version contraignante, avec les mentions complètes de la société, sera publiée avant le lancement et remplacera les éléments provisoires.</p>
