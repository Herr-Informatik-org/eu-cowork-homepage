<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:#FAFAF7; color:#111111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:#0E3A63; } a:hover{ color:#0B1E33; }
  ::selection{ background:#A5D8E6; color:#0B1E33; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } html{ scroll-behavior:auto; } }
</style>
</helmet>
<div id="top">
  <dc-import name="SiteHeader" active-nav="security" on-landing="{{ false }}" hint-size="100%,88px"></dc-import>
  <main style="max-width:820px; margin:0 auto; padding:clamp(124px,15vw,168px) clamp(20px,5vw,40px) clamp(64px,8vw,104px);">
    <a href="Security.dc.html" style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#3E6E86; text-decoration:none;">← {{ t.back }}</a>
    <div style="display:inline-flex; align-items:center; gap:9px; margin-top:22px; padding:6px 12px; border:1px solid #E4D9B8; background:#FBF6E6; border-radius:99px;">
      <span style="width:7px; height:7px; border-radius:50%; background:#C7A83A;"></span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#7A6A2E;">{{ t.status }}</span>
    </div>
    <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:clamp(32px,5vw,52px); line-height:1.06; letter-spacing:-0.03em; color:#0B1E33; margin:16px 0 0;">{{ t.h1 }}</h1>
    <p style="font-family:'Inter',sans-serif; font-size:17px; line-height:1.6; color:#47535F; margin:16px 0 0;">{{ t.intro }}</p>
    <div style="margin-top:40px; display:flex; flex-direction:column; gap:30px;">
      <sc-for list="{{ t.sections }}" as="s" hint-placeholder-count="6">
        <div>
          <div style="display:flex; align-items:baseline; gap:12px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:13px; color:#A5B7C6; font-weight:500;">{{ s.n }}</span>
            <h2 style="font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:20px; letter-spacing:-.01em; color:#0B1E33; margin:0;">{{ s.t }}</h2>
          </div>
          <p style="font-family:'Inter',sans-serif; font-size:15.5px; line-height:1.68; color:#4A5560; margin:10px 0 0; padding-left:26px;">{{ s.b }}</p>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:44px; padding:22px 24px; border:1px solid #E4E8EC; border-radius:14px; background:#F7FAFC; font-family:'Inter',sans-serif; font-size:13.5px; line-height:1.6; color:#66727F;">{{ t.disclaimer }}</div>
  </main>
  <dc-import name="SiteFooter" on-landing="{{ false }}" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        back:'Zurück zum Trust Center', status:'Entwurf — rechtsverbindliche Fassung folgt',
        h1:'Auftragsverarbeitungsvertrag (AVV)',
        intro:'Regelt die Verarbeitung personenbezogener Daten im Auftrag des Kunden nach Art. 28 DSGVO und revDSG. Dies ist eine Vorschau der Struktur; die unterschriftsreife Fassung wird hier verlinkt.',
        sections:[
          { n:'1', t:'Gegenstand & Dauer', b:'EU-Cowork verarbeitet personenbezogene Daten ausschliesslich zur Erbringung des vereinbarten Dienstes und nur auf dokumentierte Weisung des Kunden. Die Dauer entspricht der Laufzeit des Hauptvertrags.' },
          { n:'2', t:'Art der Daten & betroffene Personen', b:'Inhalte, die Nutzer in den Dienst eingeben, sowie Metadaten des Kontos. Betroffen sind Mitarbeitende und Kontakte des Kunden.' },
          { n:'3', t:'Pflichten des Auftragsverarbeiters', b:'Vertraulichkeit, Weisungsgebundenheit, Unterstützung bei Betroffenenrechten und Meldepflichten. Keine Nutzung der Daten für Modelltraining.' },
          { n:'4', t:'Technische & organisatorische Massnahmen', b:'Betrieb in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig AG, Schweiz). Zugriffskontrolle, Verschlüsselung in Transit, Audit-Logs. Details in den TOMs.' },
          { n:'5', t:'Unterauftragsverarbeiter', b:'Einsatz nur nach vorheriger Information; die aktuelle Liste ist unter „Subprozessoren" einsehbar. Der Kunde kann berechtigten Einwänden Geltung verschaffen.' },
          { n:'6', t:'Ort der Verarbeitung', b:'Betrieb in der Schweiz; Inferenz EU-verarbeitet über EuRouter. Keine Verarbeitung ausserhalb des EU-/EWR- und Schweizer Raums ohne geeignete Garantien.' },
          { n:'7', t:'Löschung & Rückgabe', b:'Nach Vertragsende werden Daten auf Wunsch des Kunden gelöscht oder zurückgegeben, soweit keine gesetzliche Aufbewahrungspflicht besteht.' }
        ],
        disclaimer:'Hinweis: Dieser Text ist eine strukturelle Vorschau, kein unterzeichneter Vertrag und keine Rechtsberatung. Die verbindliche Fassung wird nach juristischer Prüfung bereitgestellt.'
      },
      en: {
        back:'Back to Trust Center', status:'Draft — legally binding version to follow',
        h1:'Data Processing Agreement (DPA)',
        intro:'Governs the processing of personal data on behalf of the customer under Art. 28 GDPR and revDSG. This is a preview of the structure; the signature-ready version will be linked here.',
        sections:[
          { n:'1', t:'Subject & duration', b:'EU-Cowork processes personal data solely to provide the agreed service and only on the customer’s documented instructions. Duration matches the term of the main contract.' },
          { n:'2', t:'Type of data & data subjects', b:'Content that users enter into the service, plus account metadata. Data subjects are the customer’s staff and contacts.' },
          { n:'3', t:'Obligations of the processor', b:'Confidentiality, adherence to instructions, support with data-subject rights and breach notifications. No use of data for model training.' },
          { n:'4', t:'Technical & organisational measures', b:'Operated in ISO 27001-certified data centres by Green (Lupfig AG, Switzerland). Access control, encryption in transit, audit logs. Details in the TOMs.' },
          { n:'5', t:'Subprocessors', b:'Used only after prior notice; the current list is available under “Subprocessors”. The customer may assert legitimate objections.' },
          { n:'6', t:'Place of processing', b:'Operated in Switzerland; inference EU-processed via EuRouter. No processing outside the EU/EEA and Switzerland without appropriate safeguards.' },
          { n:'7', t:'Deletion & return', b:'After the contract ends, data is deleted or returned at the customer’s request, unless a statutory retention obligation applies.' }
        ],
        disclaimer:'Note: this text is a structural preview, not a signed contract and not legal advice. The binding version will be provided after legal review.'
      }
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){ const lang = this.state.lang || 'de'; return { t: this.C[lang] || this.C.de }; }
}
</script>
</body>
</html>
