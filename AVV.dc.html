<noscript>
  <h1>Auftragsverarbeitungsvertrag (AVV)</h1>
  <p>Regelt die Verarbeitung personenbezogener Daten im Auftrag des Kunden nach Art. 28 DSGVO und revDSG. Dies ist eine Vorschau der Struktur; die unterschriftsreife Fassung wird hier verlinkt.</p>
  <ul>
    <li><strong>Gegenstand &amp; Dauer:</strong> Verarbeitung ausschliesslich zur Erbringung des vereinbarten Dienstes und nur auf dokumentierte Weisung des Kunden.</li>
    <li><strong>Pflichten des Auftragsverarbeiters:</strong> Vertraulichkeit, Weisungsgebundenheit, Unterstützung bei Betroffenenrechten. Keine Nutzung der Daten für Modelltraining.</li>
    <li><strong>Technische &amp; organisatorische Massnahmen:</strong> Betrieb in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig AG, Schweiz). Zugriffskontrolle, Verschlüsselung in Transit, Audit-Logs.</li>
    <li><strong>Unterauftragsverarbeiter:</strong> Einsatz nur nach vorheriger Information; die aktuelle Liste steht unter Subprozessoren.</li>
    <li><strong>Ort der Verarbeitung:</strong> Betrieb in der Schweiz, Inferenz EU-verarbeitet über EuRouter.</li>
    <li><strong>Löschung &amp; Rückgabe:</strong> Nach Vertragsende werden Daten auf Wunsch gelöscht oder zurückgegeben.</li>
  </ul>
  <h2>Weiter</h2>
  <ul>
    <li><a href="/subprozessoren">Subprozessoren-Liste</a></li>
    <li><a href="/sicherheit">Trust Center: Sicherheit &amp; Datenschutz</a></li>
    <li><a href="/self-hosting">Self-Hosting in 60 Sekunden</a></li>
    <li><a href="/warteliste">Warteliste: frühen Zugang sichern</a></li>
  </ul>
