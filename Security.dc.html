  <h1>Sicherheit &amp; Vertrauen</h1>
  <p>Selbstdeklaration, mit echten Dokumenten dahinter. Jede Aussage hier ist belegt oder klar als in Arbeit gekennzeichnet.</p>
  <h2>Was wir zusichern</h2>
  <ul>
    <li><strong>Betrieb in der Schweiz:</strong> ISO-27001-zertifizierte Rechenzentren von Green (Lupfig AG, Schweiz). Zertifikate von Green, nicht von uns.</li>
    <li><strong>revDSG &amp; DSGVO:</strong> Schweizer und europäischer Datenschutz, vertraglich zugesichert.</li>
    <li><strong>No-Training:</strong> Ihre Daten trainieren keine Modelle.</li>
    <li><strong>Telemetrie aus by default:</strong> Kein Tracking ohne aktive Zustimmung.</li>
    <li><strong>Audit-Logs:</strong> Jeder Tool- und Datenzugriff ist nachvollziehbar.</li>
    <li><strong>MIT-Lizenz:</strong> Kein Seat-Limit, kein Branding-Zwang. Self-Hosting gratis ab 1 User.</li>
  </ul>
  <h2>Hosting</h2>
  <p>Betrieben in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig AG, Schweiz). Die Zertifizierungen liegen bei Green. Eine eigene ISO-27001-Zertifizierung von EU Cowork AI ist in Arbeit.</p>
