<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:#FAFAF7; color:#111111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:#0E3A63; } a:hover{ color:#0B1E33; }
  ::selection{ background:#A5D8E6; color:#0B1E33; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } html{ scroll-behavior:auto; } }
</style>
</helmet>
<div id="top">
  <dc-import name="SiteHeader" active-nav="security" on-landing="{{ false }}" hint-size="100%,88px"></dc-import>
  <main>
    <section style="padding:clamp(128px,15vw,170px) clamp(20px,5vw,80px) clamp(40px,5vw,60px); max-width:1120px; margin:0 auto;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#3E6E86;">{{ t.eyebrow }}</div>
      <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:clamp(38px,6vw,64px); line-height:1.04; letter-spacing:-0.03em; color:#0B1E33; margin:18px 0 0; text-wrap:balance;">{{ t.h1 }}</h1>
      <p style="font-family:'Inter',sans-serif; font-size:clamp(16px,1.4vw,19px); line-height:1.6; color:#47535F; margin:20px 0 0; max-width:620px; text-wrap:pretty;">{{ t.sub }}</p>
    </section>

    <section style="background:#F7FAFC; border-top:1px solid #EBEEF1; padding:clamp(56px,7vw,88px) clamp(20px,5vw,80px);">
      <div style="max-width:1120px; margin:0 auto;">
        <div style="font-family:'Space Grotesk',sans-serif; font-size:clamp(22px,3vw,30px); font-weight:500; color:#0B1E33; letter-spacing:-.02em;">{{ t.claimsTitle }}</div>
        <div style="margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;">
          <sc-for list="{{ t.claims }}" as="c" hint-placeholder-count="6">
            <div style="border:1px solid #E7ECF0; background:#fff; border-radius:14px; padding:22px;">
              <div style="display:flex; align-items:center; gap:11px;">
                <span style="flex:0 0 auto; width:28px; height:28px; border-radius:8px; background:#EAF3F7; border:1px solid #D6EDF5; display:inline-flex; align-items:center; justify-content:center;"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 7.4 L5.8 10 L11 4" stroke="#2E6C86" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
                <div style="font-family:'Space Grotesk',sans-serif; font-size:16.5px; font-weight:500; color:#0B1E33;">{{ c.t }}</div>
              </div>
              <div style="font-family:'Inter',sans-serif; font-size:14px; line-height:1.55; color:#5A6472; margin-top:11px;">{{ c.d }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <section id="toms" style="scroll-margin-top:90px; padding:clamp(56px,7vw,88px) clamp(20px,5vw,80px);">
      <div style="max-width:1120px; margin:0 auto;">
        <div style="font-family:'Space Grotesk',sans-serif; font-size:clamp(22px,3vw,30px); font-weight:500; color:#0B1E33; letter-spacing:-.02em;">{{ t.docsTitle }}</div>
        <p style="font-family:'Inter',sans-serif; font-size:15px; color:#5A6472; margin:10px 0 26px;">{{ t.docsSub }}</p>
        <div style="border:1px solid #E4E8EC; border-radius:14px; background:#fff; overflow:hidden;">
          <sc-for list="{{ t.docs }}" as="d" hint-placeholder-count="6">
            <a href="{{ d.href }}" style="display:flex; align-items:center; gap:16px; padding:17px 20px; border-bottom:1px solid #EEF1F4; text-decoration:none; transition:background .15s ease;" style-hover="background:#F7FAFC;">
              <span style="flex:0 0 auto; width:34px; height:34px; border-radius:8px; background:#F1F5F8; border:1px solid #E4E8EC; display:inline-flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:9px; color:#3E6E86;">DOC</span>
              <div style="flex:1; min-width:0;">
                <div style="font-family:'Inter',sans-serif; font-size:15px; font-weight:600; color:#0B1E33;">{{ d.name }}</div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#8A96A2; margin-top:3px;">{{ d.meta }}</div>
              </div>
              <span style="flex:0 0 auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:{{ d.ctaColor }}; background:{{ d.ctaBg }}; border:1px solid {{ d.ctaBorder }}; border-radius:99px; padding:5px 11px;">{{ d.cta }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="background:#0B1E33; color:#F7FAFC; padding:clamp(56px,7vw,88px) clamp(20px,5vw,80px);">
      <div style="max-width:1120px; margin:0 auto; display:flex; flex-wrap:wrap; gap:36px 56px; align-items:flex-start;">
        <div style="flex:1 1 260px;">
          <div style="font-family:'Space Grotesk',sans-serif; font-size:clamp(22px,3vw,30px); font-weight:500; color:#F7FAFC; letter-spacing:-.02em;">{{ t.hostingTitle }}</div>
        </div>
        <div style="flex:2 1 460px;">
          <p style="font-family:'Inter',sans-serif; font-size:16px; line-height:1.65; color:#C4D0DD; margin:0;">{{ t.hostingBody }}</p>
          <p style="font-family:'Inter',sans-serif; font-size:13.5px; line-height:1.6; color:#8AA0B6; margin:20px 0 0;">{{ t.note }}</p>
        </div>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" on-landing="{{ false }}" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        eyebrow:'// Trust Center',
        h1:'Sicherheit & Vertrauen',
        sub:'Selbstdeklaration, mit echten Dokumenten dahinter. Jede Aussage hier ist belegt oder klar als in Arbeit gekennzeichnet.',
        claimsTitle:'Was wir zusichern',
        claims:[
          { t:'Betrieb in der Schweiz', d:'ISO-27001-zertifizierte Rechenzentren von Green (Lupfig AG, Schweiz). Zertifikate von Green, nicht von uns.' },
          { t:'revDSG & DSGVO', d:'Schweizer und europäischer Datenschutz, vertraglich zugesichert.' },
          { t:'No-Training', d:'Ihre Daten trainieren keine Modelle.' },
          { t:'Telemetrie aus by default', d:'Kein Tracking ohne aktive Zustimmung.' },
          { t:'Audit-Logs', d:'Jeder Tool- und Datenzugriff ist nachvollziehbar.' },
          { t:'MIT-Lizenz', d:'Kein Seat-Limit, kein Branding-Zwang. Self-Hosting gratis ab 1 User.' }
        ],
        docsTitle:'Dokumente',
        docsSub:'Verträge und Nachweise zum Öffnen.',
        docs:[
          { name:'Auftragsverarbeitungsvertrag (AVV)', meta:'Vertrag · PDF', href:'AVV.dc.html', pending:false },
          { name:'Technische & organisatorische Massnahmen (TOMs)', meta:'Dokument', href:'#toms', pending:true },
          { name:'Subprozessoren-Liste', meta:'Liste', href:'Subprozessoren.dc.html', pending:false },
          { name:'Hosting-Fakten — Green, Lupfig AG', meta:'Faktenblatt', href:'#', pending:true },
          { name:'No-Training-Statement', meta:'Erklärung', href:'#', pending:true },
          { name:'Audit- & Zugriffskonzept', meta:'Dokument', href:'#', pending:true }
        ],
        hostingTitle:'Hosting',
        hostingBody:'Betrieben in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig AG, Schweiz). Die Zertifizierungen liegen bei Green. Eine eigene ISO-27001-Zertifizierung von EU-Cowork ist in Arbeit.',
        note:'Hinweis: Diese Seite ist eine Selbstdeklaration. Rechtsverbindliche Dokumente werden hier verlinkt, sobald finalisiert.',
        open:'Öffnen →', follows:'Dokument folgt'
      },
      en: {
        eyebrow:'// Trust Center',
        h1:'Security & Trust',
        sub:'Self-declaration, backed by real documents. Every statement here is evidenced or clearly marked as in progress.',
        claimsTitle:'What we assure',
        claims:[
          { t:'Operated in Switzerland', d:'ISO 27001-certified data centres by Green (Lupfig AG, Switzerland). Certificates held by Green, not by us.' },
          { t:'revDSG & GDPR', d:'Swiss and European data protection, contractually assured.' },
          { t:'No-training', d:'Your data never trains any model.' },
          { t:'Telemetry off by default', d:'No tracking without active consent.' },
          { t:'Audit logs', d:'Every tool and data access is traceable.' },
          { t:'MIT license', d:'No seat limit, no forced branding. Self-hosting free from 1 user.' }
        ],
        docsTitle:'Documents',
        docsSub:'Contracts and evidence to open.',
        docs:[
          { name:'Data Processing Agreement (DPA)', meta:'Contract · PDF', href:'AVV.dc.html', pending:false },
          { name:'Technical & organisational measures (TOMs)', meta:'Document', href:'#toms', pending:true },
          { name:'Subprocessor list', meta:'List', href:'Subprozessoren.dc.html', pending:false },
          { name:'Hosting facts — Green, Lupfig AG', meta:'Fact sheet', href:'#', pending:true },
          { name:'No-training statement', meta:'Statement', href:'#', pending:true },
          { name:'Audit & access concept', meta:'Document', href:'#', pending:true }
        ],
        hostingTitle:'Hosting',
        hostingBody:'Operated in ISO 27001-certified data centres by Green (Lupfig AG, Switzerland). The certifications are held by Green. EU-Cowork’s own ISO 27001 certification is in progress.',
        note:'Note: this page is a self-declaration. Legally binding documents are linked here once finalised.',
        open:'Open →', follows:'To follow'
      }
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){
    const lang = this.state.lang || 'de';
    const base = this.C[lang] || this.C.de;
    const t = Object.assign({}, base, { docs: base.docs.map(d => ({
      name:d.name, meta:d.meta, href:d.href,
      cta: d.pending ? base.follows : base.open,
      ctaColor: d.pending ? '#8A96A2' : '#0B1E33',
      ctaBg: d.pending ? '#F1F3F5' : '#EAF3F7',
      ctaBorder: d.pending ? '#E4E8EC' : '#D6EDF5'
    })) });
    return { t };
  }
}
</script>
</body>
</html>
