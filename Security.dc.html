<noscript>
  <h1>Sicherheit &amp; Vertrauen</h1>
  <p>Selbstdeklaration, mit echten Dokumenten dahinter. Jede Aussage hier ist belegt oder klar als in Arbeit gekennzeichnet.</p>
  <h2>Was wir zusichern</h2>
  <ul>
    <li><strong>Betrieb in der Schweiz:</strong> ISO-27001-zertifizierte Rechenzentren von Green (Lupfig AG, Schweiz). Zertifikate von Green, nicht von uns.</li>
    <li><strong>revDSG &amp; DSGVO:</strong> Schweizer und europäischer Datenschutz, vertraglich zugesichert.</li>
    <li><strong>No-Training:</strong> Ihre Daten trainieren keine Modelle.</li>
    <li><strong>Telemetrie aus by default:</strong> Kein Tracking ohne aktive Zustimmung.</li>
    <li><strong>Audit-Logs:</strong> Jeder Tool- und Datenzugriff ist nachvollziehbar.</li>
    <li><strong>MIT-Lizenz:</strong> Kein Seat-Limit, kein Branding-Zwang. Self-Hosting gratis ab 1 User.</li>
  </ul>
  <h2>Hosting</h2>
  <p>Betrieben in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig AG, Schweiz). Die Zertifizierungen liegen bei Green. Eine eigene ISO-27001-Zertifizierung von EU Cowork AI ist in Arbeit.</p>

    <li><a href="/avv">Auftragsverarbeitungsvertrag (AVV)</a></li>

<div id="top">

      <div style="max-width:1120px; margin:0 auto;">
        <div style="font-family:var(--f-display); font-size:clamp(22px,3vw,30px); font-weight:500; color:#0B1E33; letter-spacing:-.016em;">{{ t.claimsTitle }}</div>
        <div style="margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;">

                <div style="font-family:var(--f-display); font-size:16.5px; font-weight:500; color:#0B1E33;">{{ c.t }}</div>
              </div>
              <div style="font-family:'Inter',sans-serif; font-size:14px; line-height:1.55; color:#5A6472; margin-top:11px;">{{ c.d }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

          <sc-for list="{{ t.docs }}" as="d" hint-placeholder-count="6">
            <a href="{{ d.href }}" style="display:flex; align-items:center; gap:16px; padding:17px 20px; border-bottom:1px solid #EEF1F4; text-decoration:none; transition:background .15s ease;" style-hover="background:#F7FAFC;">
              <span style="flex:0 0 auto; width:34px; height:34px; border-radius:8px; background:#F1F5F8; border:1px solid #E4E8EC; display:inline-flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:9px; color:#3E6E86;">DOC</span>

        </div>
      </div>
    </section>

    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        eyebrow:'// Trust Center',
        h1:'Sicherheit & Vertrauen',
        sub:'Selbstdeklaration, mit echten Dokumenten dahinter. Jede Aussage hier ist belegt oder klar als in Arbeit gekennzeichnet.',

        note:'Hinweis: Diese Seite ist eine Selbstdeklaration. Rechtsverbindliche Dokumente werden hier verlinkt, sobald finalisiert.',
        open:'Öffnen →', follows:'Dokument folgt'
      },
      en: {

  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){
    const lang = this.state.lang || 'de';
    const base = this.C[lang] || this.C.de;
    const t = Object.assign({}, base, { docs: base.docs.map(d => ({
      name:d.name, meta:d.meta, href:d.href,
      cta: d.pending ? base.follows : base.open,
      ctaColor: d.pending ? '#8A96A2' : '#0B1E33',
