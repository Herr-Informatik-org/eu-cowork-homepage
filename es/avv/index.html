<h1>Acuerdo de encargo de tratamiento (DPA)</h1>
<p>El presente contrato regula cómo Herr Informatik GmbH trata datos personales por cuenta del Cliente cuando explota el servicio EU Cowork AI en modalidad gestionada. Se rige por el art. 28 RGPD y por el art. 9 de la Ley Federal suiza revisada de Protección de Datos (nLPD, abreviatura alemana DSG) y consta de diecisiete secciones y dos anexos.</p>
<h2>1 Partes, objeto, orden de prelación y definiciones</h2>
<p>Las partes del presente contrato son Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, n.º de identificación de empresa CHE-112.168.836 (en adelante «el Proveedor»), y el Cliente. «EU Cowork AI» es la denominación del servicio y no es parte contratante. El objeto es el tratamiento de datos personales por cuenta del Cliente en la explotación gestionada del servicio. El Cliente es responsable del tratamiento (art. 4, apdo. 7, RGPD, art. 5, letra j, nLPD) y decide sobre los fines y los medios; el Proveedor es encargado del tratamiento. El Proveedor es responsable del tratamiento por cuenta propia únicamente respecto de sus datos de facturación, de los registros de seguridad y de explotación de su propia infraestructura, de los datos de contacto de los interlocutores contractuales y de sus obligaciones legales de acreditación; a ello se aplica su declaración de protección de datos. El presente contrato prevalece sobre las condiciones generales; la ficción de aprobación del n.º 12 de las condiciones generales no le resulta aplicable. Forman parte integrante del contrato los anexos 1 y 2 en su versión fechada y la lista de subencargados del tratamiento. El presente contrato emplea de forma equivalente la terminología del RGPD y la de la nLPD; las nociones de encargado del tratamiento y de subencargado del tratamiento abarcan en él las funciones correspondientes en ambos ordenamientos.</p>
<h2>2 Ámbito de aplicación y estado del servicio</h2>
<p>El presente contrato se aplica a la explotación gestionada en la infraestructura del Proveedor. En caso de explotación autónoma del software de código abierto en la infraestructura propia del Cliente, ningún dato llega al Proveedor; no surge encargo de tratamiento alguno y el presente contrato queda sin objeto, mientras no se acuerden por separado prestaciones de explotación o de soporte con acceso a datos. El servicio gestionado se encuentra en construcción. Las medidas que hoy no están implantadas no están garantizadas.</p>
<h2>3 Categorías especiales y secretos profesionales</h2>
<p>El servicio no está concebido para categorías especiales de datos personales (art. 9 y art. 10 RGPD) ni para datos personales especialmente dignos de protección (art. 5, letra c, nLPD). Sin acuerdo escrito separado sobre garantías adicionales, el Cliente no puede introducir tales datos e instruye a sus usuarios en consecuencia. El servicio no impide técnicamente su introducción. Si tales datos llegan igualmente al servicio, se aplican las mismas medidas técnicas y organizativas que a todos los demás contenidos; de su licitud responde el Cliente. Los clientes sujetos a un secreto profesional o de función (entre otros, el art. 321 del Código Penal suizo y el art. 47 de la Ley de Bancos) solo pueden emplear el servicio previo acuerdo escrito separado.</p>
<h2>4 Instrucciones</h2>
<p>El Cliente imparte las instrucciones en forma textual a info@herr-informatik.ch. También vale como instrucción documentada la configuración en el panel de administración, en particular los plazos de conservación, la selección de modelos, las conexiones y los permisos, la búsqueda web y la función de memoria, así como la exportación y la supresión de personas concretas. El Proveedor documenta las instrucciones recibidas. Las instrucciones comprendidas en el alcance de prestaciones acordado y en los ajustes previstos en el panel de administración quedan cubiertas por la remuneración. Las instrucciones que vayan más allá solo son ejecutadas por el Proveedor en la medida en que ello sea técnica y jurídicamente posible y exigible para él, y contra remuneración según el tiempo empleado. Si la ejecución no es posible o no es exigible, el Proveedor lo comunica; no existe obligación de ejecución. Si, a juicio del Proveedor, una instrucción infringe el RGPD, la nLPD u otras disposiciones de protección de datos, se lo comunica al Cliente sin dilación (art. 28, apdo. 3, párrafo segundo, RGPD). Puede suspender la ejecución de la instrucción afectada hasta su aclaración, sin incurrir por ello en incumplimiento del contrato. Si el Cliente mantiene una instrucción manifiestamente ilícita, el Proveedor puede negarse a ejecutarla y resolver la parte de la prestación afectada.</p>
<h2>5 Obligaciones y garantías del Cliente</h2>
<p>El Cliente responde de la licitud de la recogida y de sus instrucciones, dispone de una base jurídica propia e informa a los interesados. Administra las cuentas, los roles y los permisos y bloquea a los usuarios que hayan causado baja. Responde de las conexiones que configura, de las cuentas de servicio allí depositadas y del alcance de sus permisos, así como de los puntos de acceso de modelos que integre. Garantiza que al tratamiento no se opone ningún deber legal o contractual de secreto (art. 9 nLPD) y comunica sin dilación todo deber que surja con posterioridad. Antes del inicio del tratamiento, el Cliente se ha cerciorado de que el Proveedor puede garantizar la seguridad de los datos; a tal fin le sirven el anexo 2 y la información del Trust Center. El Proveedor trata los datos únicamente del modo en que el propio Cliente estaría autorizado a tratarlos (art. 9 nLPD).</p>
<h2>6 Confidencialidad de las personas intervinientes</h2>
<p>El Proveedor emplea únicamente a personas sujetas a un compromiso de confidencialidad o a un deber legal de secreto adecuado (art. 28, apdo. 3, letra b, RGPD). El compromiso se adquiere en forma textual antes del inicio de la actividad, subsiste sin límite temporal tras la finalización de la relación laboral o de encargo y se acredita a requerimiento. Las personas intervinientes reciben formación en materia de protección de datos.</p>
<h2>7 Medidas técnicas y organizativas y alcance de las garantías</h2>
<p>El Proveedor adopta las medidas exigidas por el art. 32 RGPD y el art. 8 nLPD; los detalles constan en el anexo 2. Puede adaptarlas al estado de la técnica sin descender por debajo del nivel de protección acordado. Se garantiza lo siguiente: las transmisiones por redes públicas entre el dispositivo del usuario y el servicio, así como entre los componentes del servicio, están cifradas conforme al estado de la técnica. En reposo, el cifrado de los soportes de datos forma parte del aprovisionamiento de los servidores; un cifrado adicional de registros individuales a nivel de aplicación no está garantizado. Cada cliente recibe una pila propia (base de datos, índice de búsqueda, almacenamiento de archivos, configuración, red, clave de inferencia). La línea de separación es esa pila y no la máquina física; varios clientes pueden compartir una máquina, y las imágenes de contenedor y un proxy inverso situado por delante se utilizan en común. Las intervenciones posteriores en el registro de acciones de administración se notan; no se garantiza una inalterabilidad técnica. Cuando la identidad de la persona se traslada hasta un sistema de destino conectado, el registro del Proveedor termina en el límite del sistema y rige el registro del sistema de destino. La explotación tiene lugar en centros de datos certificados según la norma ISO 27001; esa certificación corresponde a Green y no al Proveedor y no constituye una medida técnica propia. El Proveedor no dispone hoy de certificación propia; no existe informe SOC 2. Un proxy de salida con lista de autorización, el nivel de aislamiento más alto del entorno aislado de código y el aprovisionamiento automático de cuentas mediante SCIM no son objeto del contrato y no están garantizados.</p>
<h2>8 Subencargados del tratamiento</h2>
<p>El Proveedor recurre a subencargados del tratamiento únicamente con la autorización previa del Cliente; respecto de las entidades que figuran en la lista de subencargados del tratamiento, el Cliente la otorga con la celebración del presente contrato. El Proveedor anuncia todo cambio con 30 días de antelación en forma textual, indicando el nombre, la persona jurídica, el domicilio, la finalidad y la base de la transferencia; el Cliente puede oponerse dentro de los 14 días desde la recepción por un motivo de protección de datos. Si el Cliente se opone en plazo y de forma motivada, las partes buscan una solución durante 30 días. Si no se alcanza ninguna, cualquiera de las partes puede resolver la parte de la prestación afectada con efecto al final del periodo de facturación en curso; las remuneraciones abonadas por anticipado se reembolsan a prorrata por el tiempo no disfrutado. El Cliente no dispone de pretensiones adicionales. El Proveedor obliga por escrito a cada subencargado del tratamiento a las mismas obligaciones, en lo esencial, que el presente contrato le impone a él (art. 28, apdo. 4, RGPD). Si un subencargado del tratamiento no cumple sus obligaciones de protección de datos, el Proveedor responde frente al Cliente de la conducta de aquel como de la propia. Los componentes que el Proveedor explota en su propia infraestructura no son subencargados del tratamiento; ello rige para el servicio de búsqueda alojado por él mismo.</p>
<h2>9 Lugar del tratamiento, terceros países y requerimientos de autoridades</h2>
<p>El almacenamiento y la explotación tienen lugar en Suiza, y la inferencia de los modelos en la UE o en el EEE; las entidades empleadas resultan de la lista de subencargados del tratamiento. Se señalan dos excepciones. Las consultas de la búsqueda web se remiten a motores de búsqueda externos sin identidad del usuario y pueden con ello abandonar el espacio de la UE, del EEE y de Suiza; la afirmación de que todo permanece en Europa rige para el almacenamiento y la inferencia, no para la propia consulta de búsqueda. Cabe integrar un proveedor de modelos adicional situado fuera de Europa. Si así ocurre en la instancia del Cliente, la garantía relativa a la UE no rige para ese proveedor y la base de la transferencia corresponde al Cliente como responsable del tratamiento. Para Suiza existe una decisión de adecuación de la Comisión Europea y, para los Estados del EEE, una base conforme al art. 16 nLPD; en caso de domicilio fuera de ese espacio, la transferencia se apoya en las cláusulas contractuales tipo de la Comisión Europea junto con un examen de la situación jurídica en el Estado de destino y, además, en una base suiza autónoma. Sin instrucción del Cliente, el Proveedor solo transfiere cuando está jurídicamente obligado a ello; ante un requerimiento de entrega examina su licitud, agota los recursos jurídicos exigibles, limita la entrega a lo jurídicamente debido e informa al Cliente tan pronto como resulte admisible.</p>
<h2>10 Sin entrenamiento con datos del Cliente</h2>
<p>El Proveedor no utiliza los datos del Cliente para el entrenamiento o la mejora de modelos ni los cede con ese fin. Configura los accesos que él explota de modo que los contenidos no se conserven en la pasarela y no se utilicen para entrenamiento, en la medida en que la pasarela ofrezca ese ajuste. Según indica la pasarela, los metadatos de uso, como marcas de tiempo y número de tokens, se conservan allí hasta doce meses. Si el Cliente integra un punto de acceso de modelo propio, rigen las condiciones de este; el compromiso del Proveedor no se extiende a ese punto de acceso.</p>
<h2>11 Asistencia al Cliente y su remuneración</h2>
<p>El Proveedor asiste al Cliente, en la medida de lo posible y teniendo en cuenta la naturaleza del tratamiento, en la atención de las solicitudes de los interesados (art. 28, apdo. 3, letra e, RGPD). A tal fin, el servicio pone a disposición en el panel de administración la exportación de datos y la supresión por persona, incluida la supresión completa; el Cliente ejecuta él mismo estas operaciones. Si un interesado se dirige directamente al Proveedor, este traslada la solicitud al Cliente e informa de ello al interesado. Si en un caso concreto las funciones del servicio no bastan, el Proveedor asiste en la medida de lo posible contra remuneración según el tiempo empleado. En la evaluación de impacto relativa a la protección de datos y en una eventual consulta previa (art. 35 y 36 RGPD, art. 22 y 23 nLPD) asiste teniendo en cuenta la información de que dispone y facilita los datos que obran en su poder, por regla general: las operaciones de tratamiento y los flujos de datos, los subencargados del tratamiento y las conexiones con terceros países, las medidas técnicas y organizativas, la conservación y la supresión. La asistencia de alcance habitual queda cubierta por la remuneración; si el esfuerzo supera claramente esa medida, el Proveedor lo factura conforme a las tarifas acordadas, previa comunicación del esfuerzo previsible. Si el Cliente mantiene su solicitud, la remuneración se considera acordada.</p>
<h2>12 Notificación de violaciones</h2>
<p>El Proveedor notifica al Cliente toda violación de la seguridad de los datos personales en forma textual, al órgano designado por este, sin dilación y a más tardar dentro de las 48 horas desde que el Proveedor ha obtenido conocimiento cierto de una violación en el sentido del art. 4, apdo. 12, RGPD. La notificación contiene la información prevista en el art. 33, apdo. 3, RGPD, en la medida en que obre en poder del Proveedor; se completa de forma continuada. La notificación no constituye reconocimiento de un incumplimiento. La notificación a la autoridad de control competente en la UE (art. 33 RGPD), la comunicación al EDÖB (art. 24 nLPD, que prevé un umbral de riesgo más elevado y ningún plazo fijo) y la comunicación a los interesados incumben al Cliente.</p>
<h2>13 Acreditación, verificación, autoridades y registro</h2>
<p>El Proveedor pone a disposición del Cliente la información necesaria para acreditar el cumplimiento del art. 28 RGPD y permite las verificaciones (art. 28, apdo. 3, letra h, RGPD); facilita la información en forma textual dentro de 30 días. El Cliente puede realizar una auditoría por año natural, por sí mismo o a través de un auditor, con un preaviso de 30 días y durante el horario comercial ordinario. Tras un incidente sujeto a notificación que afecte a los datos de ese Cliente, o por orden de una autoridad de control, es admisible una auditoría extraordinaria. El auditor está obligado a guardar secreto y no puede ser competidor del Proveedor. Los certificados, informes de auditoría y dictámenes sustituyen a una verificación in situ en la medida en que cubran la finalidad de la verificación; no excluyen una inspección si quedan puntos abiertos. Frente a los subencargados del tratamiento, el Proveedor procura contractualmente estos derechos al Cliente o puede, a su elección, llevar a cabo la verificación en su lugar. El Cliente soporta los costes de la verificación. El Cliente remunera conforme a las tarifas acordadas el esfuerzo del Proveedor de preparación, acompañamiento y seguimiento. Si el motivo de la verificación se basa en un incumplimiento imputable al Proveedor, este soporta su propio esfuerzo. El Proveedor coopera a requerimiento con el EDÖB y con la autoridad de control competente; el punto de contacto es info@herr-informatik.ch. Lleva un registro de las categorías de actividades de tratamiento (art. 30, apdo. 2, RGPD, art. 12 nLPD) y facilita a requerimiento los datos que conciernen al Cliente. En la medida en que esté sujeto a la obligación del art. 27 RGPD, designa un representante en la Unión y lo indica en su aviso legal.</p>
<h2>14 Conservación, devolución y supresión</h2>
<p>El presente contrato comienza y termina con el contrato principal; sus obligaciones subsisten hasta la conclusión de la devolución y la supresión, y las obligaciones de confidencialidad sin límite temporal. El Cliente fija el plazo de conservación en el panel de administración; fijar y modificar ese plazo vale como instrucción. De fábrica no hay plazo fijado: sin plazo fijado, las conversaciones permanecen almacenadas hasta que los usuarios o la administración las supriman; si hay un plazo fijado, las conversaciones vencidas se eliminan junto con sus mensajes, los enlaces compartidos y las entradas del índice de búsqueda. Los datos de facturación no quedan comprendidos en ese plazo. Al término del contrato, el Cliente elige entre devolución y supresión (art. 28, apdo. 3, letra g, RGPD). Si el Cliente no comunica nada hasta el final de la vigencia, el Proveedor suprime. Puede solicitarse una exportación hasta 30 días después del término del contrato, en un formato corriente y legible por máquina a elección del Proveedor; en su alcance estándar es gratuita, y las preparaciones que vayan más allá se facturan según el tiempo empleado. Los datos contenidos en las copias de seguridad no se suprimen individualmente; se extinguen con el correspondiente ciclo de copia, a más tardar dentro de seis meses desde el término del contrato. Hasta entonces permanecen bloqueados y se tratan exclusivamente para la recuperación en caso de emergencia. Quedan excluidos de la supresión los registros de auditoría y de acceso, los datos de facturación y los datos sujetos a una obligación legal de conservación; estos se bloquean y se suprimen al expirar la obligación. A requerimiento, el Proveedor confirma la supresión en forma textual.</p>
<h2>15 Responsabilidad</h2>
<p>Para los daños derivados del tratamiento de datos personales prevalecen las disposiciones legales imperativas, en particular el art. 82 RGPD. En lo demás rige el n.º 10 de las condiciones generales. La responsabilidad del Proveedor derivada del presente contrato y en relación con él se limita, por cada evento dañoso y en total por año contractual, a la remuneración que el Cliente haya pagado en los doce meses anteriores al evento que originó el daño. La limitación no rige para el dolo y la culpa grave ni allí donde una limitación no sea legalmente admisible. El Proveedor soporta las multas y sanciones impuestas al Cliente solo en la medida de su cuota de responsabilidad conforme al art. 82, apdo. 5, RGPD. El Proveedor no responde de los daños derivados de las instrucciones del Cliente, de su configuración, de los puntos de acceso de modelos por él integrados o de contenidos que haya introducido en contra de la sección 3; el Cliente lo mantiene indemne en esa medida.</p>
<h2>16 Derecho aplicable, fuero y versiones lingüísticas</h2>
<p>Se aplica el derecho suizo, con exclusión de las normas de conflicto. El fuero exclusivo es Windisch, cantón de Argovia, en la medida en que la ley lo permita. Quedan reservados los fueros imperativos de los interesados, en particular conforme al Convenio de Lugano, la competencia de las autoridades de control y la aplicabilidad directa del RGPD. El presente contrato existe en cinco idiomas; es determinante la versión alemana.</p>
<h2>17 Disposiciones finales</h2>
<p>Las modificaciones y adiciones requieren la forma textual y el consentimiento de ambas partes. Se exceptúan la actualización de la lista de subencargados del tratamiento conforme al procedimiento acordado a tal efecto y el desarrollo de las medidas técnicas y organizativas dentro de los límites de la prohibición de empeoramiento. Estado: agosto de 2026, versión 1.0.</p>
<h2>A1 Anexo 1: descripción del tratamiento</h2>
<p>Fines: explotación de la función de chat y de asistencia, remisión de las entradas al proveedor de inferencia para generar respuestas, búsqueda web con indicación de fuentes, llamadas a sistemas conectados a través de la pasarela MCP y de conexiones directas, generación de archivos, capacidad de búsqueda mediante un índice de búsqueda, almacenamiento automatizado de entradas de memoria, registro del uso y de la administración, copia de seguridad de los datos, resolución de incidencias y soporte, facturación. Operaciones: recogida, registro, organización, conservación, adaptación, extracción, consulta, utilización, comunicación por transmisión a subencargados del tratamiento, cotejo, limitación, supresión y destrucción. Tipos de datos: las entradas de los usuarios, incluidos los adjuntos y las respuestas generadas, los datos de cuenta y de perfil, los metadatos de uso (marcas de tiempo, elección del modelo, número de tokens), los datos de facturación, los registros de auditoría y de acceso, incluidos los registros de acciones de administración, los contenidos leídos de sistemas conectados a petición de los usuarios (por ejemplo ERP, SharePoint, almacenamientos de archivos), las consultas de la búsqueda web, así como las entradas de memoria que el servicio deduce de las conversaciones y almacena sin una acción separada de los usuarios. Interesados: los empleados del Cliente y sus auxiliares, los contactos comerciales, los clientes del Cliente, los proveedores y sus empleados, las candidatas y los candidatos, así como todas las demás personas mencionadas en textos, en adjuntos o en contenidos de sistemas conectados. En el marco del presente contrato, el Proveedor no adopta decisiones automatizadas en el sentido del art. 22 RGPD; si las salidas del servicio se emplean para tales decisiones lo determina únicamente el Cliente.</p>
<h2>A2 Anexo 2: medidas técnicas y organizativas</h2>
<p>Acceso: solo obtienen acceso a los sistemas del Cliente personas del Proveedor designadas nominalmente, en la medida en que ello sea necesario para la explotación, el mantenimiento, la resolución de incidencias o el soporte; a requerimiento, el Proveedor indica ese círculo de personas. Todo acceso administrativo queda registrado. El acceso a contenidos de los usuarios solo tiene lugar a petición del Cliente o para resolver una incidencia concreta, por regla general conforme al principio de doble control; si una emergencia exige la intervención inmediata, cabe apartarse de ello, lo que se documenta con posterioridad. Registros: el registro de acciones de administración está encadenado, cada entrada lleva una suma de comprobación sobre la anterior y una comprobación integrada avisa de una cadena interrumpida; el Cliente puede consultar estos registros y exportarlos como CSV. Nivel de protección: seudonimización en la medida compatible con la finalidad; cifrado de la transmisión y de los soportes de datos; confidencialidad, integridad, disponibilidad y resiliencia de los sistemas; rápida recuperación tras un incidente; verificación periódica de la eficacia; separación de los clientes conforme a la sección 7; copias de seguridad periódicas. El presente anexo se aplica en su respectiva versión fechada.</p>
<p>Nota: el presente texto no constituye asesoramiento jurídico. Pasa a ser vinculante con la firma de ambas partes o con la aceptación en el marco del contrato principal.</p>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        back:'Zurück zum Trust Center', status:'Stand: August 2026',
        h1:'Auftragsverarbeitungsvertrag (AVV)',
        intro:'Dieser Vertrag regelt, wie die Herr Informatik GmbH personenbezogene Daten im Auftrag des Kunden bearbeitet, wenn sie den Dienst EU Cowork AI betreut betreibt. Er richtet sich nach Art. 28 DSGVO und Art. 9 des revidierten Schweizer Datenschutzgesetzes (DSG) und besteht aus siebzehn Abschnitten und zwei Anlagen.',
        sections:[
          { n:'1', t:'Parteien, Gegenstand, Rangverhältnis und Begriffe', b:'Vertragsparteien sind die Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, UID CHE-112.168.836 (nachfolgend „die Anbieterin"), und der Kunde. „EU Cowork AI" ist die Bezeichnung des Dienstes und keine Vertragspartei. Gegenstand ist die Bearbeitung personenbezogener Daten im Auftrag des Kunden beim betreuten Betrieb des Dienstes. Der Kunde ist Verantwortlicher (Art. 4 Ziff. 7 DSGVO, Art. 5 lit. j DSG) und entscheidet über Zwecke und Mittel, die Anbieterin ist Auftragsverarbeiterin. Eigene Verantwortliche ist die Anbieterin ausschliesslich für ihre Abrechnungsdaten, für die Sicherheits- und Betriebsprotokolle ihrer eigenen Infrastruktur, für Kontaktdaten der Vertragsansprechpartner und für gesetzliche Nachweispflichten; dafür gilt ihre Datenschutzerklärung. Dieser Vertrag geht den Allgemeinen Geschäftsbedingungen vor; die Genehmigungsfiktion nach Ziff. 12 AGB gilt für ihn nicht. Vertragsbestandteil sind die Anlagen 1 und 2 in ihrer datierten Fassung und die Liste der Unterauftragsverarbeiter. Die Begriffe Auftragsverarbeiter und Auftragsbearbeiter sowie Unterauftragsverarbeiter und Unterauftragsbearbeiter werden in diesem Vertrag gleichbedeutend verwendet.' },
          { n:'2', t:'Geltungsbereich und Stand des Dienstes', b:'Dieser Vertrag gilt für den betreuten Betrieb auf der Infrastruktur der Anbieterin. Beim Selbstbetrieb der quelloffenen Software auf eigener Infrastruktur des Kunden fliessen keine Daten zur Anbieterin; es entsteht keine Auftragsbearbeitung, und dieser Vertrag bleibt gegenstandslos, solange nicht gesondert Betriebs- oder Supportleistungen mit Datenzugriff vereinbart werden. Der betreute Dienst befindet sich im Aufbau. Massnahmen, die heute nicht umgesetzt sind, sind nicht zugesichert.' },
          { n:'3', t:'Besondere Kategorien und Berufsgeheimnisse', b:'Der Dienst ist nicht auf besondere Kategorien personenbezogener Daten (Art. 9 und Art. 10 DSGVO) und nicht auf besonders schützenswerte Personendaten (Art. 5 lit. c DSG) ausgelegt. Ohne gesonderte schriftliche Vereinbarung über Zusatzgarantien darf der Kunde solche Daten nicht einbringen und weist seine Nutzer entsprechend an. Der Dienst verhindert die Eingabe technisch nicht. Gelangen solche Daten dennoch hinein, gelten dieselben technischen und organisatorischen Massnahmen wie für alle übrigen Inhalte; für die Zulässigkeit steht der Kunde ein. Kunden, die einem Berufs- oder Amtsgeheimnis unterstehen (unter anderem Art. 321 StGB, Art. 47 BankG), dürfen den Dienst nur nach gesonderter schriftlicher Vereinbarung einsetzen.' },
          { n:'4', t:'Weisungen', b:'Der Kunde erteilt Weisungen in Textform an info@herr-informatik.ch. Als dokumentierte Weisung gilt auch die Konfiguration im Admin-Panel, namentlich Aufbewahrungsfristen, Modellauswahl, Anbindungen und Rechte, Websuche und Gedächtnisfunktion, Export und Löschung einzelner Personen. Die Anbieterin dokumentiert erhaltene Weisungen. Weisungen im Rahmen des vereinbarten Leistungsumfangs und der im Admin-Panel vorgesehenen Einstellungen sind mit dem Entgelt abgegolten. Weisungen, die darüber hinausgehen, setzt die Anbieterin nur um, soweit dies technisch und rechtlich möglich und ihr zumutbar ist, und gegen Vergütung nach Aufwand. Ist die Umsetzung nicht möglich oder nicht zumutbar, teilt die Anbieterin dies mit; eine Umsetzungspflicht besteht nicht. Verstösst eine Weisung nach Auffassung der Anbieterin gegen die DSGVO, das DSG oder andere Datenschutzbestimmungen, teilt sie dies dem Kunden unverzüglich mit (Art. 28 Abs. 3 UAbs. 2 DSGVO). Sie darf die Ausführung der betroffenen Weisung bis zur Klärung aussetzen, ohne dadurch vertragsbrüchig zu werden. Hält der Kunde an einer offensichtlich rechtswidrigen Weisung fest, kann die Anbieterin die Ausführung verweigern und den betroffenen Leistungsteil kündigen.' },
          { n:'5', t:'Pflichten und Zusicherungen des Kunden', b:'Der Kunde verantwortet die Rechtmässigkeit der Erhebung und seiner Weisungen, verfügt über eine eigene Rechtsgrundlage und informiert die betroffenen Personen. Er verwaltet Konten, Rollen und Berechtigungen und sperrt ausgeschiedene Nutzer. Er verantwortet die von ihm konfigurierten Anbindungen, die dort hinterlegten Dienstkonten und deren Rechteumfang sowie von ihm eingebundene Modell-Endpunkte. Er sichert zu, dass der Bearbeitung keine gesetzliche oder vertragliche Geheimhaltungspflicht entgegensteht (Art. 9 DSG), und teilt eine später entstehende Pflicht unverzüglich mit. Der Kunde hat sich vor Beginn der Bearbeitung vergewissert, dass die Anbieterin die Datensicherheit gewährleisten kann; die Anlage 2 und die Angaben im Trust Center dienen ihm dazu. Die Anbieterin bearbeitet die Daten nur so, wie der Kunde selbst sie bearbeiten dürfte (Art. 9 DSG).' },
          { n:'6', t:'Vertraulichkeit der eingesetzten Personen', b:'Die Anbieterin setzt nur Personen ein, die zur Vertraulichkeit verpflichtet sind oder einer angemessenen gesetzlichen Verschwiegenheitspflicht unterliegen (Art. 28 Abs. 3 lit. b DSGVO). Die Verpflichtung erfolgt vor Aufnahme der Tätigkeit in Textform, gilt nach Ende des Arbeits- oder Auftragsverhältnisses zeitlich unbegrenzt fort und wird auf Verlangen nachgewiesen. Die eingesetzten Personen werden im Datenschutz geschult.' },
          { n:'7', t:'Technische und organisatorische Massnahmen und Umfang der Zusicherungen', b:'Die Anbieterin trifft die nach Art. 32 DSGVO und Art. 8 DSG erforderlichen Massnahmen; die Einzelheiten stehen in der Anlage 2. Sie darf sie an den Stand der Technik anpassen, ohne das vereinbarte Schutzniveau zu unterschreiten. Zugesichert ist Folgendes: Übertragungen über öffentliche Netze zwischen Nutzergerät und Dienst sowie zwischen den Komponenten des Dienstes sind nach dem Stand der Technik verschlüsselt. Im Ruhezustand ist die Verschlüsselung der Datenträger Teil der Serverbereitstellung; eine darüber hinausgehende Verschlüsselung einzelner Datensätze auf Anwendungsebene wird nicht zugesichert. Jeder Kunde erhält einen eigenen Stack (Datenbank, Suchindex, Dateiablage, Konfiguration, Netz, Inferenz-Schlüssel). Die Trennlinie ist dieser Stack und nicht die physische Maschine; mehrere Kunden können sich eine Maschine teilen, wobei Container-Images und ein vorgelagerter Reverse-Proxy gemeinsam genutzt werden. Nachträgliche Eingriffe in das Protokoll über Administratorhandlungen fallen auf; eine technische Unveränderbarkeit wird nicht zugesichert. Wird die Identität der Person bis in ein angebundenes Zielsystem durchgereicht, endet die Protokollierung der Anbieterin an der Systemgrenze, und es gilt die Protokollierung des Zielsystems. Der Betrieb erfolgt in nach ISO 27001 zertifizierten Rechenzentren; diese Zertifizierung liegt bei Green, nicht bei der Anbieterin, und ist keine eigene technische Massnahme. Die Anbieterin verfügt heute über keine eigene Zertifizierung; ein SOC-2-Bericht liegt nicht vor. Ein Egress-Proxy mit Freigabeliste, die höchste Isolationsstufe der Code-Sandbox und die automatische Kontenbereitstellung über SCIM sind nicht Vertragsgegenstand und werden nicht zugesichert.' },
          { n:'8', t:'Unterauftragsverarbeiter', b:'Die Anbieterin zieht Unterauftragsverarbeiter nur mit vorgängiger Genehmigung des Kunden bei; für die in der Liste der Unterauftragsverarbeiter aufgeführten Stellen erteilt er sie mit Abschluss dieses Vertrags. Einen Wechsel kündigt die Anbieterin 30 Tage im Voraus in Textform an, unter Angabe von Name, Rechtsperson, Sitz, Zweck und Übermittlungsgrundlage; der Kunde kann innert 14 Tagen ab Zugang aus einem datenschutzrechtlichen Grund widersprechen. Widerspricht der Kunde fristgerecht und begründet, suchen die Parteien während 30 Tagen eine Lösung. Kommt keine zustande, kann jede Partei den betroffenen Leistungsteil auf das Ende des laufenden Abrechnungszeitraums kündigen; im Voraus bezahlte Entgelte werden für die nicht bezogene Zeit anteilig zurückerstattet. Weitergehende Ansprüche des Kunden bestehen nicht. Die Anbieterin verpflichtet jeden Unterauftragsverarbeiter schriftlich auf im Wesentlichen dieselben Pflichten, wie sie dieser Vertrag ihr auferlegt (Art. 28 Abs. 4 DSGVO). Kommt ein Unterauftragsverarbeiter seinen Datenschutzpflichten nicht nach, haftet die Anbieterin dem Kunden gegenüber für dessen Verhalten wie für eigenes. Bestandteile, welche die Anbieterin auf eigener Infrastruktur betreibt, sind keine Unterauftragsverarbeiter; das gilt für den selbst gehosteten Suchdienst.' },
          { n:'9', t:'Ort der Bearbeitung, Drittland und behördliche Verlangen', b:'Speicherung und Betrieb erfolgen in der Schweiz, die Modell-Inferenz in der EU oder im EWR; die eingesetzten Stellen ergeben sich aus der Liste der Unterauftragsverarbeiter. Zwei Ausnahmen sind benannt. Suchanfragen der Websuche werden ohne Nutzeridentität an externe Suchmaschinen weitergeleitet und können dabei den EU-, EWR- und Schweizer Raum verlassen; die Aussage, dass alles in Europa bleibt, gilt für Speicherung und Inferenz, nicht für die Suchanfrage selbst. Ein zusätzlicher Modellanbieter ausserhalb Europas lässt sich einbinden. Ist das in der Instanz des Kunden der Fall, gilt die EU-Zusicherung für diesen Anbieter nicht, und die Übermittlungsgrundlage liegt beim Kunden als Verantwortlichem. Für die Schweiz besteht ein Angemessenheitsbeschluss der Europäischen Kommission, für die Staaten des EWR eine Grundlage nach Art. 16 DSG; bei einem Sitz ausserhalb dieses Raums stützt sich die Übermittlung auf die Standardvertragsklauseln der Europäischen Kommission samt Prüfung der Rechtslage im Zielstaat und daneben auf eine eigenständige schweizerische Grundlage. Ohne Weisung des Kunden übermittelt die Anbieterin nur, wenn sie dazu rechtlich verpflichtet ist; bei einer Anordnung auf Herausgabe prüft sie deren Rechtmässigkeit, schöpft die zumutbaren Rechtsmittel aus, beschränkt die Herausgabe auf das rechtlich Gebotene und benachrichtigt den Kunden so früh, wie es zulässig ist.' },
          { n:'10', t:'Kein Training mit Kundendaten', b:'Die Anbieterin verwendet Kundendaten nicht für das Training oder die Verbesserung von Modellen und gibt sie zu diesem Zweck nicht weiter. Sie setzt die von ihr betriebenen Zugänge so, dass Inhalte beim Gateway nicht aufbewahrt und nicht für Training verwendet werden, soweit das Gateway diese Einstellung anbietet. Nutzungs-Metadaten wie Zeitstempel und Token-Zahlen bewahrt das Gateway nach dessen Angaben bis zu zwölf Monate auf. Bindet der Kunde einen eigenen Modell-Endpunkt ein, gelten dessen Bedingungen; die Zusage der Anbieterin erstreckt sich nicht auf diesen Endpunkt.' },
          { n:'11', t:'Unterstützung des Kunden und deren Vergütung', b:'Die Anbieterin unterstützt den Kunden nach Möglichkeit und unter Berücksichtigung der Art der Bearbeitung dabei, Anträgen betroffener Personen nachzukommen (Art. 28 Abs. 3 lit. e DSGVO). Der Dienst stellt dafür im Admin-Panel Datenexport und Löschung pro Person bereit, einschliesslich der Volllöschung; der Kunde führt diese Vorgänge selbst aus. Wendet sich eine betroffene Person direkt an die Anbieterin, leitet diese die Anfrage an den Kunden weiter und informiert die Person darüber. Reichen die Funktionen des Dienstes im Einzelfall nicht aus, unterstützt die Anbieterin nach Möglichkeit gegen Vergütung nach Aufwand. Bei der Datenschutz-Folgenabschätzung und einer allfälligen Vorabkonsultation (Art. 35 und 36 DSGVO, Art. 22 und 23 DSG) unterstützt sie unter Berücksichtigung der ihr zur Verfügung stehenden Informationen und stellt die ihr vorliegenden Angaben zur Verfügung, in der Regel: Bearbeitungsvorgänge und Datenflüsse, Unterauftragsverarbeiter und Drittlandbezüge, technische und organisatorische Massnahmen, Aufbewahrung und Löschung. Unterstützung im üblichen Umfang ist mit dem Entgelt abgegolten; übersteigt der Aufwand dieses Mass deutlich, verrechnet die Anbieterin ihn nach den vereinbarten Sätzen, nach vorgängiger Mitteilung des voraussichtlichen Aufwands. Hält der Kunde an seinem Verlangen fest, gilt die Vergütung als vereinbart.' },
          { n:'12', t:'Meldung von Verletzungen', b:'Die Anbieterin meldet dem Kunden eine Verletzung des Schutzes personenbezogener Daten in Textform an die von ihm benannte Stelle, unverzüglich, spätestens innert 48 Stunden, nachdem die Anbieterin gesicherte Kenntnis von einer Verletzung im Sinne von Art. 4 Ziff. 12 DSGVO erlangt hat. Die Meldung enthält die Angaben nach Art. 33 Abs. 3 DSGVO, soweit sie der Anbieterin vorliegen; sie wird fortlaufend ergänzt. Die Meldung ist kein Anerkenntnis einer Pflichtverletzung. Die Meldung an die zuständige Aufsichtsbehörde in der EU (Art. 33 DSGVO) sowie die Meldung an den EDÖB (Art. 24 DSG, die eine höhere Risikoschwelle und keine feste Frist kennt) und die Benachrichtigung der betroffenen Personen obliegen dem Kunden.' },
          { n:'13', t:'Nachweis, Überprüfung, Behörden und Verzeichnis', b:'Die Anbieterin stellt dem Kunden die zum Nachweis der Einhaltung von Art. 28 DSGVO erforderlichen Informationen zur Verfügung und ermöglicht Überprüfungen (Art. 28 Abs. 3 lit. h DSGVO); Auskünfte erteilt sie in Textform innert 30 Tagen. Der Kunde kann ein Audit pro Kalenderjahr selbst oder durch einen Prüfer durchführen lassen, mit 30 Tagen Vorankündigung und während der ordentlichen Geschäftszeiten. Nach einem meldepflichtigen Vorfall, der die Daten dieses Kunden betrifft, oder auf Anordnung einer Aufsichtsbehörde ist ein ausserplanmässiges Audit zulässig. Der Prüfer ist zur Verschwiegenheit verpflichtet und darf kein Wettbewerber der Anbieterin sein. Zertifikate, Prüfberichte und Testate ersetzen eine Prüfung vor Ort, soweit sie den Prüfzweck abdecken; sie schliessen eine Inspektion nicht aus, wenn offene Punkte bleiben. Gegenüber Unterauftragsverarbeitern verschafft die Anbieterin dem Kunden diese Rechte vertraglich oder kann die Prüfung nach ihrer Wahl stellvertretend durchführen. Der Kunde trägt die Kosten der Prüfung. Den Aufwand der Anbieterin für Vorbereitung, Begleitung und Nachbearbeitung vergütet der Kunde nach den vereinbarten Sätzen. Beruht der Prüfanlass auf einer von der Anbieterin zu vertretenden Pflichtverletzung, trägt sie ihren Aufwand selbst. Die Anbieterin arbeitet auf Anfrage mit dem EDÖB und der zuständigen Aufsichtsbehörde zusammen; Ansprechstelle ist info@herr-informatik.ch. Sie führt ein Verzeichnis der Kategorien von Bearbeitungstätigkeiten (Art. 30 Abs. 2 DSGVO, Art. 12 DSG) und stellt daraus die den Kunden betreffenden Angaben auf Verlangen zur Verfügung. Soweit sie der Pflicht nach Art. 27 DSGVO unterliegt, benennt sie einen Vertreter in der Union und weist ihn im Impressum aus.' },
          { n:'14', t:'Aufbewahrung, Rückgabe und Löschung', b:'Dieser Vertrag beginnt und endet mit dem Hauptvertrag; bis zum Abschluss von Rückgabe und Löschung gelten seine Pflichten fort, die Vertraulichkeitspflichten unbefristet. Der Kunde legt die Aufbewahrungsfrist im Admin-Panel fest; das Setzen und Ändern dieser Frist gilt als Weisung. Ab Werk ist keine Frist gesetzt: Ohne gesetzte Frist bleiben Konversationen gespeichert, bis Nutzer oder Administration sie löschen; ist eine Frist gesetzt, werden abgelaufene Konversationen samt Nachrichten, geteilten Links und Suchindex-Einträgen entfernt. Abrechnungsdaten sind von der Frist nicht erfasst. Nach Vertragsende wählt der Kunde zwischen Rückgabe und Löschung (Art. 28 Abs. 3 lit. g DSGVO). Teilt der Kunde bis zum Ende der Laufzeit nichts mit, löscht die Anbieterin. Ein Export kann bis 30 Tage nach Vertragsende angefordert werden, in einem gängigen, maschinenlesbaren Format nach Wahl der Anbieterin; im Standardumfang ist er unentgeltlich, weitergehende Aufbereitungen nach Aufwand. Daten in Sicherungskopien werden nicht einzeln gelöscht; sie laufen mit dem jeweiligen Sicherungszyklus aus, längstens innert sechs Monaten ab Vertragsende. Bis dahin bleiben sie gesperrt und werden ausschliesslich zur Wiederherstellung im Notfall bearbeitet. Von der Löschung ausgenommen sind die Audit- und Zugriffsprotokolle, die Abrechnungsdaten und Daten mit gesetzlicher Aufbewahrungspflicht; diese werden gesperrt und nach Ablauf der Pflicht gelöscht. Auf Verlangen bestätigt die Anbieterin die Löschung in Textform.' },
          { n:'15', t:'Haftung', b:'Für Schäden aus der Bearbeitung personenbezogener Daten gehen die zwingenden gesetzlichen Bestimmungen vor, namentlich Art. 82 DSGVO. Im Übrigen gilt Ziff. 10 der AGB. Die Haftung der Anbieterin aus und im Zusammenhang mit diesem Vertrag ist je Schadenereignis und insgesamt je Vertragsjahr auf das Entgelt begrenzt, das der Kunde in den zwölf Monaten vor dem schadenauslösenden Ereignis bezahlt hat. Die Begrenzung gilt nicht für Absicht und grobe Fahrlässigkeit sowie dort, wo eine Beschränkung gesetzlich unzulässig ist. Bussen und Sanktionen gegen den Kunden trägt die Anbieterin nur im Umfang ihres Verantwortungsanteils nach Art. 82 Abs. 5 DSGVO. Für Schäden aus Weisungen des Kunden, aus seiner Konfiguration, aus von ihm eingebundenen Modell-Endpunkten oder aus Inhalten, die er entgegen Abschnitt 3 eingebracht hat, haftet die Anbieterin nicht; der Kunde stellt sie insoweit frei.' },
          { n:'16', t:'Anwendbares Recht, Gerichtsstand und Sprachfassungen', b:'Es gilt schweizerisches Recht unter Ausschluss des Kollisionsrechts. Ausschliesslicher Gerichtsstand ist Windisch, Kanton Aargau, soweit gesetzlich zulässig. Vorbehalten bleiben die zwingenden Gerichtsstände betroffener Personen, namentlich nach dem Lugano-Übereinkommen, die Zuständigkeit der Aufsichtsbehörden und die unmittelbare Anwendbarkeit der DSGVO. Dieser Vertrag liegt in fünf Sprachen vor; massgeblich ist die deutsche Fassung.' },
          { n:'17', t:'Schlussbestimmungen', b:'Änderungen und Ergänzungen bedürfen der Textform und der Zustimmung beider Parteien. Davon ausgenommen sind die Aktualisierung der Liste der Unterauftragsverarbeiter nach dem dafür vereinbarten Verfahren und die Fortentwicklung der technischen und organisatorischen Massnahmen im Rahmen des Verschlechterungsverbots. Stand: August 2026, Version 1.0.' },
          { n:'A1', t:'Anlage 1: Beschreibung der Bearbeitung', b:'Zwecke: Betrieb der Chat- und Assistenzfunktion, Weiterleitung von Eingaben an den Inferenz-Anbieter zur Erzeugung von Antworten, Websuche mit Quellenangabe, Aufrufe angebundener Systeme über das MCP-Gateway und über direkte Anbindungen, Erzeugung von Dateien, Durchsuchbarkeit über einen Suchindex, automatisierte Speicherung von Gedächtniseinträgen, Protokollierung von Nutzung und Administration, Datensicherung, Störungsbehebung und Support, Abrechnung. Vorgänge: Erheben, Erfassen, Organisieren, Speichern, Anpassen, Auslesen, Abfragen, Verwenden, Offenlegen durch Übermittlung an Unterauftragsverarbeiter, Verknüpfen, Einschränken, Löschen und Vernichten. Datenarten: Eingaben der Nutzer samt Anhängen und den erzeugten Antworten, Konto- und Profildaten, Metadaten der Nutzung (Zeitstempel, Modellwahl, Token-Zahlen), Abrechnungsdaten, Audit- und Zugriffsprotokolle einschliesslich der Protokolle über Administratorhandlungen, Inhalte, die auf Anforderung der Nutzer aus angebundenen Systemen gelesen werden (etwa ERP, SharePoint, Dateiablagen), Suchanfragen der Websuche sowie Gedächtniseinträge, die der Dienst aus Unterhaltungen ableitet und ohne gesonderte Handlung der Nutzer speichert. Betroffene Personen: Mitarbeitende des Kunden und dessen Hilfspersonen, Geschäftskontakte, Kunden des Kunden, Lieferanten und deren Mitarbeitende, Bewerberinnen und Bewerber sowie alle weiteren Personen, die in Texten, in Anhängen oder in Inhalten angebundener Systeme erwähnt werden. Die Anbieterin trifft im Rahmen dieses Vertrags keine automatisierten Entscheidungen im Sinne von Art. 22 DSGVO; ob Ausgaben des Dienstes zu solchen Entscheidungen verwendet werden, bestimmt allein der Kunde.' },
          { n:'A2', t:'Anlage 2: Technische und organisatorische Massnahmen', b:'Zugriff: Zugriff auf die Systeme des Kunden erhalten nur namentlich bestimmte Personen der Anbieterin, soweit dies für Betrieb, Wartung, Störungsbehebung oder Support erforderlich ist; auf Verlangen benennt die Anbieterin diesen Kreis. Jeder administrative Zugriff wird protokolliert. Ein Zugriff auf Inhalte der Nutzer erfolgt nur auf Anforderung des Kunden oder zur Behebung einer konkreten Störung, in der Regel nach dem Vier-Augen-Prinzip; verlangt ein Notfall den sofortigen Eingriff, kann davon abgewichen werden, was nachträglich dokumentiert wird. Protokolle: Das Protokoll über Administratorhandlungen ist verkettet, jeder Eintrag trägt eine Prüfsumme über den vorhergehenden, und eine eingebaute Prüfung meldet eine unterbrochene Kette; der Kunde kann diese Protokolle einsehen und als CSV exportieren. Schutzniveau: Pseudonymisierung, soweit mit dem Zweck vereinbar; Verschlüsselung der Übertragung und der Datenträger; Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme; rasche Wiederherstellung nach einem Zwischenfall; regelmässige Überprüfung der Wirksamkeit; Trennung der Kunden nach Abschnitt 7; regelmässige Sicherungskopien. Diese Anlage gilt in ihrer jeweils datierten Fassung.' }
        ],
        disclaimer:'Hinweis: Dieser Text stellt keine Rechtsberatung dar. Er wird mit der Unterzeichnung durch beide Parteien oder mit der Annahme im Rahmen des Hauptvertrags verbindlich.'
      },
      en: {
        back:'Back to Trust Center', status:'As of: August 2026',
        h1:'Data Processing Agreement (DPA)',
        intro:'This agreement governs how Herr Informatik GmbH processes personal data on behalf of the Customer when it operates the EU Cowork AI service as a managed service. It follows Art. 28 GDPR and Art. 9 of the revised Swiss Federal Act on Data Protection (revised FADP, German abbreviation DSG) and consists of seventeen sections and two annexes.',
        sections:[
          { n:'1', t:'Parties, subject matter, order of precedence and definitions', b:'The parties to this agreement are Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, company identification number CHE-112.168.836 (hereinafter “the Provider”), and the Customer. “EU Cowork AI” is the name of the service and not a party to this agreement. The subject matter is the processing of personal data on behalf of the Customer in the managed operation of the service. The Customer is the controller (Art. 4(7) GDPR, Art. 5(j) revised FADP) and decides on the purposes and means; the Provider is the processor. The Provider is a controller in its own right solely for its billing data, for the security and operating logs of its own infrastructure, for the contact details of the contractual points of contact and for statutory record-keeping duties; its privacy policy applies to those. This agreement takes precedence over the General Terms and Conditions; the deemed-approval provision under clause 12 of the General Terms and Conditions does not apply to it. Annexes 1 and 2 in their dated version and the list of subprocessors form part of this agreement. This agreement uses the terminology of the GDPR and of the revised FADP with the same meaning; the terms processor and subprocessor cover the corresponding roles under both bodies of law.' },
          { n:'2', t:'Scope and status of the service', b:'This agreement applies to the managed operation on the Provider’s infrastructure. Where the Customer self-hosts the open source software on its own infrastructure, no data flows to the Provider; no processing on behalf of the Customer arises, and this agreement remains without object for as long as no operating or support services involving access to data are agreed separately. The managed service is under construction. Measures that are not implemented today are not warranted.' },
          { n:'3', t:'Special categories and professional secrecy', b:'The service is not designed for special categories of personal data (Art. 9 and Art. 10 GDPR) or for sensitive personal data (Art. 5(c) revised FADP). Without a separate written agreement on additional safeguards, the Customer may not introduce such data and shall instruct its users accordingly. The service does not technically prevent such input. If such data nevertheless enters the service, the same technical and organisational measures apply as for all other content; the Customer is answerable for its admissibility. Customers subject to professional or official secrecy (including Art. 321 of the Swiss Criminal Code and Art. 47 of the Swiss Banking Act) may use the service only on the basis of a separate written agreement.' },
          { n:'4', t:'Instructions', b:'The Customer issues instructions in text form to info@herr-informatik.ch. The configuration in the admin panel also counts as a documented instruction, in particular retention periods, model selection, connections and permissions, web search and the memory function, and the export and deletion of individual persons. The Provider documents the instructions it receives. Instructions within the agreed scope of services and within the settings provided for in the admin panel are covered by the fee. The Provider implements instructions going beyond that only in so far as this is technically and legally possible and reasonable for it, and against remuneration on a time and materials basis. Where implementation is not possible or not reasonable, the Provider shall say so; there is no obligation to implement. If, in the Provider’s view, an instruction infringes the GDPR, the revised FADP or other data protection provisions, it shall inform the Customer without delay (Art. 28(3), second subparagraph, GDPR). It may suspend execution of the instruction concerned until the matter is clarified, without thereby being in breach of contract. If the Customer insists on a manifestly unlawful instruction, the Provider may refuse to execute it and terminate the affected part of the services.' },
          { n:'5', t:'The Customer’s obligations and warranties', b:'The Customer is responsible for the lawfulness of the collection and of its instructions, has its own legal basis and informs the data subjects. It administers accounts, roles and permissions and blocks users who have left. It is responsible for the connections it configures, for the service accounts stored there and the scope of their permissions, and for model endpoints it integrates. It warrants that no statutory or contractual duty of confidentiality stands in the way of the processing (Art. 9 revised FADP) and shall notify any such duty arising later without delay. Before the processing begins, the Customer has satisfied itself that the Provider is able to guarantee data security; Annex 2 and the information in the Trust Center serve this purpose. The Provider processes the data only as the Customer itself would be permitted to process it (Art. 9 revised FADP).' },
          { n:'6', t:'Confidentiality of the persons used', b:'The Provider uses only persons who are bound to confidentiality or subject to an appropriate statutory duty of secrecy (Art. 28(3)(b) GDPR). The undertaking is given in text form before the activity begins, continues in force without time limit after the employment or engagement ends, and is evidenced on request. The persons used are trained in data protection.' },
          { n:'7', t:'Technical and organisational measures and the extent of the warranties', b:'The Provider takes the measures required under Art. 32 GDPR and Art. 8 revised FADP; the details are set out in Annex 2. It may adapt them to the state of the art without falling below the agreed level of protection. The following is warranted: transmissions over public networks between the user device and the service, and between the components of the service, are encrypted according to the state of the art. At rest, encryption of the storage media is part of the server provisioning; encryption of individual records at application level beyond that is not warranted. Each customer receives its own stack (database, search index, file storage, configuration, network, inference key). The dividing line is this stack and not the physical machine; several customers may share a machine, with container images and an upstream reverse proxy being used in common. Subsequent interference with the log of administrator actions becomes apparent; technical immutability is not warranted. Where the identity of the person is passed through into a connected target system, the Provider’s logging ends at the system boundary, and the logging of the target system applies. Operation takes place in data centres certified to ISO 27001; that certification is held by Green, not by the Provider, and is not a technical measure of its own. The Provider holds no certification of its own today; no SOC 2 report is available. An egress proxy with an allow list, the highest isolation level of the code sandbox and automatic account provisioning via SCIM are not subject matter of this agreement and are not warranted.' },
          { n:'8', t:'Subprocessors', b:'The Provider engages subprocessors only with the Customer’s prior authorisation; for the bodies set out in the list of subprocessors the Customer grants that authorisation upon conclusion of this agreement. The Provider announces a change 30 days in advance in text form, stating the name, legal entity, registered office, purpose and transfer basis; the Customer may object within 14 days of receipt on a data protection ground. If the Customer objects in time and with reasons, the parties shall seek a solution for 30 days. If none is reached, either party may terminate the affected part of the services with effect from the end of the current billing period; fees paid in advance are refunded pro rata for the period not used. The Customer has no further claims. The Provider imposes on each subprocessor in writing essentially the same obligations as this agreement imposes on it (Art. 28(4) GDPR). Where a subprocessor fails to fulfil its data protection obligations, the Provider remains liable to the Customer for that subprocessor’s conduct as for its own. Components that the Provider operates on its own infrastructure are not subprocessors; this applies to the self-hosted search service.' },
          { n:'9', t:'Place of processing, third countries and requests from authorities', b:'Storage and operation take place in Switzerland, model inference in the EU or the EEA; the bodies used are set out in the list of subprocessors. Two exceptions are identified. Web search queries are forwarded to external search engines without user identity and may in doing so leave the EU, EEA and Swiss area; the statement that everything remains in Europe applies to storage and inference, not to the search query itself. An additional model provider outside Europe can be integrated. Where that is the case in the Customer’s instance, the EU warranty does not apply to that provider, and the transfer basis lies with the Customer as controller. For Switzerland there is an adequacy decision of the European Commission, and for the EEA States a basis under Art. 16 revised FADP; where the registered office is outside that area, the transfer is based on the European Commission’s standard contractual clauses together with an assessment of the legal situation in the destination country, and in addition on a separate Swiss basis. Without an instruction from the Customer, the Provider transfers data only where it is legally obliged to do so; in the event of an order to hand over data it reviews the lawfulness of that order, exhausts the legal remedies that can reasonably be expected, limits disclosure to what is legally required and notifies the Customer as early as this is permitted.' },
          { n:'10', t:'No training with Customer data', b:'The Provider does not use Customer data for the training or improvement of models and does not pass it on for that purpose. It sets the access channels it operates so that content is not retained at the gateway and not used for training, in so far as the gateway offers this setting. According to the gateway, usage metadata such as timestamps and token counts are retained there for up to twelve months. Where the Customer integrates a model endpoint of its own, that endpoint’s terms apply; the Provider’s undertaking does not extend to that endpoint.' },
          { n:'11', t:'Assistance to the Customer and its remuneration', b:'The Provider assists the Customer, in so far as possible and taking into account the nature of the processing, in complying with requests from data subjects (Art. 28(3)(e) GDPR). For that purpose the service provides data export and per-person deletion in the admin panel, including full deletion; the Customer carries out these operations itself. Where a data subject approaches the Provider directly, the Provider forwards the request to the Customer and informs the data subject of this. Where the functions of the service are not sufficient in an individual case, the Provider assists in so far as possible against remuneration on a time and materials basis. In relation to a data protection impact assessment and any prior consultation (Art. 35 and 36 GDPR, Art. 22 and 23 revised FADP), it assists taking into account the information available to it and makes available the information in its possession, as a rule: processing operations and data flows, subprocessors and third country connections, technical and organisational measures, retention and deletion. Assistance of the usual extent is covered by the fee; where the effort clearly exceeds that measure, the Provider charges for it at the agreed rates, after prior notification of the expected effort. If the Customer maintains its request, the remuneration is deemed agreed.' },
          { n:'12', t:'Notification of breaches', b:'The Provider notifies the Customer of a personal data breach in text form to the body designated by the Customer, without delay and at the latest within 48 hours after the Provider has obtained confirmed knowledge of a breach within the meaning of Art. 4(12) GDPR. The notification contains the information referred to in Art. 33(3) GDPR in so far as it is available to the Provider; it is supplemented on an ongoing basis. The notification is not an acknowledgement of a breach of duty. Notification to the competent supervisory authority in the EU (Art. 33 GDPR), notification to the EDÖB (Art. 24 revised FADP, which applies a higher risk threshold and sets no fixed deadline) and communication to the data subjects are incumbent on the Customer.' },
          { n:'13', t:'Demonstration, review, authorities and record', b:'The Provider makes available to the Customer the information necessary to demonstrate compliance with Art. 28 GDPR and allows for reviews (Art. 28(3)(h) GDPR); it provides information in text form within 30 days. The Customer may carry out one audit per calendar year itself or have it carried out by an auditor, with 30 days’ prior notice and during ordinary business hours. Following a notifiable incident affecting this Customer’s data, or upon order of a supervisory authority, an unscheduled audit is permissible. The auditor is bound to secrecy and may not be a competitor of the Provider. Certificates, audit reports and attestations replace an on-site inspection in so far as they cover the purpose of the review; they do not exclude an inspection where open points remain. In relation to subprocessors, the Provider secures these rights for the Customer by contract or may, at its option, carry out the review on the Customer’s behalf. The Customer bears the costs of the review. The Customer remunerates the Provider’s effort for preparation, attendance and follow-up at the agreed rates. Where the occasion for the review is a breach of duty for which the Provider is responsible, it bears its own effort. On request, the Provider cooperates with the EDÖB and with the competent supervisory authority; the point of contact is info@herr-informatik.ch. It maintains a record of the categories of processing activities (Art. 30(2) GDPR, Art. 12 revised FADP) and makes available, on request, the entries relating to the Customer. In so far as it is subject to the obligation under Art. 27 GDPR, it designates a representative in the Union and identifies that representative in its legal notice.' },
          { n:'14', t:'Retention, return and deletion', b:'This agreement begins and ends with the main contract; its obligations continue in force until return and deletion are completed, and the confidentiality obligations without time limit. The Customer sets the retention period in the admin panel; setting and changing that period counts as an instruction. No period is set by default: without a period set, conversations remain stored until users or the administration delete them; where a period is set, expired conversations are removed together with their messages, shared links and search index entries. Billing data is not covered by that period. After the agreement ends, the Customer chooses between return and deletion (Art. 28(3)(g) GDPR). If the Customer gives no notice by the end of the term, the Provider deletes. An export can be requested up to 30 days after the agreement ends, in a common, machine-readable format chosen by the Provider; in the standard scope it is free of charge, further preparation on a time and materials basis. Data in backup copies is not deleted individually; it expires with the respective backup cycle, at the latest within six months of the end of the agreement. Until then it remains blocked and is processed exclusively for recovery in an emergency. Excepted from deletion are the audit and access logs, the billing data and data subject to a statutory retention obligation; these are blocked and deleted once the obligation expires. On request, the Provider confirms the deletion in text form.' },
          { n:'15', t:'Liability', b:'For damage arising from the processing of personal data, the mandatory statutory provisions take precedence, in particular Art. 82 GDPR. In all other respects, clause 10 of the General Terms and Conditions applies. The Provider’s liability under and in connection with this agreement is limited, per damaging event and in aggregate per contract year, to the fee that the Customer paid in the twelve months before the event giving rise to the damage. The limitation does not apply to intent and gross negligence, nor where a limitation is not legally permissible. The Provider bears fines and sanctions imposed on the Customer only to the extent of its share of responsibility under Art. 82(5) GDPR. The Provider is not liable for damage arising from the Customer’s instructions, from its configuration, from model endpoints integrated by it or from content that it has introduced contrary to section 3; the Customer shall indemnify the Provider accordingly.' },
          { n:'16', t:'Applicable law, place of jurisdiction and language versions', b:'Swiss law applies, to the exclusion of its conflict of laws rules. The exclusive place of jurisdiction is Windisch, Canton of Aargau, in so far as legally permissible. The mandatory places of jurisdiction of data subjects, in particular under the Lugano Convention, the competence of the supervisory authorities and the direct applicability of the GDPR are reserved. This agreement exists in five languages; the German version prevails.' },
          { n:'17', t:'Final provisions', b:'Amendments and supplements require text form and the consent of both parties. Excepted from this are the updating of the list of subprocessors in accordance with the procedure agreed for that purpose and the further development of the technical and organisational measures within the limits of the prohibition on deterioration. As of: August 2026, version 1.0.' },
          { n:'A1', t:'Annex 1: description of the processing', b:'Purposes: operation of the chat and assistance function, forwarding of inputs to the inference provider in order to generate responses, web search with source references, calls to connected systems via the MCP gateway and via direct connections, generation of files, searchability via a search index, automated storage of memory entries, logging of use and administration, data backup, fault resolution and support, billing. Operations: collection, recording, organisation, storage, adaptation, retrieval, consultation, use, disclosure by transmission to subprocessors, combination, restriction, erasure and destruction. Categories of data: user inputs including attachments and the responses generated, account and profile data, usage metadata (timestamps, model selection, token counts), billing data, audit and access logs including the logs of administrator actions, content read from connected systems at the users’ request (for instance ERP, SharePoint, file storage), web search queries, and memory entries that the service derives from conversations and stores without a separate action by the users. Data subjects: the Customer’s employees and its auxiliary personnel, business contacts, the Customer’s customers, suppliers and their employees, applicants, and all other persons mentioned in texts, in attachments or in content of connected systems. Within the scope of this agreement the Provider takes no automated decisions within the meaning of Art. 22 GDPR; whether outputs of the service are used for such decisions is determined by the Customer alone.' },
          { n:'A2', t:'Annex 2: technical and organisational measures', b:'Access: access to the Customer’s systems is granted only to individually named persons of the Provider, in so far as this is necessary for operation, maintenance, fault resolution or support; on request the Provider names this group. Every administrative access is logged. Access to user content takes place only at the Customer’s request or in order to resolve a specific fault, as a rule under the four eyes principle; where an emergency requires immediate intervention, this may be departed from, which is documented afterwards. Logs: the log of administrator actions is chained, each entry carries a checksum over the preceding one, and a built-in check reports a broken chain; the Customer can inspect these logs and export them as CSV. Level of protection: pseudonymisation in so far as compatible with the purpose; encryption of the transmission and of the storage media; confidentiality, integrity, availability and resilience of the systems; rapid restoration after an incident; regular review of effectiveness; separation of customers in accordance with section 7; regular backup copies. This annex applies in its respective dated version.' }
        ],
        disclaimer:'Note: this text does not constitute legal advice. It becomes binding upon signature by both parties or upon acceptance within the framework of the main contract.'
      },
      fr: {
        back:'Retour au Trust Center', status:'Version : août 2026',
        h1:'Contrat de sous-traitance (DPA)',
        intro:'Le présent contrat régit la manière dont Herr Informatik GmbH traite des données à caractère personnel pour le compte du Client lorsqu’elle exploite le service EU Cowork AI en mode infogéré. Il se fonde sur l’art. 28 RGPD et sur l’art. 9 de la loi fédérale suisse révisée sur la protection des données (nLPD, abréviation allemande DSG) et comprend dix-sept sections et deux annexes.',
        sections:[
          { n:'1', t:'Parties, objet, rang et définitions', b:'Les parties au présent contrat sont Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, IDE CHE-112.168.836 (ci-après « le Prestataire »), et le Client. « EU Cowork AI » est la désignation du service et n’est pas une partie au contrat. L’objet du contrat est le traitement de données à caractère personnel pour le compte du Client dans le cadre de l’exploitation infogérée du service. Le Client est responsable du traitement (art. 4, ch. 7, RGPD, art. 5, let. j, nLPD) et décide des finalités et des moyens ; le Prestataire est sous-traitant. Le Prestataire n’est responsable du traitement pour son propre compte que pour ses données de facturation, pour les journaux de sécurité et d’exploitation de sa propre infrastructure, pour les coordonnées des interlocuteurs contractuels et pour ses obligations légales de preuve ; sa déclaration de protection des données s’y applique. Le présent contrat prime les conditions générales ; la fiction d’approbation prévue au ch. 12 des conditions générales ne lui est pas applicable. Les annexes 1 et 2 dans leur version datée ainsi que la liste des sous-traitants ultérieurs font partie intégrante du présent contrat. Le présent contrat emploie de manière équivalente la terminologie du RGPD et celle de la nLPD ; les notions de sous-traitant et de sous-traitant ultérieur y recouvrent les rôles correspondants dans les deux droits.' },
          { n:'2', t:'Champ d’application et état du service', b:'Le présent contrat s’applique à l’exploitation infogérée sur l’infrastructure du Prestataire. En cas d’exploitation autonome du logiciel libre sur l’infrastructure propre du Client, aucune donnée ne parvient au Prestataire ; il n’y a pas de sous-traitance et le présent contrat reste sans objet, tant que des prestations d’exploitation ou de support avec accès aux données ne sont pas convenues séparément. Le service infogéré est en cours de construction. Les mesures qui ne sont pas mises en œuvre aujourd’hui ne sont pas garanties.' },
          { n:'3', t:'Catégories particulières et secrets professionnels', b:'Le service n’est pas conçu pour des catégories particulières de données à caractère personnel (art. 9 et art. 10 RGPD) ni pour des données personnelles sensibles (art. 5, let. c, nLPD). Sans convention écrite distincte portant sur des garanties supplémentaires, le Client ne peut pas y introduire de telles données et instruit ses utilisateurs en conséquence. Le service n’empêche pas techniquement leur saisie. Si de telles données y parviennent malgré tout, les mêmes mesures techniques et organisationnelles s’appliquent que pour tous les autres contenus ; le Client répond de leur licéité. Les clients soumis à un secret professionnel ou de fonction (notamment l’art. 321 du code pénal suisse, l’art. 47 de la loi sur les banques) ne peuvent utiliser le service qu’après conclusion d’une convention écrite distincte.' },
          { n:'4', t:'Instructions', b:'Le Client donne ses instructions sous forme textuelle à info@herr-informatik.ch. Vaut également instruction documentée la configuration effectuée dans le panneau d’administration, notamment les durées de conservation, le choix des modèles, les connexions et les droits, la recherche sur le web et la fonction de mémoire, l’export et l’effacement de personnes individuelles. Le Prestataire documente les instructions reçues. Les instructions qui s’inscrivent dans l’étendue convenue des prestations et dans les réglages prévus par le panneau d’administration sont couvertes par la rémunération. Le Prestataire ne met en œuvre les instructions qui vont au-delà que dans la mesure où cela est techniquement et juridiquement possible et raisonnablement exigible de lui, et contre rémunération en fonction du temps consacré. Si la mise en œuvre n’est pas possible ou n’est pas raisonnablement exigible, le Prestataire le communique ; il n’existe aucune obligation de mise en œuvre. Si, de l’avis du Prestataire, une instruction viole le RGPD, la nLPD ou d’autres dispositions relatives à la protection des données, il en informe le Client sans délai (art. 28, par. 3, al. 2, RGPD). Il peut suspendre l’exécution de l’instruction concernée jusqu’à clarification, sans se rendre pour autant coupable d’une violation du contrat. Si le Client maintient une instruction manifestement illicite, le Prestataire peut en refuser l’exécution et résilier la partie des prestations concernée.' },
          { n:'5', t:'Obligations et garanties du Client', b:'Le Client répond de la licéité de la collecte et de ses instructions, dispose d’une base juridique propre et informe les personnes concernées. Il gère les comptes, les rôles et les autorisations et bloque les utilisateurs qui ont quitté l’entreprise. Il répond des connexions qu’il configure, des comptes de service qui y sont enregistrés et de l’étendue de leurs droits, ainsi que des points d’accès de modèles qu’il intègre. Il garantit qu’aucune obligation légale ou contractuelle de garder le secret ne s’oppose au traitement (art. 9 nLPD) et communique sans délai toute obligation qui naîtrait ultérieurement. Avant le début du traitement, le Client s’est assuré que le Prestataire est en mesure de garantir la sécurité des données ; l’annexe 2 et les indications du Trust Center lui servent à cet effet. Le Prestataire ne traite les données que de la manière dont le Client serait lui-même autorisé à les traiter (art. 9 nLPD).' },
          { n:'6', t:'Confidentialité des personnes intervenantes', b:'Le Prestataire ne fait intervenir que des personnes tenues à la confidentialité ou soumises à une obligation légale de secret appropriée (art. 28, par. 3, point b, RGPD). L’engagement est pris sous forme textuelle avant le début de l’activité, subsiste sans limite dans le temps après la fin des rapports de travail ou de mandat et est prouvé sur demande. Les personnes intervenantes reçoivent une formation en matière de protection des données.' },
          { n:'7', t:'Mesures techniques et organisationnelles et portée des garanties', b:'Le Prestataire prend les mesures requises par l’art. 32 RGPD et l’art. 8 nLPD ; le détail figure à l’annexe 2. Il peut les adapter à l’état de la technique sans descendre en dessous du niveau de protection convenu. Sont garantis les éléments suivants : les transmissions sur les réseaux publics entre l’appareil de l’utilisateur et le service, ainsi qu’entre les composants du service, sont chiffrées selon l’état de la technique. Au repos, le chiffrement des supports de données fait partie de la mise à disposition des serveurs ; un chiffrement allant au-delà, portant sur des enregistrements individuels au niveau applicatif, n’est pas garanti. Chaque client reçoit sa propre pile (base de données, index de recherche, stockage de fichiers, configuration, réseau, clé d’inférence). La ligne de séparation est cette pile et non la machine physique ; plusieurs clients peuvent partager une machine, les images de conteneurs et un proxy inverse placé en amont étant utilisés en commun. Les interventions ultérieures dans le journal des actions d’administration se remarquent ; une inaltérabilité technique n’est pas garantie. Lorsque l’identité de la personne est transmise jusque dans un système cible connecté, la journalisation du Prestataire s’arrête à la limite du système et la journalisation du système cible s’applique. L’exploitation a lieu dans des centres de calcul certifiés ISO 27001 ; cette certification est détenue par Green et non par le Prestataire, et ne constitue pas une mesure technique propre. Le Prestataire ne dispose aujourd’hui d’aucune certification propre ; il n’existe pas de rapport SOC 2. Un proxy de sortie avec liste d’autorisation, le niveau d’isolation le plus élevé du bac à sable de code et l’approvisionnement automatique des comptes par SCIM ne font pas l’objet du contrat et ne sont pas garantis.' },
          { n:'8', t:'Sous-traitants ultérieurs', b:'Le Prestataire ne fait appel à des sous-traitants ultérieurs qu’avec l’autorisation préalable du Client ; pour les entités figurant dans la liste des sous-traitants ultérieurs, celui-ci la donne à la conclusion du présent contrat. Le Prestataire annonce tout changement 30 jours à l’avance sous forme textuelle, en indiquant le nom, la personne morale, le siège, la finalité et la base du transfert ; le Client peut s’y opposer dans les 14 jours dès réception pour un motif tiré de la protection des données. Si le Client s’oppose dans le délai et de manière motivée, les parties recherchent une solution pendant 30 jours. Si aucune solution n’aboutit, chaque partie peut résilier la partie des prestations concernée pour la fin de la période de facturation en cours ; les rémunérations payées d’avance sont remboursées au prorata pour la période non utilisée. Le Client ne dispose d’aucune prétention allant au-delà. Le Prestataire impose par écrit à chaque sous-traitant ultérieur pour l’essentiel les mêmes obligations que celles que le présent contrat lui impose (art. 28, par. 4, RGPD). Si un sous-traitant ultérieur ne remplit pas ses obligations en matière de protection des données, le Prestataire demeure responsable envers le Client du comportement de celui-ci comme du sien propre. Les composants que le Prestataire exploite sur sa propre infrastructure ne sont pas des sous-traitants ultérieurs ; cela vaut pour le service de recherche auto-hébergé.' },
          { n:'9', t:'Lieu du traitement, pays tiers et demandes des autorités', b:'Le stockage et l’exploitation ont lieu en Suisse, l’inférence des modèles dans l’UE ou dans l’EEE ; les entités mises en œuvre ressortent de la liste des sous-traitants ultérieurs. Deux exceptions sont désignées. Les requêtes de la recherche sur le web sont transmises à des moteurs de recherche externes sans identité de l’utilisateur et peuvent à cette occasion quitter l’espace de l’UE, de l’EEE et de la Suisse ; l’affirmation selon laquelle tout reste en Europe vaut pour le stockage et l’inférence, non pour la requête de recherche elle-même. Un fournisseur de modèles supplémentaire situé hors d’Europe peut être intégré. Si tel est le cas dans l’instance du Client, la garantie relative à l’UE ne s’applique pas à ce fournisseur et la base du transfert incombe au Client en tant que responsable du traitement. Pour la Suisse, il existe une décision d’adéquation de la Commission européenne ; pour les États de l’EEE, une base au sens de l’art. 16 nLPD. En cas de siège hors de cet espace, le transfert se fonde sur les clauses contractuelles types de la Commission européenne, assorties d’un examen de la situation juridique dans l’État de destination, et par ailleurs sur une base suisse autonome. Sans instruction du Client, le Prestataire ne transfère des données que s’il y est juridiquement tenu ; en cas d’injonction de remise, il examine la licéité de celle-ci, épuise les voies de droit raisonnablement exigibles, limite la remise à ce qui est juridiquement requis et informe le Client aussi tôt que cela est admissible.' },
          { n:'10', t:'Aucun entraînement avec les données du Client', b:'Le Prestataire n’utilise pas les données du Client pour l’entraînement ou l’amélioration de modèles et ne les transmet pas à cette fin. Il règle les accès qu’il exploite de telle sorte que les contenus ne soient pas conservés chez la passerelle et ne soient pas utilisés à des fins d’entraînement, dans la mesure où la passerelle propose ce réglage. Selon les indications de la passerelle, les métadonnées d’utilisation telles que les horodatages et le nombre de jetons y sont conservées jusqu’à douze mois. Si le Client intègre un point d’accès de modèle qui lui est propre, ce sont les conditions de celui-ci qui s’appliquent ; l’engagement du Prestataire ne s’étend pas à ce point d’accès.' },
