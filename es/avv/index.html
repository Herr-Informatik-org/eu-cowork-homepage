          { n:'11', t:'Assistance au Client et sa rémunération', b:'Le Prestataire aide le Client, dans la mesure du possible et compte tenu de la nature du traitement, à donner suite aux demandes des personnes concernées (art. 28, par. 3, point e, RGPD). À cette fin, le service met à disposition, dans le panneau d’administration, l’export des données et l’effacement par personne, y compris l’effacement complet ; le Client exécute lui-même ces opérations. Si une personne concernée s’adresse directement au Prestataire, celui-ci transmet la demande au Client et en informe la personne. Si les fonctions du service ne suffisent pas dans un cas particulier, le Prestataire apporte son aide dans la mesure du possible, contre rémunération en fonction du temps consacré. Pour l’analyse d’impact relative à la protection des données et pour une éventuelle consultation préalable (art. 35 et 36 RGPD, art. 22 et 23 nLPD), il apporte son aide en tenant compte des informations dont il dispose et met à disposition les indications en sa possession, en règle générale : les opérations de traitement et les flux de données, les sous-traitants ultérieurs et les liens avec des pays tiers, les mesures techniques et organisationnelles, la conservation et l’effacement. L’assistance d’une ampleur usuelle est couverte par la rémunération ; si la charge dépasse nettement cette mesure, le Prestataire la facture aux tarifs convenus, après communication préalable de la charge prévisible. Si le Client maintient sa demande, la rémunération est réputée convenue.' },
          { n:'12', t:'Notification des violations', b:'Le Prestataire notifie au Client toute violation de la protection des données à caractère personnel, sous forme textuelle, à l’entité que celui-ci a désignée, sans délai et au plus tard dans les 48 heures après que le Prestataire a acquis une connaissance avérée d’une violation au sens de l’art. 4, ch. 12, RGPD. La notification contient les indications prévues à l’art. 33, par. 3, RGPD, dans la mesure où le Prestataire en dispose ; elle est complétée au fur et à mesure. La notification ne vaut pas reconnaissance d’une violation d’obligation. La notification à l’autorité de contrôle compétente dans l’UE (art. 33 RGPD), l’annonce à l’EDÖB (art. 24 nLPD, qui connaît un seuil de risque plus élevé et aucun délai fixe) et la communication aux personnes concernées incombent au Client.' },
          { n:'13', t:'Preuve, contrôle, autorités et registre', b:'Le Prestataire met à la disposition du Client les informations nécessaires pour démontrer le respect de l’art. 28 RGPD et permet les contrôles (art. 28, par. 3, point h, RGPD) ; il fournit ses renseignements sous forme textuelle dans les 30 jours. Le Client peut faire réaliser un audit par année civile, lui-même ou par un auditeur, moyennant un préavis de 30 jours et pendant les heures ouvrables ordinaires. À la suite d’un incident soumis à annonce touchant les données de ce Client, ou sur injonction d’une autorité de contrôle, un audit extraordinaire est admissible. L’auditeur est tenu au secret et ne peut pas être un concurrent du Prestataire. Les certificats, rapports de contrôle et attestations remplacent un contrôle sur place dans la mesure où ils couvrent la finalité du contrôle ; ils n’excluent pas une inspection si des points restent ouverts. À l’égard des sous-traitants ultérieurs, le Prestataire procure contractuellement ces droits au Client ou peut, à son choix, effectuer le contrôle par substitution. Le Client supporte les coûts du contrôle. Le Client rémunère aux tarifs convenus la charge du Prestataire liée à la préparation, à l’accompagnement et au suivi. Si le motif du contrôle repose sur une violation d’obligation imputable au Prestataire, celui-ci supporte sa propre charge. Le Prestataire collabore sur demande avec l’EDÖB et avec l’autorité de contrôle compétente ; le point de contact est info@herr-informatik.ch. Il tient un registre des catégories d’activités de traitement (art. 30, par. 2, RGPD, art. 12 nLPD) et met à disposition sur demande les indications qui concernent le Client. Dans la mesure où il est soumis à l’obligation prévue à l’art. 27 RGPD, il désigne un représentant dans l’Union et l’indique dans ses mentions légales.' },
          { n:'14', t:'Conservation, restitution et effacement', b:'Le présent contrat commence et prend fin avec le contrat principal ; ses obligations subsistent jusqu’à l’achèvement de la restitution et de l’effacement, les obligations de confidentialité sans limite dans le temps. Le Client fixe la durée de conservation dans le panneau d’administration ; le fait de fixer et de modifier cette durée vaut instruction. Par défaut, aucune durée n’est fixée : à défaut de durée fixée, les conversations restent enregistrées jusqu’à ce que les utilisateurs ou l’administration les effacent ; si une durée est fixée, les conversations échues sont supprimées avec leurs messages, les liens partagés et les entrées de l’index de recherche. Les données de facturation ne sont pas visées par cette durée. Au terme du contrat, le Client choisit entre la restitution et l’effacement (art. 28, par. 3, point g, RGPD). Si le Client ne communique rien jusqu’à la fin de la durée du contrat, le Prestataire efface. Un export peut être demandé jusqu’à 30 jours après la fin du contrat, dans un format courant et lisible par machine choisi par le Prestataire ; dans son étendue standard, il est gratuit, les préparations allant au-delà étant facturées en fonction du temps consacré. Les données figurant dans les copies de sauvegarde ne sont pas effacées individuellement ; elles s’éteignent avec le cycle de sauvegarde correspondant, au plus tard dans les six mois dès la fin du contrat. Jusque-là, elles restent bloquées et ne sont traitées qu’à des fins de rétablissement en cas d’urgence. Sont exclus de l’effacement les journaux d’audit et d’accès, les données de facturation et les données soumises à une obligation légale de conservation ; celles-ci sont bloquées puis effacées à l’expiration de l’obligation. Sur demande, le Prestataire confirme l’effacement sous forme textuelle.' },
          { n:'15', t:'Responsabilité', b:'Pour les dommages résultant du traitement de données à caractère personnel, les dispositions légales impératives priment, notamment l’art. 82 RGPD. Pour le surplus, le ch. 10 des conditions générales s’applique. La responsabilité du Prestataire découlant du présent contrat et en relation avec celui-ci est limitée, par événement dommageable et au total par année contractuelle, à la rémunération que le Client a payée dans les douze mois précédant l’événement à l’origine du dommage. Cette limitation ne s’applique pas en cas de dol et de faute grave, ni là où une limitation n’est pas licite au regard de la loi. Le Prestataire ne supporte les amendes et sanctions prononcées contre le Client qu’à concurrence de sa part de responsabilité au sens de l’art. 82, par. 5, RGPD. Le Prestataire ne répond pas des dommages résultant des instructions du Client, de sa configuration, des points d’accès de modèles qu’il a intégrés ou de contenus qu’il a introduits en violation de la section 3 ; le Client garantit le Prestataire et le relève de toute prétention à cet égard.' },
          { n:'16', t:'Droit applicable, for et versions linguistiques', b:'Le droit suisse est applicable, à l’exclusion des règles de conflit de lois. Le for exclusif est Windisch, canton d’Argovie, dans la mesure où la loi le permet. Demeurent réservés les fors impératifs des personnes concernées, notamment selon la Convention de Lugano, la compétence des autorités de contrôle et l’applicabilité directe du RGPD. Le présent contrat existe en cinq langues ; la version allemande fait foi.' },
          { n:'17', t:'Dispositions finales', b:'Les modifications et les compléments requièrent la forme textuelle et l’accord des deux parties. Font exception la mise à jour de la liste des sous-traitants ultérieurs selon la procédure convenue à cet effet et le développement des mesures techniques et organisationnelles dans les limites de l’interdiction de détérioration. État : août 2026, version 1.0.' },
          { n:'A1', t:'Annexe 1 : description du traitement', b:'Finalités : exploitation de la fonction de discussion et d’assistance, transmission des saisies au fournisseur d’inférence en vue de générer des réponses, recherche sur le web avec indication des sources, appels de systèmes connectés via la passerelle MCP et via des connexions directes, génération de fichiers, possibilité de recherche au moyen d’un index de recherche, enregistrement automatisé d’entrées de mémoire, journalisation de l’utilisation et de l’administration, sauvegarde des données, résolution des dérangements et support, facturation. Opérations : collecte, enregistrement, organisation, conservation, adaptation, extraction, consultation, utilisation, communication par transmission à des sous-traitants ultérieurs, rapprochement, limitation, effacement et destruction. Catégories de données : les saisies des utilisateurs, y compris les pièces jointes et les réponses générées, les données de compte et de profil, les métadonnées d’utilisation (horodatages, choix du modèle, nombre de jetons), les données de facturation, les journaux d’audit et d’accès, y compris les journaux des actions d’administration, les contenus lus dans des systèmes connectés à la demande des utilisateurs (par exemple ERP, SharePoint, stockages de fichiers), les requêtes de la recherche sur le web ainsi que les entrées de mémoire que le service déduit des conversations et enregistre sans acte distinct des utilisateurs. Personnes concernées : les collaborateurs du Client et ses auxiliaires, les contacts d’affaires, les clients du Client, les fournisseurs et leurs collaborateurs, les candidates et candidats ainsi que toutes les autres personnes mentionnées dans des textes, dans des pièces jointes ou dans des contenus de systèmes connectés. Dans le cadre du présent contrat, le Prestataire ne prend aucune décision automatisée au sens de l’art. 22 RGPD ; le point de savoir si les sorties du service sont utilisées pour de telles décisions relève du seul Client.' },
          { n:'A2', t:'Annexe 2 : mesures techniques et organisationnelles', b:'Accès : seules des personnes du Prestataire désignées nommément obtiennent un accès aux systèmes du Client, dans la mesure où cela est nécessaire à l’exploitation, à la maintenance, à la résolution des dérangements ou au support ; sur demande, le Prestataire désigne ce cercle de personnes. Tout accès administratif est journalisé. Un accès aux contenus des utilisateurs n’a lieu qu’à la demande du Client ou pour remédier à un dérangement concret, en règle générale selon le principe des quatre yeux ; si une urgence exige une intervention immédiate, il peut y être dérogé, ce qui est documenté après coup. Journaux : le journal des actions d’administration est chaîné, chaque entrée porte une somme de contrôle portant sur la précédente, et un contrôle intégré signale une chaîne interrompue ; le Client peut consulter ces journaux et les exporter au format CSV. Niveau de protection : pseudonymisation dans la mesure compatible avec la finalité ; chiffrement de la transmission et des supports de données ; confidentialité, intégrité, disponibilité et résilience des systèmes ; rétablissement rapide après un incident ; contrôle régulier de l’efficacité ; séparation des clients selon la section 7 ; copies de sauvegarde régulières. La présente annexe s’applique dans sa version datée respective.' }
        ],
        disclaimer:'Remarque : le présent texte ne constitue pas un conseil juridique. Il devient contraignant avec la signature des deux parties ou avec l’acceptation dans le cadre du contrat principal.'
      },
      it: {
        back:'Torna al Trust Center', status:'Stato: agosto 2026',
        h1:'Accordo sul trattamento dei dati (DPA)',
        intro:'Il presente contratto disciplina il modo in cui Herr Informatik GmbH tratta dati personali per conto del Cliente quando gestisce il servizio EU Cowork AI in modalità gestita. Si fonda sull’art. 28 GDPR e sull’art. 9 della legge federale svizzera riveduta sulla protezione dei dati (nLPD, abbreviazione tedesca DSG) e si compone di diciassette sezioni e due allegati.',
        sections:[
          { n:'1', t:'Parti, oggetto, rapporto di prevalenza e definizioni', b:'Le parti del presente contratto sono Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, IDI CHE-112.168.836 (di seguito «il Fornitore»), e il Cliente. «EU Cowork AI» è la denominazione del servizio e non è parte contraente. Oggetto è il trattamento di dati personali per conto del Cliente nell’esercizio gestito del servizio. Il Cliente è titolare del trattamento (art. 4, n. 7, GDPR, art. 5, lett. j, nLPD) e decide in merito alle finalità e ai mezzi; il Fornitore è responsabile del trattamento. Il Fornitore è titolare del trattamento in proprio esclusivamente per i propri dati di fatturazione, per i registri di sicurezza e di esercizio della propria infrastruttura, per i dati di contatto degli interlocutori contrattuali e per i propri obblighi legali di prova; a tali trattamenti si applica la sua informativa sulla protezione dei dati. Il presente contratto prevale sulle condizioni generali; la finzione di approvazione di cui al n. 12 delle condizioni generali non si applica ad esso. Formano parte integrante del contratto gli allegati 1 e 2 nella loro versione datata e l’elenco dei sub-responsabili del trattamento. Il presente contratto impiega in modo equivalente la terminologia del GDPR e quella della nLPD; le nozioni di responsabile del trattamento e di sub-responsabile del trattamento vi coprono i ruoli corrispondenti in entrambi gli ordinamenti.' },
          { n:'2', t:'Ambito di applicazione e stato del servizio', b:'Il presente contratto si applica all’esercizio gestito sull’infrastruttura del Fornitore. In caso di esercizio autonomo del software open source sull’infrastruttura propria del Cliente, nessun dato perviene al Fornitore; non sorge alcun trattamento per conto terzi e il presente contratto resta privo di oggetto, finché non siano convenute separatamente prestazioni di esercizio o di supporto con accesso ai dati. Il servizio gestito è in fase di costruzione. Le misure che oggi non sono attuate non sono garantite.' },
          { n:'3', t:'Categorie particolari e segreti professionali', b:'Il servizio non è concepito per categorie particolari di dati personali (art. 9 e art. 10 GDPR) né per dati personali degni di particolare protezione (art. 5, lett. c, nLPD). Senza un accordo scritto separato su garanzie supplementari, il Cliente non può introdurvi tali dati e istruisce di conseguenza i propri utenti. Il servizio non impedisce tecnicamente l’immissione. Se tali dati vi pervengono comunque, si applicano le stesse misure tecniche e organizzative valide per tutti gli altri contenuti; della loro ammissibilità risponde il Cliente. I clienti soggetti a un segreto professionale o d’ufficio (tra l’altro art. 321 del Codice penale svizzero, art. 47 della legge sulle banche) possono impiegare il servizio solo previo accordo scritto separato.' },
          { n:'4', t:'Istruzioni', b:'Il Cliente impartisce le istruzioni in forma testuale a info@herr-informatik.ch. Vale come istruzione documentata anche la configurazione nel pannello di amministrazione, segnatamente i termini di conservazione, la scelta dei modelli, i collegamenti e i diritti, la ricerca sul web e la funzione di memoria, l’esportazione e la cancellazione di singole persone. Il Fornitore documenta le istruzioni ricevute. Le istruzioni che rientrano nell’ambito delle prestazioni convenute e nelle impostazioni previste dal pannello di amministrazione sono coperte dal compenso. Le istruzioni che vanno oltre sono attuate dal Fornitore soltanto nella misura in cui ciò sia tecnicamente e giuridicamente possibile ed esigibile da parte sua, e dietro compenso a consuntivo. Se l’attuazione non è possibile o non è esigibile, il Fornitore lo comunica; non sussiste alcun obbligo di attuazione. Se, a giudizio del Fornitore, un’istruzione viola il GDPR, la nLPD o altre disposizioni sulla protezione dei dati, egli ne informa senza indugio il Cliente (art. 28, par. 3, secondo comma, GDPR). Egli può sospendere l’esecuzione dell’istruzione interessata fino al chiarimento, senza per questo rendersi inadempiente. Se il Cliente insiste su un’istruzione manifestamente illecita, il Fornitore può rifiutarne l’esecuzione e disdire la parte di prestazione interessata.' },
          { n:'5', t:'Obblighi e garanzie del Cliente', b:'Il Cliente risponde della liceità della raccolta e delle proprie istruzioni, dispone di una base giuridica propria e informa le persone interessate. Egli amministra gli account, i ruoli e le autorizzazioni e blocca gli utenti usciti. Egli risponde dei collegamenti da lui configurati, degli account di servizio ivi memorizzati e dell’ampiezza dei relativi diritti, nonché degli endpoint di modello da lui integrati. Egli garantisce che al trattamento non si opponga alcun obbligo legale o contrattuale di segretezza (art. 9 nLPD) e comunica senza indugio un obbligo che sorga in seguito. Prima dell’inizio del trattamento il Cliente si è accertato che il Fornitore sia in grado di garantire la sicurezza dei dati; a tal fine gli servono l’allegato 2 e le indicazioni del Trust Center. Il Fornitore tratta i dati solo nel modo in cui il Cliente stesso sarebbe autorizzato a trattarli (art. 9 nLPD).' },
          { n:'6', t:'Riservatezza delle persone impiegate', b:'Il Fornitore impiega soltanto persone vincolate alla riservatezza o soggette a un adeguato obbligo legale di segretezza (art. 28, par. 3, lett. b, GDPR). L’impegno è assunto in forma testuale prima dell’inizio dell’attività, permane senza limiti di tempo dopo la fine del rapporto di lavoro o di mandato ed è comprovato su richiesta. Le persone impiegate ricevono una formazione in materia di protezione dei dati.' },
          { n:'7', t:'Misure tecniche e organizzative e portata delle garanzie', b:'Il Fornitore adotta le misure richieste dall’art. 32 GDPR e dall’art. 8 nLPD; i dettagli figurano nell’allegato 2. Egli può adeguarle allo stato della tecnica senza scendere al di sotto del livello di protezione convenuto. È garantito quanto segue: le trasmissioni su reti pubbliche tra il dispositivo dell’utente e il servizio, nonché tra le componenti del servizio, sono cifrate secondo lo stato della tecnica. A riposo, la cifratura dei supporti di memoria fa parte della messa a disposizione dei server; una cifratura ulteriore di singoli record a livello applicativo non è garantita. Ogni cliente riceve uno stack proprio (banca dati, indice di ricerca, archivio file, configurazione, rete, chiave di inferenza). La linea di separazione è questo stack e non la macchina fisica; più clienti possono condividere una macchina, mentre le immagini dei container e un reverse proxy a monte sono utilizzati in comune. Gli interventi successivi sul registro delle azioni di amministrazione si notano; un’immodificabilità tecnica non è garantita. Se l’identità della persona è trasmessa fino a un sistema di destinazione collegato, la registrazione del Fornitore termina al confine del sistema e vale la registrazione del sistema di destinazione. L’esercizio avviene in centri di calcolo certificati secondo la norma ISO 27001; tale certificazione è di Green e non del Fornitore e non costituisce una misura tecnica propria. Il Fornitore non dispone oggi di alcuna certificazione propria; non è disponibile alcun rapporto SOC 2. Un proxy di uscita con lista di autorizzazione, il livello di isolamento più elevato della sandbox di codice e il provisioning automatico degli account tramite SCIM non sono oggetto del contratto e non sono garantiti.' },
          { n:'8', t:'Sub-responsabili del trattamento', b:'Il Fornitore ricorre a sub-responsabili del trattamento solo con la previa autorizzazione del Cliente; per gli enti indicati nell’elenco dei sub-responsabili del trattamento il Cliente la concede con la conclusione del presente contratto. Il Fornitore annuncia un cambiamento con 30 giorni di anticipo in forma testuale, indicando nome, persona giuridica, sede, finalità e base del trasferimento; il Cliente può opporsi entro 14 giorni dalla ricezione per un motivo attinente alla protezione dei dati. Se il Cliente si oppone tempestivamente e in modo motivato, le parti cercano una soluzione per 30 giorni. Se non se ne raggiunge alcuna, ciascuna parte può disdire la parte di prestazione interessata per la fine del periodo di fatturazione in corso; i compensi pagati in anticipo sono rimborsati pro rata per il periodo non fruito. Al Cliente non spettano pretese ulteriori. Il Fornitore vincola per iscritto ogni sub-responsabile del trattamento sostanzialmente agli stessi obblighi che il presente contratto impone a lui (art. 28, par. 4, GDPR). Se un sub-responsabile del trattamento non adempie ai propri obblighi in materia di protezione dei dati, il Fornitore risponde nei confronti del Cliente del comportamento di quest’ultimo come del proprio. Le componenti che il Fornitore gestisce sulla propria infrastruttura non sono sub-responsabili del trattamento; ciò vale per il servizio di ricerca ospitato in proprio.' },
          { n:'9', t:'Luogo del trattamento, Paesi terzi e richieste delle autorità', b:'L’archiviazione e l’esercizio avvengono in Svizzera, l’inferenza dei modelli nell’UE o nel SEE; gli enti impiegati risultano dall’elenco dei sub-responsabili del trattamento. Sono indicate due eccezioni. Le interrogazioni della ricerca sul web sono inoltrate a motori di ricerca esterni senza l’identità dell’utente e possono così lasciare lo spazio dell’UE, del SEE e della Svizzera; l’affermazione secondo cui tutto resta in Europa vale per l’archiviazione e per l’inferenza, non per l’interrogazione di ricerca in sé. È possibile integrare un ulteriore fornitore di modelli con sede fuori dall’Europa. Se ciò avviene nell’istanza del Cliente, la garanzia relativa all’UE non vale per tale fornitore e la base del trasferimento spetta al Cliente in quanto titolare del trattamento. Per la Svizzera esiste una decisione di adeguatezza della Commissione europea, per gli Stati del SEE una base ai sensi dell’art. 16 nLPD; in caso di sede fuori da tale spazio, il trasferimento si fonda sulle clausole contrattuali tipo della Commissione europea, unitamente a un esame della situazione giuridica nello Stato di destinazione, e inoltre su una base svizzera autonoma. Senza istruzione del Cliente il Fornitore trasferisce dati solo se vi è giuridicamente tenuto; in caso di ordine di consegna esamina la legittimità dello stesso, esaurisce i rimedi giuridici esigibili, limita la consegna a quanto giuridicamente dovuto e informa il Cliente non appena ciò è ammissibile.' },
          { n:'10', t:'Nessun addestramento con i dati del Cliente', b:'Il Fornitore non utilizza i dati del Cliente per l’addestramento o il miglioramento di modelli e non li trasmette a tale scopo. Egli imposta gli accessi da lui gestiti in modo che i contenuti non siano conservati presso il gateway e non siano utilizzati per l’addestramento, nella misura in cui il gateway offra questa impostazione. Secondo le indicazioni del gateway, i metadati di utilizzo quali marche temporali e numero di token vi sono conservati fino a dodici mesi. Se il Cliente integra un proprio endpoint di modello, si applicano le condizioni di quest’ultimo; l’impegno del Fornitore non si estende a tale endpoint.' },
          { n:'11', t:'Assistenza al Cliente e relativo compenso', b:'Il Fornitore assiste il Cliente, per quanto possibile e tenendo conto della natura del trattamento, nel dar seguito alle richieste delle persone interessate (art. 28, par. 3, lett. e, GDPR). A tal fine il servizio mette a disposizione nel pannello di amministrazione l’esportazione dei dati e la cancellazione per singola persona, compresa la cancellazione integrale; il Cliente esegue queste operazioni da sé. Se una persona interessata si rivolge direttamente al Fornitore, questi inoltra la richiesta al Cliente e ne informa la persona. Se nel singolo caso le funzioni del servizio non sono sufficienti, il Fornitore presta assistenza per quanto possibile, dietro compenso a consuntivo. Per la valutazione d’impatto sulla protezione dei dati e per un’eventuale consultazione preventiva (art. 35 e 36 GDPR, art. 22 e 23 nLPD) egli presta assistenza tenendo conto delle informazioni di cui dispone e mette a disposizione le indicazioni in suo possesso, di regola: le operazioni di trattamento e i flussi di dati, i sub-responsabili del trattamento e i riferimenti a Paesi terzi, le misure tecniche e organizzative, la conservazione e la cancellazione. L’assistenza di ampiezza usuale è coperta dal compenso; se l’onere supera nettamente tale misura, il Fornitore lo fattura alle tariffe convenute, previa comunicazione dell’onere prevedibile. Se il Cliente insiste nella sua richiesta, il compenso si considera convenuto.' },
          { n:'12', t:'Notifica delle violazioni', b:'Il Fornitore notifica al Cliente una violazione della protezione dei dati personali in forma testuale all’ente da questi designato, senza indugio e al più tardi entro 48 ore da quando il Fornitore ha acquisito conoscenza certa di una violazione ai sensi dell’art. 4, n. 12, GDPR. La notifica contiene le indicazioni di cui all’art. 33, par. 3, GDPR, nella misura in cui siano in possesso del Fornitore; essa è integrata via via. La notifica non costituisce riconoscimento di una violazione di obblighi. La notifica all’autorità di controllo competente nell’UE (art. 33 GDPR), l’annuncio all’EDÖB (art. 24 nLPD, che prevede una soglia di rischio più elevata e nessun termine fisso) e la comunicazione alle persone interessate spettano al Cliente.' },
          { n:'13', t:'Prova, verifica, autorità e registro', b:'Il Fornitore mette a disposizione del Cliente le informazioni necessarie a comprovare il rispetto dell’art. 28 GDPR e consente le verifiche (art. 28, par. 3, lett. h, GDPR); fornisce le informazioni in forma testuale entro 30 giorni. Il Cliente può far svolgere una verifica per anno civile, da sé o tramite un revisore, con un preavviso di 30 giorni e durante il normale orario di lavoro. A seguito di un incidente soggetto a notifica che riguardi i dati di questo Cliente, oppure su ordine di un’autorità di controllo, è ammessa una verifica straordinaria. Il revisore è tenuto al segreto e non può essere un concorrente del Fornitore. Certificati, rapporti di verifica e attestati sostituiscono una verifica in loco nella misura in cui coprano lo scopo della verifica; essi non escludono un’ispezione se restano punti aperti. Nei confronti dei sub-responsabili del trattamento il Fornitore procura contrattualmente al Cliente tali diritti oppure può, a sua scelta, svolgere la verifica in via sostitutiva. Il Cliente sopporta i costi della verifica. Il Cliente compensa alle tariffe convenute l’onere del Fornitore per la preparazione, l’accompagnamento e il seguito. Se il motivo della verifica si fonda su una violazione di obblighi imputabile al Fornitore, questi sopporta il proprio onere. Il Fornitore collabora su richiesta con l’EDÖB e con l’autorità di controllo competente; il punto di contatto è info@herr-informatik.ch. Egli tiene un registro delle categorie di attività di trattamento (art. 30, par. 2, GDPR, art. 12 nLPD) e mette a disposizione su richiesta le indicazioni che riguardano il Cliente. Nella misura in cui sia soggetto all’obbligo di cui all’art. 27 GDPR, designa un rappresentante nell’Unione e lo indica nelle note legali.' },
          { n:'14', t:'Conservazione, restituzione e cancellazione', b:'Il presente contratto inizia e termina con il contratto principale; i suoi obblighi permangono fino al completamento della restituzione e della cancellazione, gli obblighi di riservatezza senza limiti di tempo. Il Cliente fissa il termine di conservazione nel pannello di amministrazione; la fissazione e la modifica di tale termine valgono come istruzione. Di fabbrica non è fissato alcun termine: in mancanza di un termine fissato, le conversazioni restano memorizzate finché gli utenti o l’amministrazione non le cancellano; se è fissato un termine, le conversazioni scadute sono rimosse insieme ai messaggi, ai link condivisi e alle voci dell’indice di ricerca. I dati di fatturazione non sono soggetti a tale termine. Al termine del contratto il Cliente sceglie tra restituzione e cancellazione (art. 28, par. 3, lett. g, GDPR). Se il Cliente non comunica nulla entro la fine della durata contrattuale, il Fornitore cancella. Un’esportazione può essere richiesta fino a 30 giorni dopo la fine del contratto, in un formato corrente e leggibile da macchina scelto dal Fornitore; nell’ampiezza standard essa è gratuita, le elaborazioni ulteriori sono a consuntivo. I dati contenuti nelle copie di sicurezza non sono cancellati singolarmente; essi si estinguono con il rispettivo ciclo di salvataggio, al più tardi entro sei mesi dalla fine del contratto. Fino ad allora restano bloccati e sono trattati esclusivamente per il ripristino in caso di emergenza. Sono esclusi dalla cancellazione i registri di audit e di accesso, i dati di fatturazione e i dati soggetti a un obbligo legale di conservazione; questi sono bloccati e cancellati alla scadenza dell’obbligo. Su richiesta il Fornitore conferma la cancellazione in forma testuale.' },
          { n:'15', t:'Responsabilità', b:'Per i danni derivanti dal trattamento di dati personali prevalgono le disposizioni legali imperative, segnatamente l’art. 82 GDPR. Per il resto si applica il n. 10 delle condizioni generali. La responsabilità del Fornitore derivante dal presente contratto e in connessione con esso è limitata, per singolo evento dannoso e complessivamente per anno contrattuale, al compenso che il Cliente ha pagato nei dodici mesi precedenti l’evento all’origine del danno. La limitazione non vale per il dolo e la colpa grave, né laddove una limitazione non sia legalmente ammessa. Il Fornitore sopporta le multe e le sanzioni inflitte al Cliente solo nella misura della propria quota di responsabilità ai sensi dell’art. 82, par. 5, GDPR. Il Fornitore non risponde dei danni derivanti dalle istruzioni del Cliente, dalla sua configurazione, dagli endpoint di modello da lui integrati o da contenuti da lui introdotti in violazione della sezione 3; il Cliente lo manleva in tale misura.' },
          { n:'16', t:'Diritto applicabile, foro competente e versioni linguistiche', b:'Si applica il diritto svizzero, con esclusione delle norme di conflitto. Foro esclusivo è Windisch, Cantone di Argovia, nella misura consentita dalla legge. Restano riservati i fori imperativi delle persone interessate, segnatamente secondo la Convenzione di Lugano, la competenza delle autorità di controllo e l’applicabilità diretta del GDPR. Il presente contratto esiste in cinque lingue; fa fede la versione tedesca.' },
          { n:'17', t:'Disposizioni finali', b:'Le modifiche e le integrazioni richiedono la forma testuale e il consenso di entrambe le parti. Fanno eccezione l’aggiornamento dell’elenco dei sub-responsabili del trattamento secondo la procedura all’uopo convenuta e l’evoluzione delle misure tecniche e organizzative nei limiti del divieto di peggioramento. Stato: agosto 2026, versione 1.0.' },
          { n:'A1', t:'Allegato 1: descrizione del trattamento', b:'Finalità: esercizio della funzione di chat e di assistenza, inoltro delle immissioni al fornitore di inferenza per la generazione di risposte, ricerca sul web con indicazione delle fonti, chiamate a sistemi collegati tramite il gateway MCP e tramite collegamenti diretti, generazione di file, ricercabilità mediante un indice di ricerca, memorizzazione automatizzata di voci di memoria, registrazione dell’utilizzo e dell’amministrazione, salvataggio dei dati, eliminazione dei guasti e supporto, fatturazione. Operazioni: raccolta, registrazione, organizzazione, conservazione, adattamento, estrazione, consultazione, uso, comunicazione mediante trasmissione a sub-responsabili del trattamento, raffronto, limitazione, cancellazione e distruzione. Tipi di dati: le immissioni degli utenti, compresi gli allegati e le risposte generate, i dati di account e di profilo, i metadati di utilizzo (marche temporali, scelta del modello, numero di token), i dati di fatturazione, i registri di audit e di accesso compresi i registri delle azioni di amministrazione, i contenuti letti da sistemi collegati su richiesta degli utenti (ad esempio ERP, SharePoint, archivi di file), le interrogazioni della ricerca sul web nonché le voci di memoria che il servizio deduce dalle conversazioni e memorizza senza un atto distinto degli utenti. Persone interessate: i collaboratori del Cliente e i suoi ausiliari, i contatti d’affari, i clienti del Cliente, i fornitori e i loro collaboratori, le candidate e i candidati nonché tutte le altre persone menzionate in testi, in allegati o in contenuti di sistemi collegati. Nell’ambito del presente contratto il Fornitore non adotta decisioni automatizzate ai sensi dell’art. 22 GDPR; se le uscite del servizio siano impiegate per tali decisioni lo determina unicamente il Cliente.' },
          { n:'A2', t:'Allegato 2: misure tecniche e organizzative', b:'Accesso: l’accesso ai sistemi del Cliente è concesso soltanto a persone del Fornitore designate per nome, nella misura in cui ciò sia necessario per l’esercizio, la manutenzione, l’eliminazione dei guasti o il supporto; su richiesta il Fornitore indica tale cerchia. Ogni accesso amministrativo è registrato. Un accesso ai contenuti degli utenti avviene solo su richiesta del Cliente o per l’eliminazione di un guasto concreto, di regola secondo il principio dei quattro occhi; se un’emergenza richiede un intervento immediato, è possibile derogarvi, il che viene documentato a posteriori. Registri: il registro delle azioni di amministrazione è concatenato, ogni voce reca una somma di controllo sulla precedente e un controllo integrato segnala una catena interrotta; il Cliente può consultare tali registri ed esportarli in formato CSV. Livello di protezione: pseudonimizzazione, nella misura compatibile con la finalità; cifratura della trasmissione e dei supporti di memoria; riservatezza, integrità, disponibilità e resilienza dei sistemi; rapido ripristino dopo un incidente; verifica periodica dell’efficacia; separazione dei clienti secondo la sezione 7; copie di sicurezza periodiche. Il presente allegato si applica nella rispettiva versione datata.' }
        ],
        disclaimer:'Nota: il presente testo non costituisce una consulenza legale. Diventa vincolante con la firma di entrambe le parti o con l’accettazione nell’ambito del contratto principale.'
      },
      es: {
        back:'Volver al Trust Center', status:'Estado: agosto de 2026',
        h1:'Acuerdo de encargo de tratamiento (DPA)',
        intro:'El presente contrato regula cómo Herr Informatik GmbH trata datos personales por cuenta del Cliente cuando explota el servicio EU Cowork AI en modalidad gestionada. Se rige por el art. 28 RGPD y por el art. 9 de la Ley Federal suiza revisada de Protección de Datos (nLPD, abreviatura alemana DSG) y consta de diecisiete secciones y dos anexos.',
        sections:[
          { n:'1', t:'Partes, objeto, orden de prelación y definiciones', b:'Las partes del presente contrato son Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, n.º de identificación de empresa CHE-112.168.836 (en adelante «el Proveedor»), y el Cliente. «EU Cowork AI» es la denominación del servicio y no es parte contratante. El objeto es el tratamiento de datos personales por cuenta del Cliente en la explotación gestionada del servicio. El Cliente es responsable del tratamiento (art. 4, apdo. 7, RGPD, art. 5, letra j, nLPD) y decide sobre los fines y los medios; el Proveedor es encargado del tratamiento. El Proveedor es responsable del tratamiento por cuenta propia únicamente respecto de sus datos de facturación, de los registros de seguridad y de explotación de su propia infraestructura, de los datos de contacto de los interlocutores contractuales y de sus obligaciones legales de acreditación; a ello se aplica su declaración de protección de datos. El presente contrato prevalece sobre las condiciones generales; la ficción de aprobación del n.º 12 de las condiciones generales no le resulta aplicable. Forman parte integrante del contrato los anexos 1 y 2 en su versión fechada y la lista de subencargados del tratamiento. El presente contrato emplea de forma equivalente la terminología del RGPD y la de la nLPD; las nociones de encargado del tratamiento y de subencargado del tratamiento abarcan en él las funciones correspondientes en ambos ordenamientos.' },
          { n:'2', t:'Ámbito de aplicación y estado del servicio', b:'El presente contrato se aplica a la explotación gestionada en la infraestructura del Proveedor. En caso de explotación autónoma del software de código abierto en la infraestructura propia del Cliente, ningún dato llega al Proveedor; no surge encargo de tratamiento alguno y el presente contrato queda sin objeto, mientras no se acuerden por separado prestaciones de explotación o de soporte con acceso a datos. El servicio gestionado se encuentra en construcción. Las medidas que hoy no están implantadas no están garantizadas.' },
          { n:'3', t:'Categorías especiales y secretos profesionales', b:'El servicio no está concebido para categorías especiales de datos personales (art. 9 y art. 10 RGPD) ni para datos personales especialmente dignos de protección (art. 5, letra c, nLPD). Sin acuerdo escrito separado sobre garantías adicionales, el Cliente no puede introducir tales datos e instruye a sus usuarios en consecuencia. El servicio no impide técnicamente su introducción. Si tales datos llegan igualmente al servicio, se aplican las mismas medidas técnicas y organizativas que a todos los demás contenidos; de su licitud responde el Cliente. Los clientes sujetos a un secreto profesional o de función (entre otros, el art. 321 del Código Penal suizo y el art. 47 de la Ley de Bancos) solo pueden emplear el servicio previo acuerdo escrito separado.' },
          { n:'4', t:'Instrucciones', b:'El Cliente imparte las instrucciones en forma textual a info@herr-informatik.ch. También vale como instrucción documentada la configuración en el panel de administración, en particular los plazos de conservación, la selección de modelos, las conexiones y los permisos, la búsqueda web y la función de memoria, así como la exportación y la supresión de personas concretas. El Proveedor documenta las instrucciones recibidas. Las instrucciones comprendidas en el alcance de prestaciones acordado y en los ajustes previstos en el panel de administración quedan cubiertas por la remuneración. Las instrucciones que vayan más allá solo son ejecutadas por el Proveedor en la medida en que ello sea técnica y jurídicamente posible y exigible para él, y contra remuneración según el tiempo empleado. Si la ejecución no es posible o no es exigible, el Proveedor lo comunica; no existe obligación de ejecución. Si, a juicio del Proveedor, una instrucción infringe el RGPD, la nLPD u otras disposiciones de protección de datos, se lo comunica al Cliente sin dilación (art. 28, apdo. 3, párrafo segundo, RGPD). Puede suspender la ejecución de la instrucción afectada hasta su aclaración, sin incurrir por ello en incumplimiento del contrato. Si el Cliente mantiene una instrucción manifiestamente ilícita, el Proveedor puede negarse a ejecutarla y resolver la parte de la prestación afectada.' },
          { n:'5', t:'Obligaciones y garantías del Cliente', b:'El Cliente responde de la licitud de la recogida y de sus instrucciones, dispone de una base jurídica propia e informa a los interesados. Administra las cuentas, los roles y los permisos y bloquea a los usuarios que hayan causado baja. Responde de las conexiones que configura, de las cuentas de servicio allí depositadas y del alcance de sus permisos, así como de los puntos de acceso de modelos que integre. Garantiza que al tratamiento no se opone ningún deber legal o contractual de secreto (art. 9 nLPD) y comunica sin dilación todo deber que surja con posterioridad. Antes del inicio del tratamiento, el Cliente se ha cerciorado de que el Proveedor puede garantizar la seguridad de los datos; a tal fin le sirven el anexo 2 y la información del Trust Center. El Proveedor trata los datos únicamente del modo en que el propio Cliente estaría autorizado a tratarlos (art. 9 nLPD).' },
          { n:'6', t:'Confidencialidad de las personas intervinientes', b:'El Proveedor emplea únicamente a personas sujetas a un compromiso de confidencialidad o a un deber legal de secreto adecuado (art. 28, apdo. 3, letra b, RGPD). El compromiso se adquiere en forma textual antes del inicio de la actividad, subsiste sin límite temporal tras la finalización de la relación laboral o de encargo y se acredita a requerimiento. Las personas intervinientes reciben formación en materia de protección de datos.' },
          { n:'7', t:'Medidas técnicas y organizativas y alcance de las garantías', b:'El Proveedor adopta las medidas exigidas por el art. 32 RGPD y el art. 8 nLPD; los detalles constan en el anexo 2. Puede adaptarlas al estado de la técnica sin descender por debajo del nivel de protección acordado. Se garantiza lo siguiente: las transmisiones por redes públicas entre el dispositivo del usuario y el servicio, así como entre los componentes del servicio, están cifradas conforme al estado de la técnica. En reposo, el cifrado de los soportes de datos forma parte del aprovisionamiento de los servidores; un cifrado adicional de registros individuales a nivel de aplicación no está garantizado. Cada cliente recibe una pila propia (base de datos, índice de búsqueda, almacenamiento de archivos, configuración, red, clave de inferencia). La línea de separación es esa pila y no la máquina física; varios clientes pueden compartir una máquina, y las imágenes de contenedor y un proxy inverso situado por delante se utilizan en común. Las intervenciones posteriores en el registro de acciones de administración se notan; no se garantiza una inalterabilidad técnica. Cuando la identidad de la persona se traslada hasta un sistema de destino conectado, el registro del Proveedor termina en el límite del sistema y rige el registro del sistema de destino. La explotación tiene lugar en centros de datos certificados según la norma ISO 27001; esa certificación corresponde a Green y no al Proveedor y no constituye una medida técnica propia. El Proveedor no dispone hoy de certificación propia; no existe informe SOC 2. Un proxy de salida con lista de autorización, el nivel de aislamiento más alto del entorno aislado de código y el aprovisionamiento automático de cuentas mediante SCIM no son objeto del contrato y no están garantizados.' },
          { n:'8', t:'Subencargados del tratamiento', b:'El Proveedor recurre a subencargados del tratamiento únicamente con la autorización previa del Cliente; respecto de las entidades que figuran en la lista de subencargados del tratamiento, el Cliente la otorga con la celebración del presente contrato. El Proveedor anuncia todo cambio con 30 días de antelación en forma textual, indicando el nombre, la persona jurídica, el domicilio, la finalidad y la base de la transferencia; el Cliente puede oponerse dentro de los 14 días desde la recepción por un motivo de protección de datos. Si el Cliente se opone en plazo y de forma motivada, las partes buscan una solución durante 30 días. Si no se alcanza ninguna, cualquiera de las partes puede resolver la parte de la prestación afectada con efecto al final del periodo de facturación en curso; las remuneraciones abonadas por anticipado se reembolsan a prorrata por el tiempo no disfrutado. El Cliente no dispone de pretensiones adicionales. El Proveedor obliga por escrito a cada subencargado del tratamiento a las mismas obligaciones, en lo esencial, que el presente contrato le impone a él (art. 28, apdo. 4, RGPD). Si un subencargado del tratamiento no cumple sus obligaciones de protección de datos, el Proveedor responde frente al Cliente de la conducta de aquel como de la propia. Los componentes que el Proveedor explota en su propia infraestructura no son subencargados del tratamiento; ello rige para el servicio de búsqueda alojado por él mismo.' },
          { n:'9', t:'Lugar del tratamiento, terceros países y requerimientos de autoridades', b:'El almacenamiento y la explotación tienen lugar en Suiza, y la inferencia de los modelos en la UE o en el EEE; las entidades empleadas resultan de la lista de subencargados del tratamiento. Se señalan dos excepciones. Las consultas de la búsqueda web se remiten a motores de búsqueda externos sin identidad del usuario y pueden con ello abandonar el espacio de la UE, del EEE y de Suiza; la afirmación de que todo permanece en Europa rige para el almacenamiento y la inferencia, no para la propia consulta de búsqueda. Cabe integrar un proveedor de modelos adicional situado fuera de Europa. Si así ocurre en la instancia del Cliente, la garantía relativa a la UE no rige para ese proveedor y la base de la transferencia corresponde al Cliente como responsable del tratamiento. Para Suiza existe una decisión de adecuación de la Comisión Europea y, para los Estados del EEE, una base conforme al art. 16 nLPD; en caso de domicilio fuera de ese espacio, la transferencia se apoya en las cláusulas contractuales tipo de la Comisión Europea junto con un examen de la situación jurídica en el Estado de destino y, además, en una base suiza autónoma. Sin instrucción del Cliente, el Proveedor solo transfiere cuando está jurídicamente obligado a ello; ante un requerimiento de entrega examina su licitud, agota los recursos jurídicos exigibles, limita la entrega a lo jurídicamente debido e informa al Cliente tan pronto como resulte admisible.' },
          { n:'10', t:'Sin entrenamiento con datos del Cliente', b:'El Proveedor no utiliza los datos del Cliente para el entrenamiento o la mejora de modelos ni los cede con ese fin. Configura los accesos que él explota de modo que los contenidos no se conserven en la pasarela y no se utilicen para entrenamiento, en la medida en que la pasarela ofrezca ese ajuste. Según indica la pasarela, los metadatos de uso, como marcas de tiempo y número de tokens, se conservan allí hasta doce meses. Si el Cliente integra un punto de acceso de modelo propio, rigen las condiciones de este; el compromiso del Proveedor no se extiende a ese punto de acceso.' },
          { n:'11', t:'Asistencia al Cliente y su remuneración', b:'El Proveedor asiste al Cliente, en la medida de lo posible y teniendo en cuenta la naturaleza del tratamiento, en la atención de las solicitudes de los interesados (art. 28, apdo. 3, letra e, RGPD). A tal fin, el servicio pone a disposición en el panel de administración la exportación de datos y la supresión por persona, incluida la supresión completa; el Cliente ejecuta él mismo estas operaciones. Si un interesado se dirige directamente al Proveedor, este traslada la solicitud al Cliente e informa de ello al interesado. Si en un caso concreto las funciones del servicio no bastan, el Proveedor asiste en la medida de lo posible contra remuneración según el tiempo empleado. En la evaluación de impacto relativa a la protección de datos y en una eventual consulta previa (art. 35 y 36 RGPD, art. 22 y 23 nLPD) asiste teniendo en cuenta la información de que dispone y facilita los datos que obran en su poder, por regla general: las operaciones de tratamiento y los flujos de datos, los subencargados del tratamiento y las conexiones con terceros países, las medidas técnicas y organizativas, la conservación y la supresión. La asistencia de alcance habitual queda cubierta por la remuneración; si el esfuerzo supera claramente esa medida, el Proveedor lo factura conforme a las tarifas acordadas, previa comunicación del esfuerzo previsible. Si el Cliente mantiene su solicitud, la remuneración se considera acordada.' },
          { n:'12', t:'Notificación de violaciones', b:'El Proveedor notifica al Cliente toda violación de la seguridad de los datos personales en forma textual, al órgano designado por este, sin dilación y a más tardar dentro de las 48 horas desde que el Proveedor ha obtenido conocimiento cierto de una violación en el sentido del art. 4, apdo. 12, RGPD. La notificación contiene la información prevista en el art. 33, apdo. 3, RGPD, en la medida en que obre en poder del Proveedor; se completa de forma continuada. La notificación no constituye reconocimiento de un incumplimiento. La notificación a la autoridad de control competente en la UE (art. 33 RGPD), la comunicación al EDÖB (art. 24 nLPD, que prevé un umbral de riesgo más elevado y ningún plazo fijo) y la comunicación a los interesados incumben al Cliente.' },
          { n:'13', t:'Acreditación, verificación, autoridades y registro', b:'El Proveedor pone a disposición del Cliente la información necesaria para acreditar el cumplimiento del art. 28 RGPD y permite las verificaciones (art. 28, apdo. 3, letra h, RGPD); facilita la información en forma textual dentro de 30 días. El Cliente puede realizar una auditoría por año natural, por sí mismo o a través de un auditor, con un preaviso de 30 días y durante el horario comercial ordinario. Tras un incidente sujeto a notificación que afecte a los datos de ese Cliente, o por orden de una autoridad de control, es admisible una auditoría extraordinaria. El auditor está obligado a guardar secreto y no puede ser competidor del Proveedor. Los certificados, informes de auditoría y dictámenes sustituyen a una verificación in situ en la medida en que cubran la finalidad de la verificación; no excluyen una inspección si quedan puntos abiertos. Frente a los subencargados del tratamiento, el Proveedor procura contractualmente estos derechos al Cliente o puede, a su elección, llevar a cabo la verificación en su lugar. El Cliente soporta los costes de la verificación. El Cliente remunera conforme a las tarifas acordadas el esfuerzo del Proveedor de preparación, acompañamiento y seguimiento. Si el motivo de la verificación se basa en un incumplimiento imputable al Proveedor, este soporta su propio esfuerzo. El Proveedor coopera a requerimiento con el EDÖB y con la autoridad de control competente; el punto de contacto es info@herr-informatik.ch. Lleva un registro de las categorías de actividades de tratamiento (art. 30, apdo. 2, RGPD, art. 12 nLPD) y facilita a requerimiento los datos que conciernen al Cliente. En la medida en que esté sujeto a la obligación del art. 27 RGPD, designa un representante en la Unión y lo indica en su aviso legal.' },
          { n:'14', t:'Conservación, devolución y supresión', b:'El presente contrato comienza y termina con el contrato principal; sus obligaciones subsisten hasta la conclusión de la devolución y la supresión, y las obligaciones de confidencialidad sin límite temporal. El Cliente fija el plazo de conservación en el panel de administración; fijar y modificar ese plazo vale como instrucción. De fábrica no hay plazo fijado: sin plazo fijado, las conversaciones permanecen almacenadas hasta que los usuarios o la administración las supriman; si hay un plazo fijado, las conversaciones vencidas se eliminan junto con sus mensajes, los enlaces compartidos y las entradas del índice de búsqueda. Los datos de facturación no quedan comprendidos en ese plazo. Al término del contrato, el Cliente elige entre devolución y supresión (art. 28, apdo. 3, letra g, RGPD). Si el Cliente no comunica nada hasta el final de la vigencia, el Proveedor suprime. Puede solicitarse una exportación hasta 30 días después del término del contrato, en un formato corriente y legible por máquina a elección del Proveedor; en su alcance estándar es gratuita, y las preparaciones que vayan más allá se facturan según el tiempo empleado. Los datos contenidos en las copias de seguridad no se suprimen individualmente; se extinguen con el correspondiente ciclo de copia, a más tardar dentro de seis meses desde el término del contrato. Hasta entonces permanecen bloqueados y se tratan exclusivamente para la recuperación en caso de emergencia. Quedan excluidos de la supresión los registros de auditoría y de acceso, los datos de facturación y los datos sujetos a una obligación legal de conservación; estos se bloquean y se suprimen al expirar la obligación. A requerimiento, el Proveedor confirma la supresión en forma textual.' },
          { n:'15', t:'Responsabilidad', b:'Para los daños derivados del tratamiento de datos personales prevalecen las disposiciones legales imperativas, en particular el art. 82 RGPD. En lo demás rige el n.º 10 de las condiciones generales. La responsabilidad del Proveedor derivada del presente contrato y en relación con él se limita, por cada evento dañoso y en total por año contractual, a la remuneración que el Cliente haya pagado en los doce meses anteriores al evento que originó el daño. La limitación no rige para el dolo y la culpa grave ni allí donde una limitación no sea legalmente admisible. El Proveedor soporta las multas y sanciones impuestas al Cliente solo en la medida de su cuota de responsabilidad conforme al art. 82, apdo. 5, RGPD. El Proveedor no responde de los daños derivados de las instrucciones del Cliente, de su configuración, de los puntos de acceso de modelos por él integrados o de contenidos que haya introducido en contra de la sección 3; el Cliente lo mantiene indemne en esa medida.' },
          { n:'16', t:'Derecho aplicable, fuero y versiones lingüísticas', b:'Se aplica el derecho suizo, con exclusión de las normas de conflicto. El fuero exclusivo es Windisch, cantón de Argovia, en la medida en que la ley lo permita. Quedan reservados los fueros imperativos de los interesados, en particular conforme al Convenio de Lugano, la competencia de las autoridades de control y la aplicabilidad directa del RGPD. El presente contrato existe en cinco idiomas; es determinante la versión alemana.' },
          { n:'17', t:'Disposiciones finales', b:'Las modificaciones y adiciones requieren la forma textual y el consentimiento de ambas partes. Se exceptúan la actualización de la lista de subencargados del tratamiento conforme al procedimiento acordado a tal efecto y el desarrollo de las medidas técnicas y organizativas dentro de los límites de la prohibición de empeoramiento. Estado: agosto de 2026, versión 1.0.' },
          { n:'A1', t:'Anexo 1: descripción del tratamiento', b:'Fines: explotación de la función de chat y de asistencia, remisión de las entradas al proveedor de inferencia para generar respuestas, búsqueda web con indicación de fuentes, llamadas a sistemas conectados a través de la pasarela MCP y de conexiones directas, generación de archivos, capacidad de búsqueda mediante un índice de búsqueda, almacenamiento automatizado de entradas de memoria, registro del uso y de la administración, copia de seguridad de los datos, resolución de incidencias y soporte, facturación. Operaciones: recogida, registro, organización, conservación, adaptación, extracción, consulta, utilización, comunicación por transmisión a subencargados del tratamiento, cotejo, limitación, supresión y destrucción. Tipos de datos: las entradas de los usuarios, incluidos los adjuntos y las respuestas generadas, los datos de cuenta y de perfil, los metadatos de uso (marcas de tiempo, elección del modelo, número de tokens), los datos de facturación, los registros de auditoría y de acceso, incluidos los registros de acciones de administración, los contenidos leídos de sistemas conectados a petición de los usuarios (por ejemplo ERP, SharePoint, almacenamientos de archivos), las consultas de la búsqueda web, así como las entradas de memoria que el servicio deduce de las conversaciones y almacena sin una acción separada de los usuarios. Interesados: los empleados del Cliente y sus auxiliares, los contactos comerciales, los clientes del Cliente, los proveedores y sus empleados, las candidatas y los candidatos, así como todas las demás personas mencionadas en textos, en adjuntos o en contenidos de sistemas conectados. En el marco del presente contrato, el Proveedor no adopta decisiones automatizadas en el sentido del art. 22 RGPD; si las salidas del servicio se emplean para tales decisiones lo determina únicamente el Cliente.' },
          { n:'A2', t:'Anexo 2: medidas técnicas y organizativas', b:'Acceso: solo obtienen acceso a los sistemas del Cliente personas del Proveedor designadas nominalmente, en la medida en que ello sea necesario para la explotación, el mantenimiento, la resolución de incidencias o el soporte; a requerimiento, el Proveedor indica ese círculo de personas. Todo acceso administrativo queda registrado. El acceso a contenidos de los usuarios solo tiene lugar a petición del Cliente o para resolver una incidencia concreta, por regla general conforme al principio de doble control; si una emergencia exige la intervención inmediata, cabe apartarse de ello, lo que se documenta con posterioridad. Registros: el registro de acciones de administración está encadenado, cada entrada lleva una suma de comprobación sobre la anterior y una comprobación integrada avisa de una cadena interrumpida; el Cliente puede consultar estos registros y exportarlos como CSV. Nivel de protección: seudonimización en la medida compatible con la finalidad; cifrado de la transmisión y de los soportes de datos; confidencialidad, integridad, disponibilidad y resiliencia de los sistemas; rápida recuperación tras un incidente; verificación periódica de la eficacia; separación de los clientes conforme a la sección 7; copias de seguridad periódicas. El presente anexo se aplica en su respectiva versión fechada.' }
        ],
        disclaimer:'Nota: el presente texto no constituye asesoramiento jurídico. Pasa a ser vinculante con la firma de ambas partes o con la aceptación en el marco del contrato principal.'
      },
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){ const lang = this.state.lang || 'de'; return { t: this.C[lang] || this.C.de }; }
}
