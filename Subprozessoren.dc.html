<body>
<noscript>
  <h1>Subprozessoren</h1>
  <p>Aktuelle Liste der Unterauftragsverarbeiter. Änderungen werden vorab angekündigt. Diese Liste ist Teil des AVV.</p>
  <ul>
    <li><strong>Green (Lupfig AG):</strong> Hosting und Rechenzentrum, ISO 27001. Lupfig, Schweiz. Region CH.</li>
    <li><strong>EuRouter:</strong> Modell-Inferenz, EU-verarbeitet. EU. Region EU.</li>
    <li><strong>SearXNG (self-hosted):</strong> Websuche ohne Drittanbieter-Tracking. Auf EU-Cowork-Infrastruktur. Region CH/EU.</li>
  </ul>
  <p>Stand: laufend gepflegt. Bei Self-Hosting entfallen sämtliche Subprozessoren ausser den von euch selbst gewählten Modellanbietern.</p>

    <li><a href="/sicherheit">Trust Center: Sicherheit &amp; Datenschutz</a></li>

    <li><a href="/warteliste">Warteliste: frühen Zugang sichern</a></li>

</noscript>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:#FAFAF7; color:#111111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:#0E3A63; } a:hover{ color:#0B1E33; }
  ::selection{ background:#A5D8E6; color:#0B1E33; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } html{ scroll-behavior:auto; } }
</style>
</helmet>
<div id="top">
  <dc-import name="SiteHeader" active-nav="security" on-landing="{{ false }}" hint-size="100%,88px"></dc-import>
  <main style="max-width:940px; margin:0 auto; padding:clamp(124px,15vw,168px) clamp(20px,5vw,40px) clamp(64px,8vw,104px);">
    <a href="/sicherheit" style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#3E6E86; text-decoration:none;">← {{ t.back }}</a>
    <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:clamp(32px,5vw,52px); line-height:1.06; letter-spacing:-0.03em; color:#0B1E33; margin:20px 0 0;">{{ t.h1 }}</h1>
    <p style="font-family:'Inter',sans-serif; font-size:17px; line-height:1.6; color:#47535F; margin:16px 0 0; max-width:640px;">{{ t.intro }}</p>

    <div style="margin-top:36px; border:1px solid #E4E8EC; border-radius:14px; overflow:hidden; background:#fff;">
      <div style="display:grid; grid-template-columns:1.4fr 1.6fr 1fr 0.9fr; gap:0; background:#F1F5F8; border-bottom:1px solid #E4E8EC;">
        <sc-for list="{{ t.head }}" as="h" hint-placeholder-count="4">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#5A6472; padding:13px 16px;">{{ h }}</div>
        </sc-for>
      </div>
      <sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="4">
        <div style="display:grid; grid-template-columns:1.4fr 1.6fr 1fr 0.9fr; gap:0; border-bottom:1px solid #EEF1F4; align-items:center;">
          <div style="padding:15px 16px; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:500; color:#0B1E33;">{{ r.name }}</div>
          <div style="padding:15px 16px; font-family:'Inter',sans-serif; font-size:14px; color:#4A5560;">{{ r.purpose }}</div>
          <div style="padding:15px 16px; font-family:'Inter',sans-serif; font-size:14px; color:#4A5560;">{{ r.location }}</div>
          <div style="padding:15px 16px;"><span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ r.tagColor }}; background:{{ r.tagBg }}; border:1px solid {{ r.tagBorder }}; border-radius:99px; padding:4px 10px;">{{ r.region }}</span></div>
        </div>
      </sc-for>
    </div>
    <p style="font-family:'Inter',sans-serif; font-size:13.5px; line-height:1.6; color:#66727F; margin:22px 0 0;">{{ t.note }}</p>
  </main>
  <dc-import name="SiteFooter" on-landing="{{ false }}" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        back:'Zurück zum Trust Center', h1:'Subprozessoren',
        intro:'Aktuelle Liste der Unterauftragsverarbeiter. Änderungen werden vorab angekündigt. Diese Liste ist Teil des AVV.',
        head:['Anbieter','Zweck','Standort','Region'],
        rows:[
          { name:'Green (Lupfig AG)', purpose:'Hosting & Rechenzentrum, ISO 27001', location:'Lupfig, Schweiz', region:'CH', eu:true },
          { name:'EuRouter', purpose:'Modell-Inferenz, EU-verarbeitet', location:'EU', region:'EU', eu:true },
          { name:'SearXNG (self-hosted)', purpose:'Websuche, ohne Drittanbieter-Tracking', location:'Auf EU-Cowork-Infrastruktur', region:'CH/EU', eu:true }
        ],
        note:'Stand: laufend gepflegt. Bei Self-Hosting entfallen sämtliche Subprozessoren ausser den von euch selbst gewählten Modellanbietern.'
      },
      en: {
        back:'Back to Trust Center', h1:'Subprocessors',
        intro:'Current list of subprocessors. Changes are announced in advance. This list forms part of the DPA.',
        head:['Provider','Purpose','Location','Region'],
        rows:[
          { name:'Green (Lupfig AG)', purpose:'Hosting & data centre, ISO 27001', location:'Lupfig, Switzerland', region:'CH', eu:true },
          { name:'EuRouter', purpose:'Model inference, EU-processed', location:'EU', region:'EU', eu:true },
          { name:'SearXNG (self-hosted)', purpose:'Web search, no third-party tracking', location:'On EU-Cowork infrastructure', region:'CH/EU', eu:true }
        ],
        note:'Status: continuously maintained. When self-hosting, all subprocessors are removed except the model providers you choose yourself.'
      }
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){
    const lang = this.state.lang || 'de';
    const base = this.C[lang] || this.C.de;
    const rows = base.rows.map(r => ({ name:r.name, purpose:r.purpose, location:r.location, region:r.region,
      tagColor:'#2E6C86', tagBg:'#EAF3F7', tagBorder:'#D6EDF5' }));
    return { t: Object.assign({}, base, { rows }) };
  }
}
</script>
