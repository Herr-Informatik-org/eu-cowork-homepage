<h1>Allgemeine Geschäftsbedingungen</h1>
<p>Diese Allgemeinen Geschäftsbedingungen (die „AGB") regeln die vertraglichen Beziehungen zwischen der Herr Informatik GmbH („HERR INFORMATIK", Windisch) und dem Kunden über die Nutzung des Dienstes EU Cowork AI. Angelehnt an die AGB der Herr Informatik GmbH.</p>
<h2>1 Geltungsbereich</h2>
<p>Diese AGB gelten für sämtliche Verträge über die Nutzung von EU Cowork AI zwischen HERR INFORMATIK und dem Kunden. Abweichende Bedingungen des Kunden gelten nur, soweit HERR INFORMATIK ihnen ausdrücklich schriftlich zustimmt.</p>
<h2>2 Vertragsgegenstand &amp; Leistungen</h2>
<p>HERR INFORMATIK stellt EU Cowork AI als in der Schweiz gehosteten Dienst bereit oder ermöglicht das Self-Hosting unter der MIT-Lizenz. Der Modellzugang erfolgt EU-verarbeitet über EuRouter. Umfang und Funktionen ergeben sich aus der jeweils gewählten Ausgabe (Starter/Pro/Max) und der Produktbeschreibung.</p>
<h2>3 Vertragsabschluss &amp; Registrierung</h2>
<p>Der Vertrag kommt mit der Registrierung bzw. Bestellung und deren Bestätigung durch HERR INFORMATIK zustande. Der Kunde stellt sicher, dass die angegebenen Daten vollständig und korrekt sind.</p>
<h2>4 Preise, Modellguthaben &amp; Zahlung</h2>
<p>Die Preise verstehen sich pro Person und Monat, exklusive MwSt. Jede Ausgabe enthält ein Modellguthaben, das der Organisation gemeinsam zur Verfügung steht. Ist das Guthaben aufgebraucht, greift eine weiche Sperre: Weitere Anfragen werden abgelehnt, bis der Kunde das Guthaben aufstockt oder in der Verwaltung ausdrücklich ein günstigeres Ausweichmodell freigibt. Ohne eine dieser Freigaben entsteht keine Nachzahlung. Rechnungsstellung periodisch im Voraus.</p>
<h2>5 Pflichten des Kunden</h2>
<p>Der Kunde nutzt den Dienst rechtmässig, hält Zugangsdaten geheim und unterlässt rechtswidrige, rechtsverletzende oder missbräuchliche Inhalte und Handlungen. Der Kunde ist für die von ihm eingegebenen Inhalte und die Einhaltung anwendbarer Vorschriften selbst verantwortlich.</p>
<h2>6 Verfügbarkeit &amp; Support</h2>
<p>HERR INFORMATIK erbringt den Dienst mit angemessener Sorgfalt und ist um hohe Verfügbarkeit bemüht. Wartungs-, Sicherheits- und Aktualisierungsfenster können zu vorübergehenden Unterbrüchen führen. Eine bestimmte Verfügbarkeit (SLA) gilt nur bei separater Vereinbarung.</p>
<h2>7 Datenschutz &amp; Datensicherheit</h2>
<p>Die Bearbeitung personenbezogener Daten erfolgt nach revDSG und DSGVO; Einzelheiten regeln die Datenschutzerklärung und der Auftragsverarbeitungsvertrag (AVV). Kundendaten werden nicht für das Training von Modellen verwendet; Telemetrie ist standardmässig deaktiviert. Betrieb in ISO-27001-zertifizierten Rechenzentren von Green (Lupfig).</p>
<h2>8 Open Source &amp; Geistiges Eigentum</h2>
<p>Die self-hostbare Software steht unter der MIT-Lizenz; deren Bedingungen gelten für die entsprechende Nutzung. Marken, Namen, Design und sonstige Kennzeichen von EU Cowork AI und HERR INFORMATIK bleiben geschützt und werden durch die MIT-Lizenz nicht übertragen.</p>
<h2>9 Datensicherung &amp; Mitwirkung</h2>
<p>Der Kunde ist im gesetzlichen Rahmen für die Sicherung seiner Daten selbst verantwortlich und testet geschäftskritische Abläufe vor produktivem Einsatz angemessen. HERR INFORMATIK unterstützt im vereinbarten Umfang.</p>
<h2>10 Haftung</h2>
<p>HERR INFORMATIK haftet nach den Bestimmungen des schweizerischen Obligationenrechts (OR). Die Haftung für leichte Fahrlässigkeit sowie für indirekte Schäden, Folgeschäden, Datenverlust und entgangenen Gewinn ist im gesetzlich grösstmöglichen Umfang ausgeschlossen. Zwingende gesetzliche Haftung bleibt vorbehalten.</p>
<h2>11 Vertragsdauer &amp; Kündigung</h2>
<p>Der Vertrag läuft je nach gewähltem Abrechnungszeitraum (monatlich oder jährlich) und kann auf dessen Ende gekündigt werden. Nach Vertragsende werden die Kundendaten auf Wunsch exportiert und anschliessend gelöscht, soweit keine gesetzliche Aufbewahrungspflicht besteht.</p>
<h2>12 Änderungen der AGB</h2>
<p>HERR INFORMATIK kann diese AGB anpassen. Änderungen werden dem Kunden vorgängig in geeigneter Form mitgeteilt und gelten als genehmigt, sofern der Kunde nicht innert der mitgeteilten Frist widerspricht.</p>
<h2>13 Anwendbares Recht &amp; Gerichtsstand</h2>
<p>Es gilt ausschliesslich schweizerisches Recht unter Ausschluss des Kollisionsrechts und des UN-Kaufrechts. Ausschliesslicher Gerichtsstand ist der Sitz von HERR INFORMATIK in Windisch (Kanton Aargau), soweit gesetzlich zulässig.</p>

      fr: {
        back:'Retour à l’accueil', status:'Version : juillet 2026',
        h1:'Conditions générales de vente',

          { n:'4', t:'Prix, crédit de modèles et paiement', b:'Les prix s’entendent par personne et par mois, hors TVA. Chaque édition comprend un crédit de modèles mis à la disposition commune de l’organisation. Une fois le crédit épuisé, un blocage souple s’applique : les requêtes suivantes sont refusées jusqu’à ce que le client recharge le crédit ou autorise expressément, dans l’administration, un modèle de repli moins coûteux. Sans l’une de ces autorisations, aucun supplément n’est facturé. La facturation est périodique et anticipée.' },
          { n:'5', t:'Obligations du client', b:'Le client utilise le service de manière licite, garde ses données d’accès confidentielles et s’abstient de tout contenu et de tout acte illicite, portant atteinte aux droits de tiers ou abusif. Le client est lui-même responsable des contenus qu’il saisit et du respect des prescriptions applicables.' },
          { n:'6', t:'Disponibilité et assistance', b:'HERR INFORMATIK fournit le service avec le soin requis et s’efforce d’assurer une disponibilité élevée. Les fenêtres de maintenance, de sécurité et de mise à jour peuvent entraîner des interruptions temporaires. Une disponibilité déterminée (SLA) ne s’applique qu’en vertu d’une convention distincte.' },
          { n:'7', t:'Protection et sécurité des données', b:'Le traitement des données personnelles s’effectue conformément à la LPD révisée (revDSG) et au RGPD ; les détails sont réglés par la déclaration de protection des données et le contrat de sous-traitance (DPA). Les données des clients ne sont pas utilisées pour l’entraînement de modèles ; la télémétrie est désactivée par défaut. Exploitation dans des centres de données certifiés ISO 27001 de Green (Lupfig).' },

          { n:'9', t:'Sauvegarde des données et collaboration', b:'Dans le cadre légal, le client est lui-même responsable de la sauvegarde de ses données et teste de manière adéquate les processus critiques pour son activité avant leur mise en production. HERR INFORMATIK apporte son soutien dans la mesure convenue.' },
          { n:'10', t:'Responsabilité', b:'HERR INFORMATIK répond conformément aux dispositions du code suisse des obligations (CO). La responsabilité pour négligence légère ainsi que pour les dommages indirects, les dommages consécutifs, la perte de données et le manque à gagner est exclue dans toute la mesure permise par la loi. La responsabilité légale impérative demeure réservée.' },
          { n:'11', t:'Durée du contrat et résiliation', b:'Le contrat court selon la période de facturation choisie (mensuelle ou annuelle) et peut être résilié pour son échéance. À la fin du contrat, les données du client sont exportées sur demande puis supprimées, sauf obligation légale de conservation.' },
          { n:'12', t:'Modification des CGV', b:'HERR INFORMATIK peut adapter les présentes CGV. Les modifications sont communiquées au client au préalable sous une forme appropriée et sont réputées approuvées si le client ne s’y oppose pas dans le délai communiqué.' },
          { n:'13', t:'Droit applicable et for', b:'Le droit suisse s’applique exclusivement, à l’exclusion des règles de conflit de lois et de la Convention des Nations Unies sur les contrats de vente internationale de marchandises. Le for exclusif est le siège de HERR INFORMATIK à Windisch (canton d’Argovie), dans la mesure où la loi le permet.' }

          { n:'7', t:'Protezione e sicurezza dei dati', b:'Il trattamento dei dati personali avviene conformemente alla LPD riveduta (revDSG) e al GDPR; i dettagli sono disciplinati dall’informativa sulla protezione dei dati e dall’accordo sul trattamento dei dati (DPA). I dati dei clienti non vengono utilizzati per l’addestramento di modelli; la telemetria è disattivata per impostazione predefinita. Esercizio in centri di calcolo certificati ISO 27001 di Green (Lupfig).' },

          { n:'10', t:'Responsabilità', b:'HERR INFORMATIK risponde secondo le disposizioni del Codice svizzero delle obbligazioni (CO). La responsabilità per colpa lieve nonché per danni indiretti, danni conseguenti, perdita di dati e mancato guadagno è esclusa nella misura massima consentita dalla legge. Resta salva la responsabilità legale imperativa.' },
          { n:'11', t:'Durata del contratto e disdetta', b:'Il contratto decorre secondo il periodo di fatturazione scelto (mensile o annuale) e può essere disdetto per la relativa scadenza. Al termine del contratto i dati del cliente vengono esportati su richiesta e successivamente cancellati, salvo obblighi legali di conservazione.' },

      es: {

        h1:'Condiciones generales de contratación',
        intro:'Las presentes condiciones generales de contratación (las «CG») regulan las relaciones contractuales entre Herr Informatik GmbH («HERR INFORMATIK», Windisch) y el cliente en relación con el uso del servicio EU Cowork AI. Basadas en las condiciones generales de Herr Informatik GmbH.',
        sections:[
          { n:'1', t:'Ámbito de aplicación', b:'Las presentes CG se aplican a todos los contratos sobre el uso de EU Cowork AI entre HERR INFORMATIK y el cliente. Las condiciones divergentes del cliente solo se aplican en la medida en que HERR INFORMATIK las acepte expresamente por escrito.' },
          { n:'2', t:'Objeto del contrato y prestaciones', b:'HERR INFORMATIK pone a disposición EU Cowork AI como servicio alojado en Suiza o permite el autoalojamiento bajo licencia MIT. El acceso a los modelos se realiza con tratamiento en la UE a través de EuRouter. El alcance y las funciones se derivan de la edición elegida (Starter/Pro/Max) y de la descripción del producto.' },
          { n:'3', t:'Celebración del contrato y registro', b:'El contrato se perfecciona con el registro o el pedido y su confirmación por parte de HERR INFORMATIK. El cliente se asegura de que los datos facilitados sean completos y correctos.' },
          { n:'4', t:'Precios, saldo de modelos y pago', b:'Los precios se entienden por persona y mes, sin IVA. Cada edición incluye un saldo de modelos que está a disposición común de la organización. Una vez agotado el saldo, entra en vigor un bloqueo blando: las siguientes solicitudes se rechazan hasta que el cliente recargue el saldo o habilite expresamente en la administración un modelo alternativo más económico. Sin una de estas habilitaciones no se genera ningún cargo adicional. La facturación es periódica y por anticipado.' },
          { n:'5', t:'Obligaciones del cliente', b:'El cliente utiliza el servicio de forma lícita, mantiene en secreto sus datos de acceso y se abstiene de contenidos y actuaciones ilícitos, lesivos de derechos de terceros o abusivos. El cliente es responsable de los contenidos que introduce y del cumplimiento de la normativa aplicable.' },
          { n:'6', t:'Disponibilidad y soporte', b:'HERR INFORMATIK presta el servicio con la diligencia debida y procura una alta disponibilidad. Las ventanas de mantenimiento, seguridad y actualización pueden provocar interrupciones temporales. Una disponibilidad determinada (SLA) solo rige mediante acuerdo por separado.' },
          { n:'7', t:'Protección y seguridad de los datos', b:'El tratamiento de datos personales se realiza conforme a la LPD suiza revisada (revDSG) y al RGPD; los detalles se regulan en la declaración de protección de datos y en el acuerdo de encargo de tratamiento (DPA). Los datos de los clientes no se utilizan para el entrenamiento de modelos; la telemetría está desactivada de forma predeterminada. Explotación en centros de datos certificados según ISO 27001 de Green (Lupfig).' },
          { n:'8', t:'Código abierto y propiedad intelectual', b:'El software autoalojable se ofrece bajo licencia MIT, cuyas condiciones rigen para dicho uso. Las marcas, nombres, el diseño y demás signos distintivos de EU Cowork AI y de HERR INFORMATIK permanecen protegidos y no se transfieren mediante la licencia MIT.' },
          { n:'9', t:'Copias de seguridad y colaboración', b:'Dentro del marco legal, el cliente es responsable de realizar copias de seguridad de sus datos y comprueba adecuadamente los procesos críticos para el negocio antes de su uso productivo. HERR INFORMATIK presta apoyo en la medida acordada.' },
          { n:'10', t:'Responsabilidad', b:'HERR INFORMATIK responde conforme a las disposiciones del Código suizo de obligaciones (CO). Se excluye, en la máxima medida permitida por la ley, la responsabilidad por negligencia leve, así como por daños indirectos, daños consecuentes, pérdida de datos y lucro cesante. Queda reservada la responsabilidad legal imperativa.' },
          { n:'11', t:'Duración del contrato y rescisión', b:'El contrato se rige por el periodo de facturación elegido (mensual o anual) y puede rescindirse con efecto a su vencimiento. Tras la finalización del contrato, los datos del cliente se exportan a petición y a continuación se suprimen, salvo que exista una obligación legal de conservación.' },
          { n:'12', t:'Modificaciones de las CG', b:'HERR INFORMATIK puede adaptar las presentes CG. Las modificaciones se comunican al cliente previamente de forma adecuada y se consideran aceptadas si el cliente no se opone dentro del plazo comunicado.' },
          { n:'13', t:'Derecho aplicable y jurisdicción', b:'Se aplica exclusivamente el derecho suizo, con exclusión de las normas de conflicto de leyes y de la Convención de las Naciones Unidas sobre los Contratos de Compraventa Internacional de Mercaderías. El fuero exclusivo es el domicilio social de HERR INFORMATIK en Windisch (cantón de Argovia), en la medida en que la ley lo permita.' }
