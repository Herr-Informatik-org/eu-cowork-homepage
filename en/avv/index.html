          { n:'27', t:'Support with data subject rights', b:'The Provider supports the Customer by appropriate technical and organisational measures in complying with requests from data subjects (Art. 28(3)(e) GDPR). For this purpose the service provides data export and erasure per person in the admin panel, including full erasure; the Customer carries out these operations itself. If a data subject approaches the Provider directly, the Provider does not answer the request itself but forwards it to the Customer without delay and informs the person of this. Where the functions of the service are not sufficient in an individual case, the Provider provides additional support.' },
          { n:'28', t:'Notification of personal data breaches', b:'The Provider notifies the Customer of any breach of the protection of personal data without delay, at the latest within 48 hours [proposed] of becoming aware of it, in text form to the point designated by the Customer. The period is measured so that the Customer can meet its own period of 72 hours under Art. 33(1) GDPR and its duty to report under Art. 24 revised FADP. The notification describes the nature of the incident, the types of data and the categories of data subjects affected, the likely consequences, the measures taken and those proposed, and a contact point. If not all the details are yet available, the Provider notifies first and supplements the notification on an ongoing basis. Notification of the supervisory authority and communication to the data subjects remain a matter for the Customer; the Provider supports it in this.' },
          { n:'29', t:'Support with impact assessment and prior consultation', b:'The Provider supports the Customer with the data protection impact assessment under Art. 35 GDPR and Art. 22 revised FADP and with any prior consultation of the supervisory authority under Art. 36 GDPR and Art. 23 revised FADP. In the case of an AI assistant connected to business systems, an impact assessment is the normal case and not the exception. The Provider makes available the information required for it: processing operations and data flows, the subprocessors used and third-country elements, technical and organisational measures, retention and erasure, known risks of the components used.' },
          { n:'30', t:'Evidence, information and review', b:'The Provider makes available to the Customer all information necessary to demonstrate compliance with the obligations under Art. 28 GDPR and allows for reviews (Art. 28(3)(h) GDPR). It gives information in text form within 30 days [proposed] of the request. In addition, the Customer may carry out one audit per calendar year [proposed], or have it carried out by an auditor, with advance notice of 30 days [proposed] and during ordinary business hours. Following a notifiable incident or by order of a supervisory authority, an unscheduled audit is permissible without being counted against this allowance. The auditor is bound to secrecy and may not be a competitor of the Provider. Certificates, audit reports and attestations replace an on-site inspection in so far as they cover the purpose of the review; they do not preclude an inspection where open points remain. The rights under this section also apply as against the subprocessors: the Provider obtains them for the Customer by way of a corresponding agreement or, on request, carries out the review vicariously and hands over the result. Each party bears its own costs; the annual audit and information in the customary scope are free of charge for the Customer, while effort for further reviews without cause in the sphere of the Provider is charged on a time and materials basis.' },
          { n:'31', t:'Supervisory authorities, contact point and record', b:'On request the Provider cooperates with the Federal Data Protection and Information Commissioner (EDÖB) and with the supervisory authority responsible for the Customer in the EU, and informs the Customer of enquiries addressed to it that concern the data of the Customer. The contact point for data protection questions is Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. The Provider maintains a record of all categories of processing activities carried out on behalf of a controller (Art. 30(2) GDPR, Art. 12 revised FADP) and makes it available to the Customer on request. In so far as the Provider is subject to the obligation under Art. 27 GDPR, it designates a representative in the Union and states that representative in its legal notice; no such representative is designated today.' },
          { n:'32', t:'Retention in ongoing operation', b:'The Customer sets the retention period in the admin panel; the setting and changing of this period counts as an instruction. No period is set by default: without a period set, conversations remain stored until users or the administration delete them. Where a period is set, expired conversations are permanently removed together with messages, shared links and search index entries; what is decisive is the last change, not the date of creation. Billing data is not covered by the period and is retained so that consumption in past periods remains traceable; it is removed only upon full erasure, subject to retention duties under commercial and tax law. Usage metadata arises at the inference provider and is retained there for up to twelve months.' },
          { n:'33', t:'Return and erasure after the end of the contract', b:'The Customer chooses whether the data is returned or erased (Art. 28(3)(g) GDPR) and communicates its choice by the end of the term. In the absence of any communication, return followed by erasure applies as the standard case. The return takes place within 30 days [proposed] of the end of the contract in a structured, commonly used and machine-readable format: a database export of the conversations and accounts, files in the original, logs as CSV. The Provider then erases the productive data. Complete erasure including all backup copies is completed within 90 days [proposed] of the end of the contract; the period corresponds to the rotation cycle of the backups. Until a backup expires, the data it contains remains blocked and is not processed for any purpose other than restoration in an emergency. Audit and access logs share the fate of the content. On request the Provider confirms the erasure in text form. Billing data and data for which a statutory retention duty exists are excepted; such data is blocked and erased once the duty expires.' },
          { n:'34', t:'Costs of the support services', b:'Support with data subject rights, with notifications and with the impact assessment is covered, in the customary scope, by the fee under the main contract. Where the effort clearly exceeds the customary level, in particular in the case of a high number of similar requests or of requests that go back to a configuration made by the Customer, the Provider charges for it on a time and materials basis at the agreed rates, after having pointed this out to the Customer in advance and obtained its consent. Return and erasure after the end of the contract are free of charge in the standard format; preparation going beyond that is charged on a time and materials basis.' },
          { n:'35', t:'Liability', b:'For damage arising from the processing of personal data, the mandatory statutory provisions take precedence, in particular Art. 82 GDPR. The exclusion of liability for data loss in clause 10 of the GTC does not apply in so far as the loss is based on a breach of the obligations under this agreement, in particular of the measures under the section “Technical and organisational measures”. Where several parties are liable to a data subject, the apportionment between them follows the respective share of responsibility (Art. 82(5) GDPR). The Provider is liable for its subprocessors as for its own conduct.' },
          { n:'36', t:'Applicable law, place of jurisdiction and language versions', b:'Swiss law applies, to the exclusion of its conflict of laws rules. The exclusive place of jurisdiction is Windisch, canton of Aargau, in so far as that is legally permissible. Mandatory places of jurisdiction of data subjects and the competence of the supervisory authorities are reserved, as is the direct applicability of the GDPR in so far as it applies to the processing. This agreement exists in five languages. The German version is authoritative; the other versions serve for information.' },
          { n:'37', t:'Status, version and amendments', b:'As of: August 2026, version 1.0. Amendments and supplements require text form and the consent of both parties. Excepted from this are the updating of the list of subprocessors under the procedure agreed for that purpose and the further development of the technical and organisational measures within the limits of the prohibition on lowering the level of protection. Periods and quantities marked [proposed] are proposals by the Provider and are negotiable until the contract is concluded.' }
        ],
        disclaimer:'Note: this text does not constitute legal advice. It becomes binding only upon signature by both parties or upon acceptance within the framework of the main contract. Values marked [proposed] are proposals by the Provider.'
      },
      fr: {
        back:'Retour au Trust Center', status:'Version : août 2026',
        h1:'Contrat de sous-traitance (DPA)',
        intro:'Le présent contrat régit la manière dont Herr Informatik GmbH traite des données à caractère personnel pour le compte du Client lorsqu’elle exploite le service EU Cowork AI en mode géré. Il se fonde sur l’art. 28 RGPD et sur l’art. 9 de la loi fédérale suisse révisée sur la protection des données (nLPD, abréviation allemande DSG). Les délais et les quantités qui n’ont pas encore été négociés avec le Client portent la mention [proposition] et indiquent la valeur usuelle du marché que le Prestataire propose.',
        sections:[
          { n:'1', t:'Parties et objet du contrat', b:'Les parties au contrat sont Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Suisse, IDE CHE-112.168.836 (ci-après « le Prestataire »), et le Client. « EU Cowork AI » est la désignation du service et non une partie au contrat. L’objet est le traitement de données à caractère personnel que le Prestataire effectue pour le compte du Client lors de la fourniture du service géré.' },
          { n:'2', t:'Rôles des parties', b:'Le Client est responsable du traitement au sens de l’art. 4, point 7, RGPD et de l’art. 5, let. j, nLPD ; le Prestataire est sous-traitant (« Auftragsbearbeiter » au sens de l’art. 9 nLPD). Le Client décide des finalités et des moyens du traitement. Le Prestataire n’est responsable du traitement pour son propre compte que pour ses données de facturation, pour les journaux de sécurité et d’exploitation de sa propre infrastructure, pour les coordonnées des interlocuteurs contractuels et pour les obligations légales de documentation ; sa déclaration de protection des données s’y applique, et non le présent contrat. En dehors de cette énumération, le Prestataire ne détermine ni la finalité ni les moyens ; à défaut, il serait considéré comme responsable du traitement selon l’art. 28, par. 10, RGPD.' },
          { n:'3', t:'Champ d’application et état du service', b:'Le présent contrat s’applique à l’exploitation gérée, dans laquelle le Prestataire met le service à disposition sur son infrastructure. En cas d’exploitation autonome du logiciel libre sur l’infrastructure propre du Client, aucune donnée ne parvient au Prestataire ; il n’y a pas de traitement pour le compte d’autrui, et le présent contrat reste sans objet tant que des prestations d’exploitation ou d’assistance avec accès aux données ne sont pas convenues séparément. Le service géré est en cours de constitution. Les mesures qui ne sont pas encore mises en œuvre aujourd’hui sont expressément signalées comme prévues dans la section « Certifications et mesures prévues » et ne sont pas garanties.' },
          { n:'4', t:'Rang et éléments constitutifs du contrat', b:'Pour toutes les questions relatives au traitement de données à caractère personnel, le présent contrat prime les conditions générales de vente. La présomption d’acceptation des modifications des CGV (ch. 12 des CGV) ne s’applique pas au présent contrat : les modifications requièrent l’accord du Client en forme textuelle. Font exception la mise à jour de la liste des sous-traitants ultérieurs selon la procédure prévue à cet effet et l’évolution des mesures techniques et organisationnelles dans les limites de l’interdiction d’abaisser le niveau de protection. Font partie du présent contrat l’annexe « Mesures techniques et organisationnelles » dans sa version datée respective ainsi que la liste des sous-traitants ultérieurs.' },
          { n:'5', t:'Finalité, nature et opérations de traitement', b:'Le traitement est effectué aux fins suivantes : exploitation de la fonction de discussion et d’assistance ; transmission des saisies au fournisseur d’inférence en vue de générer des réponses ; recherche sur le web avec indication des sources ; appels de systèmes connectés via la passerelle MCP et via des connexions directes ; génération de fichiers ; possibilité de recherche au moyen d’un index de recherche ; enregistrement automatisé d’entrées de mémoire ; journalisation de l’utilisation et de l’administration ; sauvegarde et restauration des données ; dépannage et assistance ; facturation de l’utilisation. Les opérations de traitement sont la collecte, l’enregistrement, l’organisation, la conservation, l’adaptation, l’extraction, la consultation, l’utilisation, la communication par transmission à des sous-traitants ultérieurs, le rapprochement, la limitation, l’effacement et la destruction. Le Prestataire ne prend aucune décision individuelle automatisée à l’égard des personnes concernées ; le Client décide seul si les sorties du service sont utilisées pour de telles décisions.' },
          { n:'6', t:'Types de données', b:'Sont traités : les contenus que les utilisateurs saisissent, y compris les pièces jointes et les réponses générées ; les données de compte et de profil ainsi que les métadonnées d’utilisation (horodatages, choix du modèle, nombre de jetons) ; les données de facturation ; les journaux d’audit et d’accès, y compris les journaux des actions d’administration ; les contenus lus dans des systèmes connectés à la demande des utilisateurs (par exemple ERP, SharePoint, espaces de fichiers) ; les requêtes de la recherche sur le web ; les entrées de mémoire que le service déduit des conversations et enregistre sans acte distinct des utilisateurs. Le Prestataire inscrit les entrées de mémoire dans son registre en tant qu’activité de traitement propre, car elles naissent sans saisie active de la personne concernée.' },
          { n:'7', t:'Catégories de personnes concernées', b:'Sont concernés les collaborateurs du Client et ses auxiliaires, les contacts commerciaux, les clients du Client, les fournisseurs et leurs collaborateurs, les candidates et candidats ainsi que toutes les autres personnes mentionnées dans les textes saisis, dans les pièces jointes ou dans les contenus des systèmes connectés.' },
          { n:'8', t:'Catégories particulières de données à caractère personnel', b:'Le service n’est pas conçu pour des données sensibles. Deux catalogues sont déterminants et ils ne se recouvrent pas : l’art. 9 et l’art. 10 RGPD d’une part, l’art. 5, let. c, nLPD d’autre part. Sans convention écrite distincte portant sur des garanties supplémentaires, le Client ne doit pas introduire de telles données dans le service et donne des instructions en ce sens à ses utilisateurs. Le service n’empêche pas techniquement la saisie. Si de telles données y parviennent néanmoins, les mêmes mesures techniques et organisationnelles s’appliquent qu’à tous les autres contenus ; le Client répond de la licéité du traitement et des éventuelles précautions de protection supplémentaires.' },
          { n:'9', t:'Durée et phase postcontractuelle', b:'Le présent contrat commence avec le contrat principal et prend fin avec lui. S’ensuit une phase postcontractuelle durant laquelle la restitution, l’effacement et l’expiration des copies de sauvegarde sont menés à terme. Pendant la phase postcontractuelle, toutes les obligations du présent contrat continuent de s’appliquer sans changement. Les obligations de confidentialité continuent de s’appliquer sans limite dans le temps.' },
          { n:'10', t:'Instructions : forme, destinataire et configuration', b:'Le Client donne ses instructions en forme textuelle au Prestataire à l’adresse info@herr-informatik.ch. Vaut expressément aussi comme instruction documentée la configuration dans le produit lui-même, c’est-à-dire les réglages que le Client ou son administration effectue dans le panneau d’administration : durées de conservation, choix des modèles, connexions et droits sur les outils, droits des utilisateurs et des groupes, activation de la recherche sur le web et de la fonction de mémoire, exportation et effacement de personnes individuelles. C’est en pratique la forme d’instruction la plus fréquente. Le Client confirme sans délai en forme textuelle les instructions données oralement. Le Prestataire documente les instructions reçues et les conserve pendant la durée du présent contrat et pendant la phase postcontractuelle.' },
          { n:'11', t:'Devoir de signalement en cas d’instruction illicite', b:'Si le Prestataire estime qu’une instruction viole le RGPD, la nLPD ou d’autres dispositions relatives à la protection des données, il en informe le Client sans délai (art. 28, par. 3, 2e alinéa, RGPD). Il peut suspendre l’exécution de l’instruction concernée jusqu’à clarification, sans se trouver de ce fait en violation du contrat. Si le Client maintient une instruction manifestement illicite, le Prestataire peut refuser l’exécution et résilier la partie de la prestation concernée.' },
          { n:'12', t:'Obligations et droits du responsable du traitement', b:'Le Client répond de la licéité de la collecte des données et des instructions qu’il donne, dispose d’une base juridique propre pour le traitement et informe les personnes concernées. Il gère lui-même les comptes, les rôles et les autorisations et bloque les utilisateurs sortants. Il répond des connexions qu’il configure vers ses propres systèmes et vers des systèmes tiers, des comptes de service qui y sont enregistrés et de l’étendue de leurs droits, ainsi que des points de terminaison de modèles qu’il intègre lui-même. Il fixe la durée de conservation. Les droits d’information et de contrôle prévus à la section « Preuve, information et contrôle » lui reviennent.' },
          { n:'13', t:'Garanties selon le droit suisse', b:'Le Prestataire ne traite les données que de la manière dont le Client serait lui-même autorisé à les traiter (art. 9, al. 1, nLPD). Le Client garantit qu’aucune obligation légale ou contractuelle de garder le secret ne s’oppose au traitement par le Prestataire (art. 9, al. 2, nLPD). Si une telle obligation ne survient que plus tard, le Client le communique sans délai et les parties conviennent des mesures supplémentaires nécessaires.' },
          { n:'14', t:'Secrets professionnels et de fonction', b:'Si le Client est soumis à un secret professionnel, par exemple selon l’art. 321 du code pénal suisse (StGB) ou selon l’art. 47 de la loi sur les banques, il en informe le Prestataire avant le début du traitement. Le Prestataire et les personnes qu’il emploie agissent dans ce cas comme auxiliaires du Client et sont soumis à la même obligation de garder le secret, dans la même mesure. Le Prestataire lie ses sous-traitants ultérieurs en conséquence, dans la mesure où ceux-ci peuvent avoir accès aux données concernées.' },
          { n:'15', t:'Confidentialité des personnes employées', b:'Le Prestataire n’emploie que des personnes tenues à la confidentialité ou soumises à une obligation légale de discrétion appropriée (art. 28, par. 3, point b, RGPD). L’engagement est pris avant la prise d’activité, en forme textuelle, et continue de s’appliquer sans limite dans le temps après la fin des rapports de travail ou de mandat. Le Prestataire prouve cet engagement à la demande du Client. Les personnes employées sont formées aux exigences du présent contrat et à la protection des données.' },
          { n:'16', t:'Accès du personnel du Prestataire aux données du Client', b:'Seules des personnes du Prestataire désignées nommément obtiennent un accès aux systèmes du Client, et uniquement dans la mesure où cela est nécessaire à l’exploitation, à la maintenance, au dépannage ou à l’assistance. Chaque accès administratif est journalisé. Un accès aux contenus des utilisateurs n’a lieu qu’à la demande du Client ou pour remédier à une perturbation concrète, et dans ce cas selon le principe des quatre yeux. Le Client peut consulter les journaux des accès administratifs et les exporter au format CSV. Sur demande, le Prestataire indique le cercle des personnes autorisées à accéder.' },
          { n:'17', t:'Mesures techniques et organisationnelles', b:'Le Prestataire prend les mesures requises par l’art. 32, par. 1, RGPD et par l’art. 8 nLPD afin de garantir un niveau de protection adapté au risque. En font partie la pseudonymisation, dans la mesure où elle est compatible avec la finalité, le chiffrement, la garantie de la confidentialité, de l’intégrité, de la disponibilité et de la résilience des systèmes, la capacité de rétablir rapidement la situation après un incident ainsi qu’une procédure de contrôle et d’évaluation réguliers de l’efficacité de ces mesures. Les détails figurent dans l’annexe « Mesures techniques et organisationnelles », qui fait partie du présent contrat dans sa version datée. Le Prestataire peut adapter les mesures à l’état de la technique, pour autant que le niveau de protection convenu ne soit pas abaissé ; il communique au Client les modifications importantes.' },
          { n:'18', t:'Étendue garantie du chiffrement, de la séparation et de la journalisation', b:'Les transmissions sont chiffrées. Au repos, le chiffrement des supports de données dans l’exploitation gérée fait partie de la mise à disposition des serveurs ; un chiffrement allant au-delà, portant sur des enregistrements individuels au niveau applicatif, n’est pas garanti. Pour la séparation des clients, chaque client reçoit sa propre pile avec sa propre base de données, son propre index de recherche, son propre espace de fichiers, sa propre configuration, son propre réseau et sa propre clé d’inférence. La ligne de séparation est cette pile et non la machine physique : jusqu’à environ 15 utilisateurs, plusieurs clients peuvent partager une machine, les images de conteneurs et un proxy inverse en amont étant utilisés en commun. Le journal des actions d’administration est chaîné, chaque entrée porte une somme de contrôle sur la précédente, et une vérification intégrée signale une chaîne interrompue. Les interventions ultérieures se remarquent ainsi ; une inaltérabilité technique n’est pas garantie. Lorsque l’identité de la personne est transmise jusque dans un système cible connecté, la journalisation du Prestataire s’arrête à la frontière du système et la journalisation du système cible s’applique.' },
          { n:'19', t:'Certifications et mesures prévues', b:'L’exploitation gérée a lieu dans les centres de calcul de Green à Lupfig, canton d’Argovie, certifiés ISO 27001. Cette certification est détenue par Green en tant qu’exploitant de centre de calcul, et non par le Prestataire, et ne constitue pas une mesure technique propre au Prestataire. Le Prestataire ne dispose aujourd’hui d’aucune certification propre ; une certification ISO 27001 propre est en cours, un rapport SOC 2 n’est pas disponible. Sont en outre considérés comme prévus et non comme garantis : un proxy de sortie avec liste d’autorisation pour les accès réseau depuis le bac à sable de code (en cours) ; le niveau d’isolation le plus fort du bac à sable de code, qui suppose une prise en charge de la virtualisation sur le serveur et qui n’est donc pas partout le réglage par défaut ; la mise à disposition et le blocage automatiques de comptes via SCIM (prévu ; aujourd’hui, le blocage s’effectue via le service d’annuaire).' },
          { n:'20', t:'Sous-traitants ultérieurs : autorisation et changement', b:'Le Prestataire ne fait appel à des sous-traitants ultérieurs qu’avec l’autorisation préalable du Client ; l’art. 9, al. 3, nLPD l’exige et l’art. 61, let. b, nLPD assortit le manquement d’une sanction pénale, une simple information ne suffit pas. Pour les entités nommément mentionnées dans la liste des sous-traitants ultérieurs, le Client donne son autorisation à la conclusion du présent contrat. Pour les entités nouvelles ou remplacées, il en va comme suit : le Prestataire annonce le changement 30 jours [proposition] à l’avance en forme textuelle, en indiquant le nom, la personne morale, le siège, la finalité et la base du transfert. Le Client peut s’opposer dans les 14 jours [proposition] suivant la réception de l’annonce pour un motif relevant de la protection des données. En cas d’opposition fondée, le Prestataire suspend le changement ; si la prestation ne peut pas être fournie sans le nouveau sous-traitant ultérieur, le Client peut résilier la partie de la prestation concernée pour la date du changement et obtient le remboursement au prorata des rémunérations payées d’avance.' },
          { n:'21', t:'La chaîne effective', b:'Font partie de la chaîne l’exploitant de centre de calcul Green à Lupfig et la passerelle d’inférence EuRouter. EuRouter ne fournit pas l’inférence lui-même, mais transmet les requêtes à des fournisseurs de modèles ; ces fournisseurs font partie de la chaîne. Pour la recherche sur le web en font également partie : la consultation des pages web trouvées et les moteurs de recherche externes interrogés. Le Prestataire indique ce niveau dans la liste des sous-traitants ultérieurs et le rend consultable par le Client sur demande, avec la personne morale, le siège et la base du transfert. Les composants que le Prestataire exploite sur sa propre infrastructure ne sont pas des sous-traitants ultérieurs ; cela vaut pour le service de recherche hébergé par ses soins.' },
          { n:'22', t:'Répercussion des obligations et responsabilité pour les sous-traitants ultérieurs', b:'Le Prestataire lie par écrit chaque sous-traitant ultérieur à des obligations pour l’essentiel identiques à celles que le présent contrat lui impose, y compris les droits de preuve et de contrôle du Client, et veille à ce que ces droits soient également opposables au sous-traitant ultérieur (art. 28, par. 4, RGPD). Si un sous-traitant ultérieur ne remplit pas ses obligations en matière de protection des données, le Prestataire répond envers le Client du comportement de celui-ci comme du sien propre. Le Client dispose ainsi dans tous les cas d’un débiteur en Suisse.' },
          { n:'23', t:'Lieu du traitement et exceptions désignées', b:'La conservation et l’exploitation ont lieu en Suisse chez Green à Lupfig. L’inférence des modèles a lieu via EuRouter dans l’UE. Deux exceptions sont expressément désignées. Premièrement, la recherche sur le web : les requêtes sont transmises à des moteurs de recherche externes sans identité de l’utilisateur et peuvent à cette occasion quitter l’espace de l’UE, de l’EEE et de la Suisse. L’affirmation selon laquelle tout reste en Europe vaut pour la conservation et l’inférence, non pour la requête de recherche elle-même. Deuxièmement, un fournisseur de modèles supplémentaire hors d’Europe : un tel fournisseur peut être intégré. Si tel est le cas dans l’instance du Client, la garantie relative à l’UE ne s’applique pas à ce fournisseur, et la base du transfert incombe au Client en tant que responsable du traitement.' },
          { n:'24', t:'Transfert vers des pays tiers : les trois bases juridiques', b:'Premièrement, du Client dans l’UE ou dans l’EEE vers le Prestataire en Suisse : aucune clause contractuelle type n’est nécessaire à cet effet. Il existe pour la Suisse une décision d’adéquation de la Commission européenne ; le transfert est ainsi assimilé à un transfert intraeuropéen. Deuxièmement, du Prestataire en Suisse vers l’inférence dans l’UE : ce transfert se fonde sur l’art. 16, al. 1, nLPD en relation avec l’annexe 1 de l’ordonnance sur la protection des données, qui énumère les États de l’EEE comme offrant une protection adéquate. Troisièmement, le niveau situé en dessous d’EuRouter : pour chaque fournisseur de modèles, le Prestataire indique sur demande la personne morale, le siège et le mécanisme de transfert. Si le siège se trouve hors de l’UE, de l’EEE et de la Suisse, le transfert se fonde sur les clauses contractuelles types de la Commission européenne, assorties d’un examen de la situation juridique dans l’État de destination, et, à côté de cela, sur une base suisse autonome selon l’art. 16, al. 2, nLPD, car les reconnaissances européennes et les reconnaissances suisses sont des actes juridiques distincts et une base de l’UE ne remplace pas la base suisse.' },
          { n:'25', t:'Demandes de production émanant des autorités', b:'Le lien aux instructions selon l’art. 28, par. 3, point a, RGPD vaut aussi pour les transferts vers des pays tiers. Sans instruction du Client, le Prestataire ne transfère que s’il y est tenu en vertu du droit applicable ; dans ce cas, il informe le Client avant le transfert, pour autant que le droit n’interdise pas cette information. Si le Prestataire reçoit une décision administrative ou judiciaire ordonnant la production de données du Client, il en examine la licéité, ne produit rien en l’absence d’obligation juridique, attaque les décisions manifestement inadmissibles ou épuise les voies de droit que l’on peut raisonnablement exiger de lui, limite une production à ce qui est juridiquement exigé et avise le Client aussi tôt que cela est admissible. Si l’avis est durablement interdit, le Prestataire documente l’opération et la mentionne sous forme agrégée dans son rapport périodique.' },
          { n:'26', t:'Aucun entraînement avec les données du Client', b:'Le Prestataire n’utilise pas les données du Client pour l’entraînement ou l’amélioration de modèles et ne les transmet pas à cette fin. Pour l’inférence via EuRouter, il en va comme suit : les contenus des requêtes n’y sont par défaut ni conservés ni utilisés pour l’entraînement. Il s’agit d’un réglage par défaut de la passerelle. Le Prestataire maintient ce réglage par défaut pour les accès qu’il exploite, le vérifie périodiquement et signale au Client tout changement à cet égard. EuRouter conserve les métadonnées d’utilisation telles que les horodatages et le nombre de jetons jusqu’à douze mois. Si le Client intègre un point de terminaison de modèle qui lui est propre, les conditions de celui-ci s’appliquent ; l’engagement du Prestataire ne s’étend pas à ce point de terminaison.' },
          { n:'27', t:'Assistance en matière de droits des personnes concernées', b:'Le Prestataire assiste le Client, par des mesures techniques et organisationnelles appropriées, pour donner suite aux demandes des personnes concernées (art. 28, par. 3, point e, RGPD). Le service met à cet effet à disposition, dans le panneau d’administration, l’exportation des données et l’effacement par personne, y compris l’effacement complet ; le Client exécute lui-même ces opérations. Si une personne concernée s’adresse directement au Prestataire, celui-ci ne répond pas lui-même à la demande, mais la transmet sans délai au Client et en informe la personne. Si les fonctions du service ne suffisent pas dans un cas particulier, le Prestataire apporte une assistance complémentaire.' },
          { n:'28', t:'Annonce des violations de la protection des données', b:'Le Prestataire annonce au Client toute violation de la protection des données à caractère personnel sans délai, au plus tard dans les 48 heures [proposition] à compter de la connaissance des faits, en forme textuelle au service désigné par le Client. Le délai est calculé de manière que le Client puisse respecter son propre délai de 72 heures selon l’art. 33, par. 1, RGPD et son obligation d’annonce selon l’art. 24 nLPD. L’annonce décrit la nature de l’incident, les types de données et les catégories de personnes concernées, les conséquences probables, les mesures prises et celles proposées ainsi qu’un point de contact. Si toutes les indications ne sont pas encore disponibles, le Prestataire annonce d’abord et complète au fur et à mesure. L’annonce à l’autorité de contrôle et la communication aux personnes concernées demeurent l’affaire du Client ; le Prestataire l’y assiste.' },
          { n:'29', t:'Assistance pour l’analyse d’impact et la consultation préalable', b:'Le Prestataire assiste le Client pour l’analyse d’impact relative à la protection des données selon l’art. 35 RGPD et l’art. 22 nLPD ainsi que pour une éventuelle consultation préalable de l’autorité de contrôle selon l’art. 36 RGPD et l’art. 23 nLPD. Pour un assistant d’intelligence artificielle connecté à des systèmes d’entreprise, une analyse d’impact est la règle et non l’exception. Le Prestataire met à disposition les indications nécessaires à cet effet : opérations de traitement et flux de données, sous-traitants ultérieurs employés et éléments touchant à des pays tiers, mesures techniques et organisationnelles, conservation et effacement, risques connus des composants employés.' },
          { n:'30', t:'Preuve, information et contrôle', b:'Le Prestataire met à la disposition du Client toutes les informations nécessaires pour démontrer le respect des obligations découlant de l’art. 28 RGPD et permet des contrôles (art. 28, par. 3, point h, RGPD). Il fournit les renseignements en forme textuelle dans les 30 jours [proposition] suivant la demande. Le Client peut en outre effectuer, ou faire effectuer par un auditeur, un audit par année civile [proposition], moyennant un préavis de 30 jours [proposition] et pendant les heures ouvrables ordinaires. Après un incident soumis à annonce ou sur décision d’une autorité de contrôle, un audit extraordinaire est admissible sans être imputé sur ce contingent. L’auditeur est tenu à la discrétion et ne doit pas être un concurrent du Prestataire. Les certificats, rapports d’audit et attestations remplacent un contrôle sur place dans la mesure où ils couvrent le but du contrôle ; ils n’excluent pas une inspection s’il reste des points ouverts. Les droits prévus à la présente section valent également à l’égard des sous-traitants ultérieurs : le Prestataire les procure au Client par une convention correspondante ou, sur demande, effectue le contrôle par substitution et en remet le résultat. Chaque partie supporte ses propres frais ; l’audit annuel et les renseignements d’ampleur usuelle sont gratuits pour le Client, les travaux liés à d’autres contrôles sans motif relevant de la sphère du Prestataire étant facturés selon la dépense.' },
          { n:'31', t:'Autorités de contrôle, point de contact et registre', b:'Le Prestataire coopère sur demande avec le Préposé fédéral à la protection des données et à la transparence (EDÖB) et avec l’autorité de contrôle compétente pour le Client dans l’UE, et informe le Client des demandes qui lui sont adressées et qui concernent les données de celui-ci. Le point de contact pour les questions de protection des données est Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. Le Prestataire tient un registre de toutes les catégories d’activités de traitement qu’il effectue pour le compte d’autrui (art. 30, par. 2, RGPD, art. 12 nLPD) et le met à la disposition du Client sur demande. Dans la mesure où le Prestataire est soumis à l’obligation prévue à l’art. 27 RGPD, il désigne un représentant dans l’Union et l’indique dans les mentions légales ; un tel représentant n’est pas désigné aujourd’hui.' },
          { n:'32', t:'Conservation en exploitation courante', b:'Le Client fixe la durée de conservation dans le panneau d’administration ; la fixation et la modification de cette durée valent instruction. Aucune durée n’est fixée d’origine : sans durée fixée, les conversations restent conservées jusqu’à ce que les utilisateurs ou l’administration les effacent. Si une durée est fixée, les conversations échues sont définitivement supprimées avec les messages, les liens partagés et les entrées de l’index de recherche ; la dernière modification est déterminante, et non la date de création. Les données de facturation ne sont pas visées par la durée et sont conservées afin que la consommation des périodes écoulées reste traçable ; elles ne sont supprimées que lors d’un effacement complet, sous réserve des obligations de conservation du droit commercial et du droit fiscal. Des métadonnées d’utilisation naissent chez le fournisseur d’inférence et y sont conservées jusqu’à douze mois.' },
          { n:'33', t:'Restitution et effacement après la fin du contrat', b:'Le Client choisit si les données sont restituées ou effacées (art. 28, par. 3, point g, RGPD) et communique son choix jusqu’à la fin de la durée contractuelle. À défaut de communication, la restitution suivie de l’effacement vaut comme cas standard. La restitution a lieu dans les 30 jours [proposition] suivant la fin du contrat, dans un format structuré, couramment utilisé et lisible par machine : exportation de la base de données des conversations et des comptes, fichiers dans leur forme d’origine, journaux au format CSV. Le Prestataire efface ensuite les données productives. L’effacement complet, y compris de toutes les copies de sauvegarde, est achevé dans les 90 jours [proposition] suivant la fin du contrat ; le délai correspond au cycle de rotation des sauvegardes. Jusqu’à l’expiration d’une sauvegarde, les données qu’elle contient restent bloquées et ne sont traitées à aucune autre fin que le rétablissement en cas d’urgence. Les journaux d’audit et d’accès suivent le sort des contenus. Sur demande, le Prestataire confirme l’effacement en forme textuelle. Font exception les données de facturation et les données soumises à une obligation légale de conservation ; celles-ci sont bloquées et effacées à l’expiration de l’obligation.' },
          { n:'34', t:'Coûts des prestations d’assistance', b:'L’assistance en matière de droits des personnes concernées, d’annonces et d’analyse d’impact est couverte, dans une mesure usuelle, par la rémunération du contrat principal. Si la dépense dépasse nettement la mesure usuelle, en particulier en cas de nombre élevé de demandes semblables ou de demandes qui découlent d’une configuration du Client, le Prestataire la facture selon la dépense aux tarifs convenus, après en avoir informé le Client au préalable et avoir obtenu son accord. La restitution et l’effacement après la fin du contrat sont gratuits dans le format standard ; les préparations allant au-delà sont facturées selon la dépense.' },
          { n:'35', t:'Responsabilité', b:'Pour les dommages résultant du traitement de données à caractère personnel, les dispositions légales impératives priment, en particulier l’art. 82 RGPD. L’exclusion de responsabilité pour la perte de données prévue au ch. 10 des CGV ne s’applique pas dans la mesure où la perte repose sur une violation des obligations découlant du présent contrat, en particulier des mesures prévues à la section « Mesures techniques et organisationnelles ». Si plusieurs participants répondent envers une personne concernée, la répartition interne s’effectue selon la part de responsabilité respective (art. 82, par. 5, RGPD). Le Prestataire répond de ses sous-traitants ultérieurs comme de son propre comportement.' },
          { n:'36', t:'Droit applicable, for et versions linguistiques', b:'Le droit suisse est applicable, à l’exclusion des règles de conflit de lois. Le for exclusif est Windisch, canton d’Argovie, dans la mesure où cela est légalement admissible. Les fors impératifs des personnes concernées et la compétence des autorités de contrôle sont réservés, de même que l’applicabilité directe du RGPD dans la mesure où celui-ci s’applique au traitement. Le présent contrat existe en cinq langues. La version allemande fait foi ; les autres versions servent à l’information.' },
          { n:'37', t:'État, version et modifications', b:'État : août 2026, version 1.0. Les modifications et les compléments requièrent la forme textuelle et l’accord des deux parties. Font exception la mise à jour de la liste des sous-traitants ultérieurs selon la procédure convenue à cet effet et l’évolution des mesures techniques et organisationnelles dans les limites de l’interdiction d’abaisser le niveau de protection. Les délais et les quantités portant la mention [proposition] sont des propositions du Prestataire et restent négociables jusqu’à la conclusion du contrat.' }
        ],
        disclaimer:'Remarque : le présent texte ne constitue pas un conseil juridique. Il ne devient contraignant qu’avec la signature des deux parties ou avec l’acceptation dans le cadre du contrat principal. Les valeurs portant la mention [proposition] sont des propositions du Prestataire.'
      },
      it: {
        back:'Torna al Trust Center', status:'Stato: agosto 2026',
        h1:'Accordo sul trattamento dei dati (DPA)',
        intro:'Il presente contratto disciplina il modo in cui Herr Informatik GmbH tratta dati personali per conto del Cliente quando gestisce il servizio EU Cowork AI in modalità gestita. Si fonda sull’art. 28 GDPR e sull’art. 9 della legge federale svizzera riveduta sulla protezione dei dati (nLPD, sigla tedesca DSG). I termini e le quantità non ancora negoziati con il Cliente recano l’indicazione [proposta] e riportano il valore usuale di mercato che il Fornitore propone.',
        sections:[
          { n:'1', t:'Parti e oggetto del contratto', b:'Le parti contraenti sono Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Svizzera, IDI CHE-112.168.836 (di seguito «il Fornitore»), e il Cliente. «EU Cowork AI» è la denominazione del servizio e non una parte contraente. Oggetto è il trattamento di dati personali che il Fornitore effettua per conto del Cliente nell’erogazione del servizio gestito.' },
          { n:'2', t:'Ruoli delle parti', b:'Il Cliente è titolare del trattamento ai sensi dell’art. 4, punto 7, GDPR e dell’art. 5, lett. j, nLPD; il Fornitore è responsabile del trattamento («Auftragsbearbeiter» ai sensi dell’art. 9 nLPD). Il Cliente decide in merito alle finalità e ai mezzi del trattamento. Il Fornitore è titolare del trattamento in proprio esclusivamente per i propri dati di fatturazione, per i log di sicurezza e di esercizio della propria infrastruttura, per i dati di contatto delle persone di riferimento contrattuali e per gli obblighi legali di documentazione; a questi si applica la sua informativa sulla protezione dei dati e non il presente contratto. Al di fuori di questo elenco il Fornitore non determina né la finalità né i mezzi; in caso contrario sarebbe considerato titolare del trattamento ai sensi dell’art. 28, par. 10, GDPR.' },
          { n:'3', t:'Campo di applicazione e stato del servizio', b:'Il presente contratto si applica all’esercizio gestito, nel quale il Fornitore mette a disposizione il servizio sulla propria infrastruttura. In caso di esercizio autonomo del software open source sull’infrastruttura propria del Cliente nessun dato perviene al Fornitore; non sorge alcun trattamento per conto altrui e il presente contratto resta privo di oggetto finché non siano concordate separatamente prestazioni di esercizio o di supporto con accesso ai dati. Il servizio gestito è in fase di costituzione. Le misure non ancora attuate oggi sono espressamente contrassegnate come previste nella sezione «Certificazioni e misure previste» e non sono garantite.' },
          { n:'4', t:'Rango e parti integranti del contratto', b:'In tutte le questioni relative al trattamento di dati personali il presente contratto prevale sulle condizioni generali. La presunzione di accettazione delle modifiche delle CG (cifra 12 delle CG) non si applica al presente contratto: le modifiche richiedono il consenso del Cliente in forma testuale. Fanno eccezione l’aggiornamento dell’elenco dei sub-responsabili del trattamento secondo la procedura prevista a tal fine e l’evoluzione delle misure tecniche e organizzative entro i limiti del divieto di abbassare il livello di protezione. Sono parte integrante del presente contratto l’allegato «Misure tecniche e organizzative» nella rispettiva versione datata nonché l’elenco dei sub-responsabili del trattamento.' },
          { n:'5', t:'Finalità, natura e operazioni del trattamento', b:'Il trattamento avviene per le seguenti finalità: esercizio della funzione di chat e di assistenza; inoltro degli input al fornitore di inferenza per generare risposte; ricerca sul web con indicazione delle fonti; chiamate a sistemi collegati tramite il gateway MCP e tramite collegamenti diretti; generazione di file; ricercabilità mediante un indice di ricerca; memorizzazione automatizzata di voci di memoria; registrazione dell’utilizzo e dell’amministrazione; salvataggio e ripristino dei dati; risoluzione dei guasti e supporto; fatturazione dell’utilizzo. Le operazioni di trattamento sono la raccolta, la registrazione, l’organizzazione, la conservazione, l’adattamento, l’estrazione, la consultazione, l’uso, la comunicazione mediante trasmissione a sub-responsabili del trattamento, il raffronto, la limitazione, la cancellazione e la distruzione. Il Fornitore non adotta decisioni individuali automatizzate nei confronti degli interessati; se gli output del servizio siano utilizzati per tali decisioni lo determina unicamente il Cliente.' },
          { n:'6', t:'Tipi di dati', b:'Vengono trattati: i contenuti che gli utenti inseriscono, unitamente agli allegati e alle risposte generate; i dati di account e di profilo nonché i metadati dell’utilizzo (marche temporali, scelta del modello, numero di token); i dati di fatturazione; i log di audit e di accesso, compresi i log delle azioni di amministrazione; i contenuti letti da sistemi collegati su richiesta degli utenti (ad esempio ERP, SharePoint, archivi di file); le interrogazioni della ricerca sul web; le voci di memoria che il servizio ricava dalle conversazioni e memorizza senza un atto distinto degli utenti. Il Fornitore iscrive le voci di memoria nel proprio registro come attività di trattamento autonoma, poiché sorgono senza un inserimento attivo da parte dell’interessato.' },
          { n:'7', t:'Categorie di interessati', b:'Sono interessati i collaboratori del Cliente e i suoi ausiliari, i contatti d’affari, i clienti del Cliente, i fornitori e i loro collaboratori, le candidate e i candidati nonché tutte le altre persone menzionate nei testi inseriti, negli allegati o nei contenuti dei sistemi collegati.' },
          { n:'8', t:'Categorie particolari di dati personali', b:'Il servizio non è concepito per dati personali degni di particolare protezione. Sono determinanti due cataloghi che non coincidono: l’art. 9 e l’art. 10 GDPR da un lato, l’art. 5, lett. c, nLPD dall’altro. Senza un accordo scritto separato su garanzie supplementari il Cliente non può immettere tali dati nel servizio e istruisce di conseguenza i propri utenti. Il servizio non impedisce tecnicamente l’inserimento. Se tali dati vi pervengono comunque, si applicano le stesse misure tecniche e organizzative valide per tutti gli altri contenuti; della liceità del trattamento e di eventuali precauzioni di protezione supplementari risponde il Cliente.' },
          { n:'9', t:'Durata e fase postcontrattuale', b:'Il presente contratto inizia con il contratto principale e termina con esso. Segue poi una fase postcontrattuale nella quale vengono portate a termine la restituzione, la cancellazione e la scadenza delle copie di sicurezza. Durante la fase postcontrattuale tutti gli obblighi del presente contratto continuano a valere immutati. Gli obblighi di riservatezza continuano a valere senza limiti di tempo.' },
          { n:'10', t:'Istruzioni: forma, destinatario e configurazione', b:'Il Cliente impartisce le istruzioni in forma testuale al Fornitore all’indirizzo info@herr-informatik.ch. Vale espressamente come istruzione documentata anche la configurazione nel prodotto stesso, ossia le impostazioni che il Cliente o la sua amministrazione effettua nel pannello di amministrazione: termini di conservazione, scelta dei modelli, collegamenti e diritti sugli strumenti, diritti di utenti e gruppi, attivazione della ricerca sul web e della funzione di memoria, esportazione e cancellazione di singole persone. Nella pratica questa è la forma di istruzione più frequente. Il Cliente conferma senza indugio in forma testuale le istruzioni impartite oralmente. Il Fornitore documenta le istruzioni ricevute e le conserva per la durata del presente contratto e per la fase postcontrattuale.' },
          { n:'11', t:'Obbligo di segnalazione in caso di istruzione illecita', b:'Se il Fornitore ritiene che un’istruzione violi il GDPR, la nLPD o altre disposizioni sulla protezione dei dati, lo comunica senza indugio al Cliente (art. 28, par. 3, secondo comma, GDPR). Può sospendere l’esecuzione dell’istruzione in questione fino al chiarimento, senza per questo venire meno al contratto. Se il Cliente insiste su un’istruzione manifestamente illecita, il Fornitore può rifiutarne l’esecuzione e disdire la parte di prestazione interessata.' },
          { n:'12', t:'Obblighi e diritti del titolare del trattamento', b:'Il Cliente risponde della liceità della raccolta dei dati e delle istruzioni da lui impartite, dispone di una propria base giuridica per il trattamento e informa gli interessati. Gestisce autonomamente account, ruoli e autorizzazioni e blocca gli utenti usciti. Risponde dei collegamenti da lui configurati verso sistemi propri e di terzi, degli account di servizio ivi depositati e dell’ampiezza dei loro diritti, nonché degli endpoint di modello da lui stesso integrati. Stabilisce il termine di conservazione. Gli spettano i diritti di informazione e di controllo di cui alla sezione «Prova, informazione e verifica».' },
          { n:'13', t:'Garanzie secondo il diritto svizzero', b:'Il Fornitore tratta i dati soltanto nel modo in cui il Cliente stesso potrebbe trattarli (art. 9, cpv. 1, nLPD). Il Cliente garantisce che al trattamento da parte del Fornitore non si oppone alcun obbligo legale o contrattuale di segretezza (art. 9, cpv. 2, nLPD). Se un tale obbligo sorge soltanto successivamente, il Cliente lo comunica senza indugio e le parti concordano le misure supplementari necessarie.' },
          { n:'14', t:'Segreti professionali e d’ufficio', b:'Se il Cliente è soggetto a un segreto professionale, ad esempio ai sensi dell’art. 321 del codice penale svizzero (StGB) o dell’art. 47 della legge sulle banche, lo comunica al Fornitore prima dell’inizio del trattamento. In tal caso il Fornitore e le persone da esso impiegate agiscono quali ausiliari del Cliente e sottostanno al medesimo obbligo di segretezza nella medesima misura. Il Fornitore vincola in modo corrispondente i propri sub-responsabili del trattamento, nella misura in cui questi possano avere accesso ai dati interessati.' },
          { n:'15', t:'Riservatezza delle persone impiegate', b:'Il Fornitore impiega soltanto persone tenute alla riservatezza o soggette a un adeguato obbligo legale di segretezza (art. 28, par. 3, lett. b, GDPR). L’impegno è assunto prima dell’inizio dell’attività, in forma testuale, e continua a valere senza limiti di tempo dopo la fine del rapporto di lavoro o di mandato. Su richiesta del Cliente il Fornitore comprova tale impegno. Le persone impiegate sono formate sui requisiti del presente contratto e sulla protezione dei dati.' },
          { n:'16', t:'Accesso del personale del Fornitore ai dati del Cliente', b:'Ottengono accesso ai sistemi del Cliente soltanto persone del Fornitore designate nominativamente e soltanto nella misura in cui ciò è necessario per l’esercizio, la manutenzione, la risoluzione dei guasti o il supporto. Ogni accesso amministrativo viene registrato. Un accesso ai contenuti degli utenti ha luogo soltanto su richiesta del Cliente o per rimediare a un guasto concreto e, in tal caso, secondo il principio dei quattro occhi. Il Cliente può consultare i log degli accessi amministrativi ed esportarli in formato CSV. Su richiesta il Fornitore indica la cerchia delle persone autorizzate ad accedere.' },
          { n:'17', t:'Misure tecniche e organizzative', b:'Il Fornitore adotta le misure richieste dall’art. 32, par. 1, GDPR e dall’art. 8 nLPD per garantire un livello di protezione adeguato al rischio. Vi rientrano la pseudonimizzazione, nella misura in cui è compatibile con la finalità, la cifratura, la garanzia della riservatezza, dell’integrità, della disponibilità e della resilienza dei sistemi, la capacità di ripristinare rapidamente la situazione dopo un incidente nonché una procedura per verificare e valutare regolarmente l’efficacia di tali misure. I dettagli figurano nell’allegato «Misure tecniche e organizzative», che nella sua versione datata è parte integrante del presente contratto. Il Fornitore può adeguare le misure allo stato della tecnica, purché il livello di protezione concordato non venga in tal modo abbassato; comunica al Cliente le modifiche sostanziali.' },
          { n:'18', t:'Portata garantita della cifratura, della separazione e della registrazione', b:'Le trasmissioni sono cifrate. A riposo, la cifratura dei supporti dati nell’esercizio gestito fa parte della messa a disposizione dei server; una cifratura ulteriore di singoli record a livello applicativo non è garantita. Per la separazione dei clienti ogni cliente riceve uno stack proprio con database proprio, indice di ricerca proprio, archivio di file proprio, configurazione propria, rete propria e chiave di inferenza propria. La linea di separazione è questo stack e non la macchina fisica: fino a circa 15 utenti più clienti possono condividere una macchina, essendo utilizzati in comune le immagini dei container e un reverse proxy a monte. Il log delle azioni di amministrazione è concatenato, ogni voce reca una somma di controllo sulla precedente e una verifica integrata segnala una catena interrotta. Gli interventi successivi risultano quindi riconoscibili; un’inalterabilità tecnica non è garantita. Se l’identità della persona viene inoltrata fino in un sistema di destinazione collegato, la registrazione del Fornitore termina al confine del sistema e vale la registrazione del sistema di destinazione.' },
          { n:'19', t:'Certificazioni e misure previste', b:'L’esercizio gestito ha luogo nei centri di calcolo di Green a Lupfig, Cantone di Argovia, certificati ISO 27001. Tale certificazione è detenuta da Green quale gestore del centro di calcolo, non dal Fornitore, e non costituisce una misura tecnica propria del Fornitore. Il Fornitore non dispone oggi di alcuna certificazione propria; una propria certificazione ISO 27001 è in corso, un rapporto SOC 2 non è disponibile. Valgono inoltre come previsti e non come garantiti: un proxy di uscita con elenco di autorizzazione per gli accessi di rete dalla sandbox di codice (in corso); il livello di isolamento più forte della sandbox di codice, che presuppone il supporto della virtualizzazione sul server e che pertanto non è ovunque l’impostazione predefinita; la creazione e il blocco automatici di account tramite SCIM (previsto; oggi il blocco avviene tramite il servizio di directory).' },
          { n:'20', t:'Sub-responsabili del trattamento: autorizzazione e cambiamento', b:'Il Fornitore ricorre a sub-responsabili del trattamento soltanto con la previa autorizzazione del Cliente; ciò è richiesto dall’art. 9, cpv. 3, nLPD ed è sanzionato penalmente ai sensi dell’art. 61, lett. b, nLPD, una semplice informazione non è sufficiente. Per i soggetti indicati nominativamente nell’elenco dei sub-responsabili del trattamento il Cliente rilascia l’autorizzazione con la conclusione del presente contratto. Per i soggetti nuovi o sostituiti vale quanto segue: il Fornitore annuncia il cambiamento 30 giorni [proposta] in anticipo in forma testuale, indicando nome, persona giuridica, sede, finalità e base della trasmissione. Il Cliente può opporsi entro 14 giorni [proposta] dal ricevimento dell’annuncio per un motivo attinente alla protezione dei dati. In caso di opposizione fondata il Fornitore sospende il cambiamento; se la prestazione non può essere fornita senza il nuovo sub-responsabile del trattamento, il Cliente può disdire la parte di prestazione interessata per la data del cambiamento e ottiene la restituzione proporzionale dei compensi pagati in anticipo.' },
          { n:'21', t:'La catena effettiva', b:'Fanno parte della catena il gestore del centro di calcolo Green a Lupfig e il gateway di inferenza EuRouter. EuRouter non fornisce esso stesso l’inferenza, ma inoltra le richieste a fornitori di modelli; tali fornitori fanno parte della catena. Nella ricerca sul web ne fanno parte parimenti: il richiamo delle pagine web trovate e i motori di ricerca esterni interrogati. Il Fornitore indica questo livello nell’elenco dei sub-responsabili del trattamento e lo rende consultabile al Cliente su richiesta, con persona giuridica, sede e base della trasmissione. I componenti che il Fornitore gestisce sulla propria infrastruttura non sono sub-responsabili del trattamento; ciò vale per il servizio di ricerca ospitato in proprio.' },
          { n:'22', t:'Trasferimento degli obblighi e responsabilità per i sub-responsabili del trattamento', b:'Il Fornitore vincola per iscritto ogni sub-responsabile del trattamento a obblighi sostanzialmente identici a quelli che il presente contratto impone a lui stesso, compresi i diritti di prova e di controllo del Cliente, e assicura che tali diritti siano azionabili anche nei confronti del sub-responsabile del trattamento (art. 28, par. 4, GDPR). Se un sub-responsabile del trattamento non adempie ai propri obblighi in materia di protezione dei dati, il Fornitore risponde verso il Cliente del comportamento di quest’ultimo come del proprio. Il Cliente dispone così in ogni caso di una controparte in Svizzera nei cui confronti far valere le proprie pretese.' },
          { n:'23', t:'Luogo del trattamento ed eccezioni indicate', b:'La conservazione e l’esercizio hanno luogo in Svizzera presso Green a Lupfig. L’inferenza dei modelli avviene tramite EuRouter nell’UE. Sono espressamente indicate due eccezioni. In primo luogo la ricerca sul web: le interrogazioni vengono inoltrate a motori di ricerca esterni senza identità dell’utente e possono in tale occasione lasciare lo spazio dell’UE, dello SEE e della Svizzera. L’affermazione secondo cui tutto resta in Europa vale per la conservazione e per l’inferenza, non per l’interrogazione di ricerca in quanto tale. In secondo luogo un fornitore di modelli supplementare al di fuori dell’Europa: un tale fornitore può essere integrato. Se ciò avviene nell’istanza del Cliente, per questo fornitore non vale la garanzia relativa all’UE e la base della trasmissione spetta al Cliente quale titolare del trattamento.' },
          { n:'24', t:'Trasmissione verso Paesi terzi: le tre basi giuridiche', b:'In primo luogo, dal Cliente nell’UE o nel SEE al Fornitore in Svizzera: a tal fine non sono necessarie clausole contrattuali tipo. Per la Svizzera esiste una decisione di adeguatezza della Commissione europea; la trasmissione è così equiparata a una trasmissione intraeuropea. In secondo luogo, dal Fornitore in Svizzera all’inferenza nell’UE: questa trasmissione si fonda sull’art. 16, cpv. 1, nLPD in combinato disposto con l’allegato 1 dell’ordinanza sulla protezione dei dati, che elenca gli Stati dello SEE quali dotati di protezione adeguata. In terzo luogo, il livello sottostante a EuRouter: per ogni fornitore di modelli il Fornitore indica su richiesta la persona giuridica, la sede e il meccanismo di trasmissione. Se la sede si trova al di fuori dell’UE, dello SEE e della Svizzera, la trasmissione si fonda sulle clausole contrattuali tipo della Commissione europea unitamente a un esame della situazione giuridica nello Stato di destinazione e, accanto a ciò, su una base svizzera autonoma ai sensi dell’art. 16, cpv. 2, nLPD, poiché i riconoscimenti europei e quelli svizzeri sono atti giuridici distinti e una base dell’UE non sostituisce quella svizzera.' },
          { n:'25', t:'Richieste di consegna delle autorità', b:'Il vincolo alle istruzioni ai sensi dell’art. 28, par. 3, lett. a, GDPR vale anche per le trasmissioni verso Paesi terzi. Senza istruzione del Cliente il Fornitore trasmette soltanto se vi è tenuto in virtù del diritto applicabile; in tal caso informa il Cliente prima della trasmissione, sempre che il diritto non vieti tale informazione. Se il Fornitore riceve un ordine amministrativo o giudiziario di consegna di dati del Cliente, ne esamina la liceità, non consegna nulla in assenza di un obbligo giuridico, impugna gli ordini manifestamente inammissibili o esaurisce i rimedi giuridici ragionevolmente esigibili, limita una consegna a quanto giuridicamente dovuto e avvisa il Cliente non appena ciò è ammesso. Se l’avviso è vietato in modo duraturo, il Fornitore documenta la fattispecie e la espone in forma aggregata nella propria rendicontazione periodica.' },
          { n:'26', t:'Nessun addestramento con i dati del Cliente', b:'Il Fornitore non utilizza i dati del Cliente per l’addestramento o il miglioramento di modelli e non li trasmette a tale scopo. Per l’inferenza tramite EuRouter vale quanto segue: ivi i contenuti delle richieste non vengono per impostazione predefinita conservati né utilizzati per l’addestramento. Si tratta di un’impostazione predefinita del gateway. Il Fornitore mantiene impostata questa configurazione predefinita per gli accessi da lui gestiti, lo verifica periodicamente e segnala al Cliente se qualcosa cambia al riguardo. I metadati di utilizzo quali le marche temporali e il numero di token vengono conservati da EuRouter fino a dodici mesi. Se il Cliente integra un endpoint di modello proprio, valgono le condizioni di quest’ultimo; l’impegno del Fornitore non si estende a tale endpoint.' },
          { n:'27', t:'Sostegno in materia di diritti degli interessati', b:'Il Fornitore sostiene il Cliente con misure tecniche e organizzative adeguate nel dar seguito alle richieste degli interessati (art. 28, par. 3, lett. e, GDPR). A tal fine il servizio mette a disposizione nel pannello di amministrazione l’esportazione dei dati e la cancellazione per singola persona, compresa la cancellazione completa; il Cliente esegue autonomamente tali operazioni. Se un interessato si rivolge direttamente al Fornitore, questi non risponde esso stesso alla richiesta, ma la inoltra senza indugio al Cliente e ne informa la persona. Se le funzioni del servizio non sono sufficienti nel singolo caso, il Fornitore fornisce un sostegno integrativo.' },
          { n:'28', t:'Notifica delle violazioni della protezione dei dati', b:'Il Fornitore notifica al Cliente ogni violazione della protezione dei dati personali senza indugio, al più tardi entro 48 ore [proposta] dalla conoscenza, in forma testuale all’ufficio designato dal Cliente. Il termine è commisurato in modo che il Cliente possa rispettare il proprio termine di 72 ore ai sensi dell’art. 33, par. 1, GDPR e il proprio obbligo di notifica ai sensi dell’art. 24 nLPD. La notifica descrive la natura dell’incidente, i tipi di dati e le categorie di interessati coinvolti, le probabili conseguenze, le misure adottate e quelle proposte nonché un punto di contatto. Se non tutte le indicazioni sono ancora disponibili, il Fornitore notifica dapprima e integra progressivamente. La notifica all’autorità di controllo e la comunicazione agli interessati restano compito del Cliente; il Fornitore lo sostiene in ciò.' },
          { n:'29', t:'Sostegno nella valutazione d’impatto e nella consultazione preliminare', b:'Il Fornitore sostiene il Cliente nella valutazione d’impatto sulla protezione dei dati ai sensi dell’art. 35 GDPR e dell’art. 22 nLPD nonché in un’eventuale consultazione preliminare dell’autorità di controllo ai sensi dell’art. 36 GDPR e dell’art. 23 nLPD. Nel caso di un assistente di intelligenza artificiale collegato a sistemi aziendali una valutazione d’impatto è la regola e non l’eccezione. Il Fornitore mette a disposizione le indicazioni necessarie a tal fine: operazioni di trattamento e flussi di dati, sub-responsabili del trattamento impiegati e riferimenti a Paesi terzi, misure tecniche e organizzative, conservazione e cancellazione, rischi noti dei componenti impiegati.' },
          { n:'30', t:'Prova, informazione e verifica', b:'Il Fornitore mette a disposizione del Cliente tutte le informazioni necessarie per dimostrare il rispetto degli obblighi derivanti dall’art. 28 GDPR e consente verifiche (art. 28, par. 3, lett. h, GDPR). Fornisce le informazioni in forma testuale entro 30 giorni [proposta] dalla richiesta. Il Cliente può inoltre svolgere, o far svolgere da un revisore, un audit per anno civile [proposta], con un preavviso di 30 giorni [proposta] e durante il normale orario di lavoro. Dopo un incidente soggetto a notifica o su ordine di un’autorità di controllo è ammesso un audit straordinario senza computo su tale contingente. Il revisore è tenuto alla segretezza e non può essere un concorrente del Fornitore. Certificati, rapporti di verifica e attestazioni sostituiscono un controllo in loco nella misura in cui coprono lo scopo della verifica; non escludono un’ispezione se restano punti aperti. I diritti previsti dalla presente sezione valgono anche nei confronti dei sub-responsabili del trattamento: il Fornitore li procura al Cliente mediante un accordo corrispondente oppure, su richiesta, svolge la verifica in via sostitutiva e ne consegna il risultato. Ciascuna parte sopporta i propri costi; l’audit annuale e le informazioni di ampiezza usuale sono gratuiti per il Cliente, mentre l’onere per ulteriori verifiche senza motivo nella sfera del Fornitore viene fatturato secondo il dispendio.' },
          { n:'31', t:'Autorità di controllo, punto di contatto e registro', b:'Su richiesta il Fornitore collabora con l’Incaricato federale della protezione dei dati e della trasparenza (EDÖB) e con l’autorità di controllo competente per il Cliente nell’UE e informa il Cliente delle richieste a esso rivolte che riguardano i dati di quest’ultimo. Punto di contatto per le questioni di protezione dei dati è Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. Il Fornitore tiene un registro di tutte le categorie di attività di trattamento che svolge per conto altrui (art. 30, par. 2, GDPR, art. 12 nLPD) e lo mette a disposizione del Cliente su richiesta. Nella misura in cui il Fornitore soggiace all’obbligo di cui all’art. 27 GDPR, designa un rappresentante nell’Unione e lo indica nelle note legali; un tale rappresentante non è designato oggi.' },
          { n:'32', t:'Conservazione nell’esercizio corrente', b:'Il Cliente stabilisce il termine di conservazione nel pannello di amministrazione; la fissazione e la modifica di tale termine valgono come istruzione. Di fabbrica non è impostato alcun termine: senza termine impostato le conversazioni restano memorizzate finché gli utenti o l’amministrazione non le cancellano. Se un termine è impostato, le conversazioni scadute vengono rimosse definitivamente unitamente ai messaggi, ai link condivisi e alle voci dell’indice di ricerca; determinante è l’ultima modifica, non la data di creazione. I dati di fatturazione non sono compresi nel termine e restano conservati affinché il consumo dei periodi trascorsi resti ricostruibile; vengono rimossi soltanto in caso di cancellazione completa, fatti salvi gli obblighi di conservazione del diritto commerciale e fiscale. Presso il fornitore di inferenza sorgono metadati di utilizzo che vi vengono conservati fino a dodici mesi.' },
          { n:'33', t:'Restituzione e cancellazione dopo la fine del contratto', b:'Il Cliente sceglie se i dati siano restituiti o cancellati (art. 28, par. 3, lett. g, GDPR) e comunica la propria scelta entro la fine della durata contrattuale. In assenza di comunicazione vale quale caso standard la restituzione con successiva cancellazione. La restituzione avviene entro 30 giorni [proposta] dalla fine del contratto in un formato strutturato, di uso corrente e leggibile da dispositivo automatico: esportazione della banca dati delle conversazioni e degli account, file nell’originale, log in formato CSV. Successivamente il Fornitore cancella i dati produttivi. La cancellazione completa, comprese tutte le copie di sicurezza, è conclusa entro 90 giorni [proposta] dalla fine del contratto; il termine corrisponde al ciclo di rotazione dei salvataggi. Fino alla scadenza di un salvataggio i dati in esso contenuti restano bloccati e non vengono trattati per alcuno scopo diverso dal ripristino in caso di emergenza. I log di audit e di accesso seguono la sorte dei contenuti. Su richiesta il Fornitore conferma la cancellazione in forma testuale. Fanno eccezione i dati di fatturazione e i dati per i quali sussiste un obbligo legale di conservazione; questi vengono bloccati e cancellati alla scadenza dell’obbligo.' },
          { n:'34', t:'Costi delle prestazioni di sostegno', b:'Il sostegno in materia di diritti degli interessati, di notifiche e di valutazione d’impatto è compensato, nella misura usuale, con il compenso del contratto principale. Se l’onere supera nettamente la misura usuale, in particolare in caso di un numero elevato di richieste analoghe o di richieste riconducibili a una configurazione del Cliente, il Fornitore lo fattura secondo il dispendio alle tariffe concordate, dopo averne informato preventivamente il Cliente e averne ottenuto il consenso. La restituzione e la cancellazione dopo la fine del contratto sono gratuite nel formato standard; le elaborazioni ulteriori vengono fatturate secondo il dispendio.' },
          { n:'35', t:'Responsabilità', b:'Per i danni derivanti dal trattamento di dati personali prevalgono le disposizioni legali imperative, segnatamente l’art. 82 GDPR. L’esclusione della responsabilità per la perdita di dati di cui alla cifra 10 delle CG non si applica nella misura in cui la perdita si fonda su una violazione degli obblighi derivanti dal presente contratto, in particolare delle misure di cui alla sezione «Misure tecniche e organizzative». Se più soggetti rispondono nei confronti di un interessato, il regresso nei rapporti interni si determina secondo la rispettiva quota di responsabilità (art. 82, par. 5, GDPR). Per i propri sub-responsabili del trattamento il Fornitore risponde come per il proprio comportamento.' },
          { n:'36', t:'Diritto applicabile, foro competente e versioni linguistiche', b:'Si applica il diritto svizzero, con esclusione delle norme di conflitto. Foro esclusivo è Windisch, Cantone di Argovia, nella misura in cui ciò è legalmente ammesso. Restano riservati i fori imperativi degli interessati e la competenza delle autorità di controllo, così come l’applicabilità diretta del GDPR nella misura in cui esso si applica al trattamento. Il presente contratto è disponibile in cinque lingue. Fa fede la versione tedesca; le altre versioni servono a scopo informativo.' },
          { n:'37', t:'Stato, versione e modifiche', b:'Stato: agosto 2026, versione 1.0. Le modifiche e le integrazioni richiedono la forma testuale e il consenso di entrambe le parti. Fanno eccezione l’aggiornamento dell’elenco dei sub-responsabili del trattamento secondo la procedura a tal fine convenuta e l’evoluzione delle misure tecniche e organizzative entro i limiti del divieto di abbassare il livello di protezione. I termini e le quantità contrassegnati con [proposta] sono proposte del Fornitore e restano negoziabili fino alla conclusione del contratto.' }
        ],
        disclaimer:'Nota: il presente testo non costituisce una consulenza legale. Diventa vincolante soltanto con la firma di entrambe le parti o con l’accettazione nell’ambito del contratto principale. I valori contrassegnati con [proposta] sono proposte del Fornitore.'
      },
      es: {
        back:'Volver al Trust Center', status:'Estado: agosto de 2026',
        h1:'Acuerdo de encargo de tratamiento (DPA)',
        intro:'El presente contrato regula cómo Herr Informatik GmbH trata datos personales por cuenta del Cliente cuando explota el servicio EU Cowork AI en modalidad gestionada. Se rige por el art. 28 del RGPD y por el art. 9 de la Ley Federal suiza de Protección de Datos revisada (nLPD, abreviatura alemana DSG). Los plazos y las cantidades que todavía no se han negociado con el Cliente llevan la marca [propuesta] y reflejan el valor usual del mercado que el Proveedor propone.',
        sections:[
          { n:'1', t:'Partes y objeto del contrato', b:'Las partes contratantes son Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Suiza, IDE CHE-112.168.836 (en lo sucesivo, «el Proveedor»), y el Cliente. «EU Cowork AI» es la denominación del servicio y no una parte contratante. El objeto es el tratamiento de datos personales que el Proveedor lleva a cabo por cuenta del Cliente al prestar el servicio gestionado.' },
          { n:'2', t:'Papeles de las partes', b:'El Cliente es responsable del tratamiento en el sentido del art. 4, punto 7, del RGPD y del art. 5, letra j, de la nLPD; el Proveedor es encargado del tratamiento («Auftragsbearbeiter» en el sentido del art. 9 de la nLPD). El Cliente decide sobre los fines y los medios del tratamiento. El Proveedor es responsable del tratamiento por cuenta propia únicamente respecto de sus datos de facturación, de los registros de seguridad y de explotación de su propia infraestructura, de los datos de contacto de las personas de contacto contractuales y de los deberes legales de documentación; a ellos se aplica su declaración de protección de datos y no el presente contrato. Fuera de esta enumeración el Proveedor no determina ni el fin ni los medios; de lo contrario se le consideraría responsable del tratamiento conforme al art. 28, apdo. 10, del RGPD.' },
          { n:'3', t:'Ámbito de aplicación y estado del servicio', b:'El presente contrato se aplica a la explotación gestionada, en la que el Proveedor pone el servicio a disposición en su infraestructura. En caso de explotación autónoma del software de código abierto en la infraestructura propia del Cliente, ningún dato llega al Proveedor; no surge ningún tratamiento por cuenta ajena y el presente contrato queda sin objeto mientras no se acuerden por separado prestaciones de explotación o de asistencia con acceso a los datos. El servicio gestionado se encuentra en construcción. Las medidas que hoy todavía no están implantadas se señalan expresamente como previstas en la sección «Certificaciones y medidas previstas» y no están garantizadas.' },
          { n:'4', t:'Orden de prelación y partes integrantes del contrato', b:'En todas las cuestiones relativas al tratamiento de datos personales, el presente contrato prevalece sobre las condiciones generales. La presunción de aceptación de las modificaciones de las CG (cláusula 12 de las CG) no se aplica al presente contrato: las modificaciones requieren el consentimiento del Cliente en forma textual. Se exceptúan la actualización de la lista de subencargados del tratamiento conforme al procedimiento previsto a tal efecto y el desarrollo ulterior de las medidas técnicas y organizativas dentro de los límites de la prohibición de rebajar el nivel de protección. Forman parte del presente contrato el anexo «Medidas técnicas y organizativas» en su versión fechada correspondiente, así como la lista de subencargados del tratamiento.' },
          { n:'5', t:'Fin, naturaleza y operaciones del tratamiento', b:'El tratamiento se realiza con los siguientes fines: explotación de la función de chat y de asistencia; reenvío de las entradas al proveedor de inferencia para generar respuestas; búsqueda web con indicación de las fuentes; llamadas a sistemas conectados a través de la pasarela MCP y de conexiones directas; generación de archivos; capacidad de búsqueda mediante un índice de búsqueda; almacenamiento automatizado de entradas de memoria; registro del uso y de la administración; copia de seguridad y restauración de los datos; resolución de incidencias y asistencia; facturación del uso. Las operaciones de tratamiento son la recogida, el registro, la organización, la conservación, la adaptación, la extracción, la consulta, la utilización, la comunicación por transmisión a subencargados del tratamiento, el cotejo, la limitación, la supresión y la destrucción. El Proveedor no adopta decisiones individuales automatizadas sobre los interesados; si las salidas del servicio se utilizan para tales decisiones lo determina únicamente el Cliente.' },
          { n:'6', t:'Tipos de datos', b:'Se tratan: los contenidos que los usuarios introducen, junto con los archivos adjuntos y las respuestas generadas; los datos de cuenta y de perfil, así como los metadatos del uso (marcas de tiempo, elección del modelo, número de tokens); los datos de facturación; los registros de auditoría y de acceso, incluidos los registros de las actuaciones de administración; los contenidos que se leen de sistemas conectados a petición de los usuarios (por ejemplo, ERP, SharePoint, repositorios de archivos); las consultas de la búsqueda web; las entradas de memoria que el servicio deduce de las conversaciones y almacena sin una actuación separada de los usuarios. El Proveedor inscribe las entradas de memoria en su registro como actividad de tratamiento propia, porque surgen sin una entrada activa del interesado.' },
          { n:'7', t:'Categorías de interesados', b:'Resultan afectados los empleados del Cliente y sus auxiliares, los contactos comerciales, los clientes del Cliente, los proveedores y sus empleados, las candidatas y los candidatos, así como todas las demás personas que se mencionen en los textos introducidos, en los archivos adjuntos o en los contenidos de los sistemas conectados.' },
          { n:'8', t:'Categorías especiales de datos personales', b:'El servicio no está concebido para datos personales especialmente dignos de protección. Son determinantes dos catálogos que no coinciden: el art. 9 y el art. 10 del RGPD, por un lado, y el art. 5, letra c, de la nLPD, por otro. Sin un acuerdo escrito separado sobre garantías adicionales, el Cliente no puede introducir tales datos en el servicio e instruye a sus usuarios en consecuencia. El servicio no impide técnicamente la introducción. Si tales datos llegan no obstante al servicio, se aplican las mismas medidas técnicas y organizativas que a todos los demás contenidos; de la licitud del tratamiento y de las eventuales cautelas de protección adicionales responde el Cliente.' },
          { n:'9', t:'Duración y fase poscontractual', b:'El presente contrato comienza con el contrato principal y termina con él. A continuación sigue una fase poscontractual en la que se llevan a término la devolución, la supresión y la caducidad de las copias de seguridad. Durante la fase poscontractual todas las obligaciones del presente contrato siguen aplicándose sin cambios. Las obligaciones de confidencialidad siguen aplicándose sin límite temporal.' },
