<h1>Data Processing Agreement (DPA)</h1>
<p>This agreement governs how Herr Informatik GmbH processes personal data on behalf of the Customer when it operates the EU Cowork AI service as a managed service. It follows Art. 28 GDPR and Art. 9 of the revised Swiss Federal Act on Data Protection (revised FADP, German abbreviation DSG). Periods and quantities that have not yet been negotiated with the Customer carry the marker [proposed] and state the customary market value that the Provider proposes.</p>
<h2>1 Parties and subject matter</h2>
<p>The parties to this agreement are Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Switzerland, company identification number CHE-112.168.836 (hereinafter “the Provider”), and the Customer. “EU Cowork AI” is the name of the service and not a party to the agreement. The subject matter is the processing of personal data that the Provider carries out on behalf of the Customer when providing the managed service.</p>
<h2>2 Roles of the parties</h2>
<p>The Customer is the controller within the meaning of Art. 4(7) GDPR and Art. 5(j) of the revised FADP, and the Provider is the processor (Auftragsbearbeiter under Art. 9 revised FADP). The Customer decides on the purposes and means of the processing. The Provider is a controller in its own right solely for its billing data, for the security and operating logs of its own infrastructure, for the contact details of the contractual contact persons and for statutory record-keeping duties; for those its privacy policy applies and not this agreement. Outside that list the Provider determines neither purpose nor means; otherwise it would be deemed a controller under Art. 28(10) GDPR.</p>
<h2>3 Scope and state of the service</h2>
<p>This agreement applies to managed operation, in which the Provider makes the service available on its own infrastructure. Where the Customer self-hosts the open-source software on its own infrastructure, no data flows to the Provider; no processing on behalf of a controller arises, and this agreement remains without object for as long as no operating or support services involving access to data are agreed separately. The managed service is under construction. Measures that are not yet implemented today are expressly marked as planned in the section “Certifications and planned measures” and are not warranted.</p>
<h2>4 Order of precedence and constituent parts</h2>
<p>In all questions concerning the processing of personal data, this agreement takes precedence over the General Terms and Conditions. The deemed-approval provision for amendments to the GTC (clause 12 GTC) does not apply to this agreement: amendments require the consent of the Customer in text form. Excepted are the updating of the list of subprocessors under the procedure provided for that purpose and the further development of the technical and organisational measures within the limits of the prohibition on lowering the level of protection. The annex “Technical and organisational measures” in its respective dated version and the list of subprocessors form part of this agreement.</p>
<h2>5 Purpose, nature and operations of the processing</h2>
<p>Processing is carried out for the following purposes: operation of the chat and assistant function; forwarding of inputs to the inference provider in order to generate answers; web search with source references; calls to connected systems via the MCP gateway and via direct connections; generation of files; searchability through a search index; automated storage of memory entries; logging of use and administration; backup and restoration; fault clearance and support; billing of use. The processing operations are collection, recording, organisation, storage, adaptation, retrieval, consultation, use, disclosure by transmission to subprocessors, alignment, restriction, erasure and destruction. The Provider takes no automated individual decisions concerning data subjects; whether outputs of the service are used for such decisions is determined by the Customer alone.</p>
<h2>6 Types of data</h2>
<p>The following are processed: content that users enter, together with attachments and the answers generated; account and profile data as well as usage metadata (timestamps, model choice, token counts); billing data; audit and access logs including the logs of administrator actions; content read from connected systems at the request of users (for example ERP, SharePoint, file stores); search queries of the web search; memory entries that the service derives from conversations and stores without any separate action by the users. The Provider lists the memory entries in its record as a processing activity of its own, because they arise without any active input by the data subject.</p>
<h2>7 Categories of data subjects</h2>
<p>Data subjects are employees of the Customer and its auxiliary persons, business contacts, customers of the Customer, suppliers and their employees, job applicants and all other persons mentioned in entered texts, in attachments or in the content of connected systems.</p>
<h2>8 Special categories of personal data</h2>
<p>The service is not designed for particularly sensitive personal data. Two catalogues are relevant and they do not coincide: Art. 9 and Art. 10 GDPR on the one hand, Art. 5(c) revised FADP on the other. Without a separate written agreement on additional safeguards, the Customer may not introduce such data into the service and instructs its users accordingly. The service does not technically prevent such input. If such data nevertheless enters the service, the same technical and organisational measures apply as for all other content; the Customer is answerable for the lawfulness of the processing and for any additional protective arrangements.</p>
<h2>9 Duration and wind-down phase</h2>
<p>This agreement begins with the main contract and ends with it. A wind-down phase then follows, in which return, erasure and the expiry of the backup copies are completed. During the wind-down phase all obligations under this agreement continue to apply unchanged. The confidentiality obligations continue to apply without any time limit.</p>
<h2>10 Instructions: form, addressee and configuration</h2>
<p>The Customer issues instructions in text form to the Provider at info@herr-informatik.ch. The configuration in the product itself expressly also counts as a documented instruction, that is, the settings that the Customer or its administrators make in the admin panel: retention periods, model selection, connections and tool permissions, user and group permissions, activation of the web search and of the memory function, export and erasure of individual persons. In practice this is the most frequent form of instruction. The Customer confirms instructions given orally in text form without delay. The Provider documents the instructions it receives and retains them for the term of this agreement and the wind-down phase.</p>
<h2>11 Duty to give notice of an unlawful instruction</h2>
<p>If the Provider is of the opinion that an instruction infringes the GDPR, the revised FADP or other data protection provisions, it informs the Customer without delay (Art. 28(3), second subparagraph, GDPR). It may suspend execution of the instruction concerned until the matter is clarified, without thereby being in breach of contract. If the Customer insists on a manifestly unlawful instruction, the Provider may refuse execution and terminate the part of the service affected.</p>
<h2>12 Obligations and rights of the controller</h2>
<p>The Customer is responsible for the lawfulness of the collection of the data and of the instructions it issues, has its own legal basis for the processing and informs the data subjects. It manages accounts, roles and permissions itself and blocks users who have left. It is responsible for the connections it configures to its own and to third-party systems, for the service accounts stored there and the scope of their permissions, and for model endpoints it integrates itself. It sets the retention period. It has the rights to information and to review under the section “Evidence, information and review”.</p>
<h2>13 Warranties under Swiss law</h2>
<p>The Provider processes the data only in the way in which the Customer would itself be permitted to process it (Art. 9(1) revised FADP). The Customer warrants that no statutory or contractual duty of confidentiality precludes the processing by the Provider (Art. 9(2) revised FADP). If such a duty arises only later, the Customer gives notice of this without delay and the parties agree the additional measures required.</p>
<h2>14 Professional and official secrecy</h2>
<p>If the Customer is subject to professional secrecy, for example under Art. 321 of the Swiss Criminal Code (StGB) or under Art. 47 of the Banking Act, it notifies the Provider of this before the processing begins. In that case the Provider and the persons it deploys act as auxiliary persons of the Customer and are subject to the same duty of secrecy to the same extent. The Provider binds its subprocessors accordingly, in so far as they may have access to the data concerned.</p>
<h2>15 Confidentiality of the persons deployed</h2>
<p>The Provider deploys only persons who are bound to confidentiality or who are subject to an appropriate statutory duty of secrecy (Art. 28(3)(b) GDPR). The undertaking is given before work begins, in text form, and continues to apply without any time limit after the employment or contractual relationship ends. The Provider evidences the undertaking at the request of the Customer. The persons deployed are trained on the requirements of this agreement and on data protection.</p>
<h2>16 Access by Provider personnel to Customer data</h2>
<p>Access to the systems of the Customer is granted only to individually named persons of the Provider and only in so far as this is necessary for operation, maintenance, fault clearance or support. Every administrative access is logged. Access to user content takes place only at the request of the Customer or in order to remedy a specific fault, and in that case under the four-eyes principle. The Customer can view the logs of administrative access and export them as CSV. On request the Provider names the group of persons authorised to access.</p>
<h2>17 Technical and organisational measures</h2>
<p>The Provider takes the measures required under Art. 32(1) GDPR and Art. 8 revised FADP in order to ensure a level of protection appropriate to the risk. These include pseudonymisation, in so far as it is compatible with the purpose, encryption, ensuring the confidentiality, integrity, availability and resilience of the systems, the ability to restore quickly after an incident, and a procedure for regularly reviewing and evaluating the effectiveness of these measures. The details are set out in the annex “Technical and organisational measures”, which in its dated version forms part of this agreement. The Provider may adapt the measures to the state of the art, provided that the agreed level of protection is not thereby fallen below; it notifies the Customer of material changes.</p>
<h2>18 Warranted scope of encryption, separation and logging</h2>
<p>Transmissions are encrypted. At rest, encryption of the storage media in managed operation is part of the server provisioning; encryption of individual records at application level going beyond that is not warranted. To separate customers, each customer receives its own stack with its own database, its own search index, its own file store, its own configuration, its own network and its own inference key. The dividing line is this stack and not the physical machine: up to about 15 users, several customers may share one machine, with the container images and an upstream reverse proxy being used jointly. The log of administrator actions is chained, each entry carries a checksum over the preceding one, and a built-in check reports a broken chain. Subsequent interference is therefore noticeable; technical immutability is not warranted. Where the identity of the person is passed through into a connected target system, the logging by the Provider ends at the system boundary, and the logging of the target system applies.</p>
<h2>19 Certifications and planned measures</h2>
<p>The managed operation takes place in the ISO 27001-certified data centres of Green in Lupfig, canton of Aargau. This certification is held by Green as the data centre operator, not by the Provider, and is not a technical measure of the Provider itself. The Provider holds no certification of its own today; its own ISO 27001 certification is in progress, and no SOC 2 report is available. The following likewise count as planned and not as warranted: an egress proxy with an allow list for network access from the code sandbox (in progress); the strongest isolation level of the code sandbox, which presupposes virtualisation support on the server and for that reason is not the default setting everywhere; the automatic provisioning and blocking of accounts via SCIM (planned; today blocking takes place through the directory service).</p>
<h2>20 Subprocessors: authorisation and changes</h2>
<p>The Provider engages subprocessors only with the prior authorisation of the Customer; Art. 9(3) revised FADP requires this and Art. 61(b) revised FADP makes a breach a criminal offence, so mere information is not sufficient. For the bodies named in the list of subprocessors, the Customer grants the authorisation upon conclusion of this agreement. For new or replaced bodies the following applies: the Provider announces the change 30 days [proposed] in advance in text form, stating the name, legal entity, registered office, purpose and basis for the transfer. The Customer may object within 14 days [proposed] of receipt of the announcement on a data protection ground. In the case of a justified objection the Provider suspends the change; if the service cannot be provided without the new subprocessor, the Customer may terminate the part of the service affected as at the date of the change and receives a pro rata refund of fees paid in advance.</p>
<h2>21 The actual chain</h2>
<p>The chain comprises the data centre operator Green in Lupfig and the inference gateway EuRouter. EuRouter does not perform the inference itself but passes the requests on to model providers; those providers are part of the chain. In the case of the web search, the following also belong to it: the retrieval of the web pages found and the external search engines queried. The Provider sets out this level in the list of subprocessors and, on request, makes it available to the Customer for inspection with legal entity, registered office and basis for the transfer. Components that the Provider operates on its own infrastructure are not subprocessors; this applies to the self-hosted search service.</p>
<h2>22 Passing on the obligations and liability for subprocessors</h2>
<p>The Provider binds every subprocessor in writing to substantially the same obligations as this agreement imposes on it, including the rights of the Customer to evidence and review, and ensures that these rights are also enforceable against the subprocessor (Art. 28(4) GDPR). Where a subprocessor fails to fulfil its data protection obligations, the Provider remains liable to the Customer for that subprocessor’s conduct as for its own. The Customer thus has, in every case, a party against which to bring claims in Switzerland.</p>
<h2>23 Place of processing and the exceptions named</h2>
<p>Storage and operation take place in Switzerland at Green in Lupfig. The model inference takes place via EuRouter in the EU. Two exceptions are expressly named. First, the web search: search queries are forwarded to external search engines without user identity and may in the process leave the EU, EEA and Swiss area. The statement that everything stays in Europe applies to storage and inference, not to the search query itself. Second, an additional model provider outside Europe: such a provider can be integrated. Where that is the case in the instance of the Customer, the EU assurance does not apply to that provider, and the basis for the transfer lies with the Customer as controller.</p>
<h2>24 Third-country transfers: the three legal bases</h2>
<p>First, from the Customer in the EU or the EEA to the Provider in Switzerland: no standard contractual clauses are required for this. An adequacy decision of the European Commission exists for Switzerland; the transfer is thereby placed on the same footing as one within Europe. Second, from the Provider in Switzerland to the inference in the EU: this transfer is based on Art. 16(1) revised FADP in conjunction with Annex 1 of the Data Protection Ordinance, which lists the EEA states as providing adequate protection. Third, the level below EuRouter: for each model provider the Provider names, on request, the legal entity, registered office and transfer mechanism. Where the registered office lies outside the EU, the EEA and Switzerland, the transfer is based on the standard contractual clauses of the European Commission together with an assessment of the legal situation in the destination country, and alongside that on a separate Swiss basis under Art. 16(2) revised FADP, because the European and the Swiss recognitions are separate legal acts and an EU basis does not replace the Swiss one.</p>
<h2>25 Government requests for disclosure</h2>
<p>The binding effect of instructions under Art. 28(3)(a) GDPR also applies to transfers to third countries. Without an instruction from the Customer, the Provider transfers data only where it is obliged to do so under applicable law; in that case it informs the Customer before the transfer, unless the law prohibits that information. If the Provider receives an administrative or judicial order to hand over Customer data, it examines the lawfulness of that order, hands over nothing in the absence of a legal obligation, challenges manifestly inadmissible orders or exhausts the legal remedies that can reasonably be expected of it, limits any disclosure to what is legally required and notifies the Customer as early as is permissible. Where notification is permanently prohibited, the Provider documents the matter and reports it in aggregated form in its periodic reporting.</p>
<h2>26 No training on Customer data</h2>
<p>The Provider does not use Customer data for the training or improvement of models and does not pass it on for that purpose. For the inference via EuRouter the following applies: there, the content of the requests is by default not retained and not used for training. This is a default setting of the gateway. The Provider keeps this default setting in place for the access paths it operates, checks this periodically and notifies the Customer if anything changes in that respect. EuRouter retains usage metadata such as timestamps and token counts for up to twelve months. If the Customer integrates a model endpoint of its own, the terms of that endpoint apply; the undertaking of the Provider does not extend to that endpoint.</p>
<h2>27 Support with data subject rights</h2>
<p>The Provider supports the Customer by appropriate technical and organisational measures in complying with requests from data subjects (Art. 28(3)(e) GDPR). For this purpose the service provides data export and erasure per person in the admin panel, including full erasure; the Customer carries out these operations itself. If a data subject approaches the Provider directly, the Provider does not answer the request itself but forwards it to the Customer without delay and informs the person of this. Where the functions of the service are not sufficient in an individual case, the Provider provides additional support.</p>
<h2>28 Notification of personal data breaches</h2>
<p>The Provider notifies the Customer of any breach of the protection of personal data without delay, at the latest within 48 hours [proposed] of becoming aware of it, in text form to the point designated by the Customer. The period is measured so that the Customer can meet its own period of 72 hours under Art. 33(1) GDPR and its duty to report under Art. 24 revised FADP. The notification describes the nature of the incident, the types of data and the categories of data subjects affected, the likely consequences, the measures taken and those proposed, and a contact point. If not all the details are yet available, the Provider notifies first and supplements the notification on an ongoing basis. Notification of the supervisory authority and communication to the data subjects remain a matter for the Customer; the Provider supports it in this.</p>
<h2>29 Support with impact assessment and prior consultation</h2>
<p>The Provider supports the Customer with the data protection impact assessment under Art. 35 GDPR and Art. 22 revised FADP and with any prior consultation of the supervisory authority under Art. 36 GDPR and Art. 23 revised FADP. In the case of an AI assistant connected to business systems, an impact assessment is the normal case and not the exception. The Provider makes available the information required for it: processing operations and data flows, the subprocessors used and third-country elements, technical and organisational measures, retention and erasure, known risks of the components used.</p>
<h2>30 Evidence, information and review</h2>
<p>The Provider makes available to the Customer all information necessary to demonstrate compliance with the obligations under Art. 28 GDPR and allows for reviews (Art. 28(3)(h) GDPR). It gives information in text form within 30 days [proposed] of the request. In addition, the Customer may carry out one audit per calendar year [proposed], or have it carried out by an auditor, with advance notice of 30 days [proposed] and during ordinary business hours. Following a notifiable incident or by order of a supervisory authority, an unscheduled audit is permissible without being counted against this allowance. The auditor is bound to secrecy and may not be a competitor of the Provider. Certificates, audit reports and attestations replace an on-site inspection in so far as they cover the purpose of the review; they do not preclude an inspection where open points remain. The rights under this section also apply as against the subprocessors: the Provider obtains them for the Customer by way of a corresponding agreement or, on request, carries out the review vicariously and hands over the result. Each party bears its own costs; the annual audit and information in the customary scope are free of charge for the Customer, while effort for further reviews without cause in the sphere of the Provider is charged on a time and materials basis.</p>
<h2>31 Supervisory authorities, contact point and record</h2>
<p>On request the Provider cooperates with the Federal Data Protection and Information Commissioner (EDÖB) and with the supervisory authority responsible for the Customer in the EU, and informs the Customer of enquiries addressed to it that concern the data of the Customer. The contact point for data protection questions is Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. The Provider maintains a record of all categories of processing activities carried out on behalf of a controller (Art. 30(2) GDPR, Art. 12 revised FADP) and makes it available to the Customer on request. In so far as the Provider is subject to the obligation under Art. 27 GDPR, it designates a representative in the Union and states that representative in its legal notice; no such representative is designated today.</p>
<h2>32 Retention in ongoing operation</h2>
<p>The Customer sets the retention period in the admin panel; the setting and changing of this period counts as an instruction. No period is set by default: without a period set, conversations remain stored until users or the administration delete them. Where a period is set, expired conversations are permanently removed together with messages, shared links and search index entries; what is decisive is the last change, not the date of creation. Billing data is not covered by the period and is retained so that consumption in past periods remains traceable; it is removed only upon full erasure, subject to retention duties under commercial and tax law. Usage metadata arises at the inference provider and is retained there for up to twelve months.</p>
<h2>33 Return and erasure after the end of the contract</h2>
<p>The Customer chooses whether the data is returned or erased (Art. 28(3)(g) GDPR) and communicates its choice by the end of the term. In the absence of any communication, return followed by erasure applies as the standard case. The return takes place within 30 days [proposed] of the end of the contract in a structured, commonly used and machine-readable format: a database export of the conversations and accounts, files in the original, logs as CSV. The Provider then erases the productive data. Complete erasure including all backup copies is completed within 90 days [proposed] of the end of the contract; the period corresponds to the rotation cycle of the backups. Until a backup expires, the data it contains remains blocked and is not processed for any purpose other than restoration in an emergency. Audit and access logs share the fate of the content. On request the Provider confirms the erasure in text form. Billing data and data for which a statutory retention duty exists are excepted; such data is blocked and erased once the duty expires.</p>
<h2>34 Costs of the support services</h2>
<p>Support with data subject rights, with notifications and with the impact assessment is covered, in the customary scope, by the fee under the main contract. Where the effort clearly exceeds the customary level, in particular in the case of a high number of similar requests or of requests that go back to a configuration made by the Customer, the Provider charges for it on a time and materials basis at the agreed rates, after having pointed this out to the Customer in advance and obtained its consent. Return and erasure after the end of the contract are free of charge in the standard format; preparation going beyond that is charged on a time and materials basis.</p>
<h2>35 Liability</h2>
<p>For damage arising from the processing of personal data, the mandatory statutory provisions take precedence, in particular Art. 82 GDPR. The exclusion of liability for data loss in clause 10 of the GTC does not apply in so far as the loss is based on a breach of the obligations under this agreement, in particular of the measures under the section “Technical and organisational measures”. Where several parties are liable to a data subject, the apportionment between them follows the respective share of responsibility (Art. 82(5) GDPR). The Provider is liable for its subprocessors as for its own conduct.</p>
<h2>36 Applicable law, place of jurisdiction and language versions</h2>
<p>Swiss law applies, to the exclusion of its conflict of laws rules. The exclusive place of jurisdiction is Windisch, canton of Aargau, in so far as that is legally permissible. Mandatory places of jurisdiction of data subjects and the competence of the supervisory authorities are reserved, as is the direct applicability of the GDPR in so far as it applies to the processing. This agreement exists in five languages. The German version is authoritative; the other versions serve for information.</p>
<h2>37 Status, version and amendments</h2>
<p>As of: August 2026, version 1.0. Amendments and supplements require text form and the consent of both parties. Excepted from this are the updating of the list of subprocessors under the procedure agreed for that purpose and the further development of the technical and organisational measures within the limits of the prohibition on lowering the level of protection. Periods and quantities marked [proposed] are proposals by the Provider and are negotiable until the contract is concluded.</p>
<p>Note: this text does not constitute legal advice. It becomes binding only upon signature by both parties or upon acceptance within the framework of the main contract. Values marked [proposed] are proposals by the Provider.</p>

    margin:0; background:var(--c-bg); color:var(--c-body);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
  }
  a{ color:var(--c-eu-700); text-underline-offset:2px; transition:color .15s ease; }
  :focus-visible{ outline:2px solid var(--c-eu-700); outline-offset:3px; border-radius:6px; }
  ::selection{ background:var(--c-ice-300); color:var(--c-deep); }
  /* Lange Komposita (z. B. „Auftragsverarbeitungsvertrag") dürfen die Seite
     nicht sprengen. */
  h1,h2,h3{ text-wrap:balance; overflow-wrap:break-word; hyphens:auto; }
  p{ text-wrap:pretty; }
  @media (hover:hover) and (pointer:fine){ a:hover{ color:var(--c-ink); } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } html{ scroll-behavior:auto; } }
</style>
</helmet>
<div id="top">
  <dc-import name="SiteHeader" active-nav="security" on-landing="{{ false }}" hint-size="100%,88px"></dc-import>
  <main style="max-width:820px; margin:0 auto; padding:clamp(124px,15vw,168px) clamp(20px,5vw,40px) clamp(64px,8vw,104px);">
    <a href="/sicherheit" style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; color:#12326B; text-decoration:none; display:inline-flex; align-items:center; min-height:44px;">← {{ t.back }}</a>
    <!-- Neutral gehalten, im Eisblau der Website, zeichengleich mit den AGB.
         Die Bernstein-Variante mit dem gelben Punkt war die Warnfarbe fuer den
         Entwurf. Seit August 2026 ist dies die geltende Fassung; eine
         Hinweisflagge daneben wuerde etwas anderes behaupten. -->
    <div style="display:inline-flex; align-items:center; gap:9px; margin-top:22px; padding:6px 12px; border:0; background:#EAF3F7; box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(18,50,107,.16); border-radius:99px;">

    </div>

    <p style="font-family:'Inter',sans-serif; font-size:17.5px; line-height:1.58; letter-spacing:-0.005em; color:#41505E; margin:16px 0 0;">{{ t.intro }}</p>

          </div>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        back:'Zurück zum Trust Center', status:'Stand: August 2026',
        h1:'Auftragsverarbeitungsvertrag (AVV)',
        intro:'Dieser Vertrag regelt, wie die Herr Informatik GmbH personenbezogene Daten im Auftrag des Kunden bearbeitet, wenn sie den Dienst EU Cowork AI betreut betreibt. Er richtet sich nach Art. 28 DSGVO und Art. 9 des revidierten Schweizer Datenschutzgesetzes (DSG). Fristen und Mengenangaben, die noch nicht mit dem Kunden ausgehandelt sind, tragen die Kennzeichnung [Vorschlag] und geben den marktüblichen Wert wieder, den die Anbieterin vorschlägt.',
        sections:[
          { n:'1', t:'Parteien und Vertragsgegenstand', b:'Vertragsparteien sind die Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Schweiz, UID CHE-112.168.836 (nachfolgend „die Anbieterin"), und der Kunde. „EU Cowork AI" ist die Bezeichnung des Dienstes und keine Vertragspartei. Gegenstand ist die Bearbeitung personenbezogener Daten, welche die Anbieterin bei der Erbringung des betreuten Dienstes im Auftrag des Kunden vornimmt.' },
          { n:'2', t:'Rollen der Parteien', b:'Der Kunde ist Verantwortlicher im Sinne von Art. 4 Ziff. 7 DSGVO und Art. 5 lit. j DSG, die Anbieterin ist Auftragsverarbeiterin (Auftragsbearbeiterin nach Art. 9 DSG). Der Kunde entscheidet über Zwecke und Mittel der Bearbeitung. Eigene Verantwortliche ist die Anbieterin ausschliesslich für ihre Abrechnungsdaten, für die Sicherheits- und Betriebsprotokolle ihrer eigenen Infrastruktur, für Kontaktdaten der Vertragsansprechpartner und für gesetzliche Nachweispflichten; dafür gilt ihre Datenschutzerklärung und nicht dieser Vertrag. Ausserhalb dieser Aufzählung bestimmt die Anbieterin weder Zweck noch Mittel; andernfalls gälte sie nach Art. 28 Abs. 10 DSGVO als Verantwortliche.' },
          { n:'3', t:'Geltungsbereich und Stand des Dienstes', b:'Dieser Vertrag gilt für den betreuten Betrieb, bei dem die Anbieterin den Dienst auf ihrer Infrastruktur bereitstellt. Beim Selbstbetrieb der quelloffenen Software auf eigener Infrastruktur des Kunden fliessen keine Daten zur Anbieterin; es entsteht keine Auftragsbearbeitung, und dieser Vertrag bleibt gegenstandslos, solange nicht gesondert Betriebs- oder Supportleistungen mit Datenzugriff vereinbart werden. Der betreute Dienst befindet sich im Aufbau. Massnahmen, die heute noch nicht umgesetzt sind, sind im Abschnitt „Zertifizierungen und geplante Massnahmen" ausdrücklich als geplant gekennzeichnet und nicht zugesichert.' },
          { n:'4', t:'Rangverhältnis und Vertragsbestandteile', b:'In allen Fragen der Bearbeitung personenbezogener Daten geht dieser Vertrag den Allgemeinen Geschäftsbedingungen vor. Die Genehmigungsfiktion für AGB-Änderungen (Ziff. 12 AGB) gilt für diesen Vertrag nicht: Änderungen bedürfen der Zustimmung des Kunden in Textform. Ausgenommen sind die Aktualisierung der Liste der Unterauftragsverarbeiter nach dem dafür vorgesehenen Verfahren und die Fortentwicklung der technischen und organisatorischen Massnahmen im Rahmen des Verschlechterungsverbots. Bestandteil dieses Vertrags sind die Anlage „Technische und organisatorische Massnahmen" in ihrer jeweils datierten Fassung sowie die Liste der Unterauftragsverarbeiter.' },
          { n:'5', t:'Zweck, Art und Vorgänge der Bearbeitung', b:'Bearbeitet wird zu folgenden Zwecken: Betrieb der Chat- und Assistenzfunktion; Weiterleitung von Eingaben an den Inferenz-Anbieter zur Erzeugung von Antworten; Websuche mit Quellenangabe; Aufrufe angebundener Systeme über das MCP-Gateway und über direkte Anbindungen; Erzeugung von Dateien; Durchsuchbarkeit über einen Suchindex; automatisierte Speicherung von Gedächtniseinträgen; Protokollierung von Nutzung und Administration; Datensicherung und Wiederherstellung; Störungsbehebung und Support; Abrechnung der Nutzung. Verarbeitungsvorgänge sind das Erheben, Erfassen, Organisieren, Speichern, Anpassen, Auslesen, Abfragen, Verwenden, Offenlegen durch Übermittlung an Unterauftragsverarbeiter, Verknüpfen, Einschränken, Löschen und Vernichten. Die Anbieterin trifft keine automatisierten Einzelentscheidungen über betroffene Personen; ob Ausgaben des Dienstes zu solchen Entscheidungen verwendet werden, bestimmt allein der Kunde.' },
          { n:'6', t:'Arten der Daten', b:'Bearbeitet werden: Inhalte, die Nutzer eingeben, samt Anhängen und den erzeugten Antworten; Konto- und Profildaten sowie Metadaten der Nutzung (Zeitstempel, Modellwahl, Token-Zahlen); Abrechnungsdaten; Audit- und Zugriffsprotokolle einschliesslich der Protokolle über Administratorhandlungen; Inhalte, die auf Anforderung der Nutzer aus angebundenen Systemen gelesen werden (etwa ERP, SharePoint, Dateiablagen); Suchanfragen der Websuche; Gedächtniseinträge, die der Dienst aus Unterhaltungen ableitet und ohne gesonderte Handlung der Nutzer speichert. Die Gedächtniseinträge führt die Anbieterin als eigene Bearbeitungstätigkeit im Verzeichnis, weil sie ohne aktive Eingabe der betroffenen Person entstehen.' },
          { n:'7', t:'Kategorien betroffener Personen', b:'Betroffen sind Mitarbeitende des Kunden und dessen Hilfspersonen, Geschäftskontakte, Kunden des Kunden, Lieferanten und deren Mitarbeitende, Bewerberinnen und Bewerber sowie alle weiteren Personen, die in eingegebenen Texten, in Anhängen oder in den Inhalten angebundener Systeme erwähnt werden.' },
          { n:'8', t:'Besondere Kategorien personenbezogener Daten', b:'Der Dienst ist nicht auf besonders schützenswerte Daten ausgelegt. Massgeblich sind zwei Kataloge, die sich nicht decken: Art. 9 und Art. 10 DSGVO einerseits, Art. 5 lit. c DSG andererseits. Ohne eine gesonderte schriftliche Vereinbarung über Zusatzgarantien darf der Kunde solche Daten nicht in den Dienst einbringen und weist seine Nutzer entsprechend an. Der Dienst verhindert die Eingabe technisch nicht. Gelangen solche Daten dennoch hinein, gelten dieselben technischen und organisatorischen Massnahmen wie für alle übrigen Inhalte; für die Zulässigkeit der Bearbeitung und für allfällige zusätzliche Schutzvorkehrungen steht der Kunde ein.' },
          { n:'9', t:'Dauer und Nachlaufphase', b:'Dieser Vertrag beginnt mit dem Hauptvertrag und endet mit ihm. Danach schliesst sich eine Nachlaufphase an, in der Rückgabe, Löschung und der Ablauf der Sicherungskopien abgewickelt werden. Während der Nachlaufphase gelten sämtliche Pflichten dieses Vertrags unverändert fort. Die Vertraulichkeitspflichten gelten zeitlich unbefristet weiter.' },
          { n:'10', t:'Weisungen: Form, Adressat und Konfiguration', b:'Der Kunde erteilt Weisungen in Textform an die Anbieterin unter info@herr-informatik.ch. Als dokumentierte Weisung gilt ausdrücklich auch die Konfiguration im Produkt selbst, also die Einstellungen, die der Kunde oder seine Administration im Admin-Panel vornimmt: Aufbewahrungsfristen, Modellauswahl, Anbindungen und Werkzeugrechte, Benutzer- und Gruppenrechte, Aktivierung der Websuche und der Gedächtnisfunktion, Export und Löschung einzelner Personen. Das ist in der Praxis die häufigste Weisungsform. Mündlich erteilte Weisungen bestätigt der Kunde unverzüglich in Textform. Die Anbieterin dokumentiert erhaltene Weisungen und bewahrt sie für die Dauer dieses Vertrags und die Nachlaufphase auf.' },
          { n:'11', t:'Hinweispflicht bei rechtswidriger Weisung', b:'Ist die Anbieterin der Auffassung, dass eine Weisung gegen die DSGVO, das DSG oder andere Datenschutzbestimmungen verstösst, teilt sie dies dem Kunden unverzüglich mit (Art. 28 Abs. 3 UAbs. 2 DSGVO). Sie darf die Ausführung der betroffenen Weisung bis zur Klärung aussetzen, ohne dadurch vertragsbrüchig zu werden. Hält der Kunde an einer offensichtlich rechtswidrigen Weisung fest, kann die Anbieterin die Ausführung verweigern und den davon betroffenen Leistungsteil kündigen.' },
          { n:'12', t:'Pflichten und Rechte des Verantwortlichen', b:'Der Kunde verantwortet die Rechtmässigkeit der Erhebung der Daten und der von ihm erteilten Weisungen, verfügt über eine eigene Rechtsgrundlage für die Bearbeitung und informiert die betroffenen Personen. Er verwaltet Konten, Rollen und Berechtigungen selbst und sperrt ausgeschiedene Nutzer. Er verantwortet die von ihm konfigurierten Anbindungen an eigene und fremde Systeme, die dort hinterlegten Dienstkonten und deren Rechteumfang sowie von ihm selbst eingebundene Modell-Endpunkte. Er legt die Aufbewahrungsfrist fest. Ihm stehen die Auskunfts- und Kontrollrechte nach dem Abschnitt „Nachweis, Auskunft und Überprüfung" zu.' },
          { n:'13', t:'Zusicherungen nach Schweizer Recht', b:'Die Anbieterin bearbeitet die Daten nur so, wie der Kunde selbst sie bearbeiten dürfte (Art. 9 Abs. 1 DSG). Der Kunde sichert zu, dass der Bearbeitung durch die Anbieterin keine gesetzliche oder vertragliche Geheimhaltungspflicht entgegensteht (Art. 9 Abs. 2 DSG). Ergibt sich eine solche Pflicht erst später, teilt der Kunde dies unverzüglich mit, und die Parteien vereinbaren die nötigen Zusatzmassnahmen.' },
          { n:'14', t:'Berufs- und Amtsgeheimnisse', b:'Untersteht der Kunde einem Berufsgeheimnis, etwa nach Art. 321 StGB oder nach Art. 47 des Bankengesetzes, teilt er dies der Anbieterin vor Beginn der Bearbeitung mit. Die Anbieterin und die von ihr eingesetzten Personen handeln in diesem Fall als Hilfspersonen des Kunden und unterstehen derselben Geheimhaltungspflicht im selben Umfang. Die Anbieterin verpflichtet ihre Unterauftragsverarbeiter entsprechend, soweit diese Zugang zu den betroffenen Daten haben können.' },
          { n:'15', t:'Vertraulichkeit der eingesetzten Personen', b:'Die Anbieterin setzt nur Personen ein, die zur Vertraulichkeit verpflichtet sind oder einer angemessenen gesetzlichen Verschwiegenheitspflicht unterliegen (Art. 28 Abs. 3 lit. b DSGVO). Die Verpflichtung erfolgt vor Aufnahme der Tätigkeit, in Textform, und gilt nach Beendigung des Arbeits- oder Auftragsverhältnisses zeitlich unbegrenzt fort. Die Anbieterin weist die Verpflichtung auf Verlangen des Kunden nach. Die eingesetzten Personen werden über die Anforderungen dieses Vertrags und über den Datenschutz geschult.' },
          { n:'16', t:'Zugriff des Anbieterpersonals auf Kundendaten', b:'Zugriff auf die Systeme des Kunden erhalten nur namentlich bestimmte Personen der Anbieterin und nur, soweit dies für Betrieb, Wartung, Störungsbehebung oder Support erforderlich ist. Jeder administrative Zugriff wird protokolliert. Ein Zugriff auf Inhalte der Nutzer erfolgt nur auf Anforderung des Kunden oder zur Behebung einer konkreten Störung, und in diesem Fall nach dem Vier-Augen-Prinzip. Der Kunde kann die Protokolle über administrative Zugriffe einsehen und als CSV exportieren. Auf Verlangen benennt die Anbieterin den Kreis der zugriffsberechtigten Personen.' },
          { n:'17', t:'Technische und organisatorische Massnahmen', b:'Die Anbieterin trifft die nach Art. 32 Abs. 1 DSGVO und Art. 8 DSG erforderlichen Massnahmen, um ein dem Risiko angemessenes Schutzniveau zu gewährleisten. Dazu gehören die Pseudonymisierung, soweit sie mit dem Zweck vereinbar ist, die Verschlüsselung, die Sicherstellung von Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme, die Fähigkeit zur raschen Wiederherstellung nach einem Zwischenfall sowie ein Verfahren zur regelmässigen Überprüfung und Bewertung der Wirksamkeit dieser Massnahmen. Die Einzelheiten stehen in der Anlage „Technische und organisatorische Massnahmen", die in ihrer datierten Fassung Bestandteil dieses Vertrags ist. Die Anbieterin darf die Massnahmen an den Stand der Technik anpassen, sofern das vereinbarte Schutzniveau dabei nicht unterschritten wird; wesentliche Änderungen teilt sie dem Kunden mit.' },
          { n:'18', t:'Zugesicherter Umfang von Verschlüsselung, Trennung und Protokollierung', b:'Übertragungen sind verschlüsselt. Im Ruhezustand ist die Verschlüsselung der Datenträger im betreuten Betrieb Teil der Serverbereitstellung; eine darüber hinausgehende Verschlüsselung einzelner Datensätze auf Anwendungsebene wird nicht zugesichert. Zur Trennung der Kunden erhält jeder Kunde einen eigenen Stack mit eigener Datenbank, eigenem Suchindex, eigener Dateiablage, eigener Konfiguration, eigenem Netz und eigenem Inferenz-Schlüssel. Die Trennlinie ist dieser Stack und nicht die physische Maschine: bis etwa 15 Nutzern können sich mehrere Kunden eine Maschine teilen, wobei die Container-Images und ein vorgelagerter Reverse-Proxy gemeinsam genutzt werden. Das Protokoll über Administratorhandlungen ist verkettet, jeder Eintrag trägt eine Prüfsumme über den vorhergehenden, und eine eingebaute Prüfung meldet eine unterbrochene Kette. Nachträgliche Eingriffe fallen damit auf; eine technische Unveränderbarkeit wird nicht zugesichert. Wird die Identität der Person bis in ein angebundenes Zielsystem durchgereicht, endet die Protokollierung der Anbieterin an der Systemgrenze, und es gilt die Protokollierung des Zielsystems.' },
          { n:'19', t:'Zertifizierungen und geplante Massnahmen', b:'Der betreute Betrieb erfolgt in den nach ISO 27001 zertifizierten Rechenzentren von Green in Lupfig, Kanton Aargau. Diese Zertifizierung liegt bei Green als Rechenzentrumsbetreiber, nicht bei der Anbieterin, und ist keine eigene technische Massnahme der Anbieterin. Die Anbieterin verfügt heute über keine eigene Zertifizierung; eine eigene ISO-27001-Zertifizierung ist in Arbeit, ein SOC-2-Bericht liegt nicht vor. Als geplant und nicht als zugesichert gelten ferner: ein Egress-Proxy mit Freigabeliste für die Netzzugriffe aus der Code-Sandbox (in Arbeit); die stärkste Isolationsstufe der Code-Sandbox, die Virtualisierungsunterstützung auf dem Server voraussetzt und deshalb nicht überall die Voreinstellung ist; das automatische Bereitstellen und Sperren von Konten über SCIM (geplant, heute erfolgt die Sperrung über den Verzeichnisdienst).' },
          { n:'20', t:'Unterauftragsverarbeiter: Genehmigung und Wechsel', b:'Die Anbieterin zieht Unterauftragsverarbeiter nur mit vorgängiger Genehmigung des Kunden bei; das verlangt Art. 9 Abs. 3 DSG und ist nach Art. 61 lit. b DSG strafbewehrt, eine blosse Information genügt nicht. Für die in der Liste der Unterauftragsverarbeiter namentlich aufgeführten Stellen erteilt der Kunde die Genehmigung mit Abschluss dieses Vertrags. Für neue oder ersetzte Stellen gilt: Die Anbieterin kündigt den Wechsel 30 Tage [Vorschlag] im Voraus in Textform an, unter Angabe von Name, Rechtsperson, Sitz, Zweck und Übermittlungsgrundlage. Der Kunde kann innert 14 Tagen [Vorschlag] ab Zugang der Ankündigung aus einem datenschutzrechtlichen Grund widersprechen. Bei berechtigtem Widerspruch setzt die Anbieterin den Wechsel aus; ist die Leistung ohne den neuen Unterauftragsverarbeiter nicht zu erbringen, kann der Kunde den betroffenen Leistungsteil auf den Zeitpunkt des Wechsels kündigen und erhält im Voraus bezahlte Entgelte anteilig zurück.' },
          { n:'21', t:'Die tatsächliche Kette', b:'Zur Kette gehören der Rechenzentrumsbetreiber Green in Lupfig und das Inferenz-Gateway EuRouter. EuRouter erbringt die Inferenz nicht selbst, sondern reicht die Anfragen an Modellanbieter weiter; diese Anbieter sind Teil der Kette. Bei der Websuche gehören ebenfalls dazu: der Abruf der gefundenen Webseiten und die angefragten externen Suchmaschinen. Die Anbieterin weist diese Ebene in der Liste der Unterauftragsverarbeiter aus und macht sie dem Kunden auf Verlangen mit Rechtsperson, Sitz und Übermittlungsgrundlage einsehbar. Bestandteile, welche die Anbieterin auf eigener Infrastruktur betreibt, sind keine Unterauftragsverarbeiter; das gilt für den selbst gehosteten Suchdienst.' },
          { n:'22', t:'Weitergabe der Pflichten und Haftung für Unterauftragsverarbeiter', b:'Die Anbieterin verpflichtet jeden Unterauftragsverarbeiter schriftlich auf im Wesentlichen dieselben Pflichten, wie sie dieser Vertrag ihr auferlegt, einschliesslich der Nachweis- und Kontrollrechte des Kunden, und stellt sicher, dass diese Rechte auch gegenüber dem Unterauftragsverarbeiter durchsetzbar sind (Art. 28 Abs. 4 DSGVO). Kommt ein Unterauftragsverarbeiter seinen Datenschutzpflichten nicht nach, haftet die Anbieterin dem Kunden gegenüber für dessen Verhalten wie für eigenes. Der Kunde hat damit in jedem Fall einen Anspruchsgegner in der Schweiz.' },
          { n:'23', t:'Ort der Bearbeitung und benannte Ausnahmen', b:'Speicherung und Betrieb erfolgen in der Schweiz bei Green in Lupfig. Die Modell-Inferenz erfolgt über EuRouter in der EU. Zwei Ausnahmen sind ausdrücklich benannt. Erstens die Websuche: Suchanfragen werden ohne Nutzeridentität an externe Suchmaschinen weitergeleitet und können dabei den EU-, EWR- und Schweizer Raum verlassen. Die Aussage, dass alles in Europa bleibt, gilt für Speicherung und Inferenz, nicht für die Suchanfrage selbst. Zweitens ein zusätzlicher Modellanbieter ausserhalb Europas: Ein solcher lässt sich einbinden. Ist das in der Instanz des Kunden der Fall, gilt die EU-Zusicherung für diesen Anbieter nicht, und die Übermittlungsgrundlage liegt beim Kunden als Verantwortlichem.' },
          { n:'24', t:'Drittlandübermittlung: die drei Rechtsgrundlagen', b:'Erstens, vom Kunden in der EU oder im EWR zur Anbieterin in der Schweiz: Dafür sind keine Standardvertragsklauseln erforderlich. Für die Schweiz besteht ein Angemessenheitsbeschluss der Europäischen Kommission; die Übermittlung ist damit einer innereuropäischen gleichgestellt. Zweitens, von der Anbieterin in der Schweiz zur Inferenz in der EU: Diese Übermittlung stützt sich auf Art. 16 Abs. 1 DSG in Verbindung mit Anhang 1 der Datenschutzverordnung, welcher die Staaten des EWR mit angemessenem Schutz aufführt. Drittens, die Ebene unterhalb von EuRouter: Für jeden Modellanbieter benennt die Anbieterin auf Verlangen Rechtsperson, Sitz und Übermittlungsmechanismus. Liegt der Sitz ausserhalb der EU, des EWR und der Schweiz, stützt sich die Übermittlung auf die Standardvertragsklauseln der Europäischen Kommission samt einer Prüfung der Rechtslage im Zielstaat, und daneben auf eine eigenständige Schweizer Grundlage nach Art. 16 Abs. 2 DSG, weil die europäischen und die schweizerischen Anerkennungen getrennte Rechtsakte sind und eine EU-Grundlage die schweizerische nicht ersetzt.' },
          { n:'25', t:'Behördliche Herausgabeverlangen', b:'Die Weisungsbindung nach Art. 28 Abs. 3 lit. a DSGVO gilt auch für Übermittlungen in Drittländer. Ohne Weisung des Kunden übermittelt die Anbieterin nur, wenn sie nach anwendbarem Recht dazu verpflichtet ist; in diesem Fall informiert sie den Kunden vor der Übermittlung, soweit das Recht diese Information nicht verbietet. Erhält die Anbieterin eine behördliche oder gerichtliche Anordnung auf Herausgabe von Kundendaten, prüft sie deren Rechtmässigkeit, gibt ohne rechtliche Verpflichtung nichts heraus, ficht offensichtlich unzulässige Anordnungen an oder schöpft die zumutbaren Rechtsmittel aus, beschränkt eine Herausgabe auf das rechtlich Gebotene und benachrichtigt den Kunden so früh, wie es zulässig ist. Ist die Benachrichtigung dauerhaft untersagt, dokumentiert die Anbieterin den Vorgang und weist ihn in ihrer periodischen Berichterstattung in aggregierter Form aus.' },
          { n:'26', t:'Kein Training mit Kundendaten', b:'Die Anbieterin verwendet Kundendaten nicht für das Training oder die Verbesserung von Modellen und gibt sie zu diesem Zweck nicht weiter. Für die Inferenz über EuRouter gilt: Dort werden die Inhalte der Anfragen standardmässig nicht aufbewahrt und nicht für Training verwendet. Das ist eine Voreinstellung des Gateways. Die Anbieterin hält diese Voreinstellung für die von ihr betriebenen Zugänge gesetzt, prüft das periodisch und meldet dem Kunden, wenn sich daran etwas ändert. Nutzungs-Metadaten wie Zeitstempel und Token-Zahlen bewahrt EuRouter bis zu zwölf Monate auf. Bindet der Kunde einen eigenen Modell-Endpunkt ein, gelten dessen Bedingungen; die Zusage der Anbieterin erstreckt sich nicht auf diesen Endpunkt.' },
          { n:'27', t:'Unterstützung bei Betroffenenrechten', b:'Die Anbieterin unterstützt den Kunden mit geeigneten technischen und organisatorischen Massnahmen dabei, Anträgen betroffener Personen nachzukommen (Art. 28 Abs. 3 lit. e DSGVO). Der Dienst stellt dafür im Admin-Panel den Datenexport und die Löschung pro Person bereit, einschliesslich der Volllöschung; der Kunde führt diese Vorgänge selbst aus. Wendet sich eine betroffene Person direkt an die Anbieterin, beantwortet diese die Anfrage nicht selbst, sondern leitet sie unverzüglich an den Kunden weiter und informiert die Person darüber. Reichen die Funktionen des Dienstes im Einzelfall nicht aus, unterstützt die Anbieterin ergänzend.' },
          { n:'28', t:'Meldung von Verletzungen des Datenschutzes', b:'Die Anbieterin meldet dem Kunden jede Verletzung des Schutzes personenbezogener Daten unverzüglich, spätestens innert 48 Stunden [Vorschlag] ab Kenntnis, in Textform an die vom Kunden benannte Stelle. Die Frist ist so bemessen, dass der Kunde seine eigene Frist von 72 Stunden nach Art. 33 Abs. 1 DSGVO und seine Meldepflicht nach Art. 24 DSG einhalten kann. Die Meldung beschreibt die Art des Vorfalls, die betroffenen Datenarten und Kategorien betroffener Personen, die wahrscheinlichen Folgen, die ergriffenen und die vorgeschlagenen Massnahmen sowie eine Kontaktstelle. Sind noch nicht alle Angaben verfügbar, meldet die Anbieterin zuerst und ergänzt fortlaufend. Die Meldung an die Aufsichtsbehörde und die Benachrichtigung der betroffenen Personen bleiben Sache des Kunden; die Anbieterin unterstützt ihn dabei.' },
          { n:'29', t:'Unterstützung bei Folgenabschätzung und Vorabkonsultation', b:'Die Anbieterin unterstützt den Kunden bei der Datenschutz-Folgenabschätzung nach Art. 35 DSGVO und Art. 22 DSG sowie bei einer allfälligen Vorabkonsultation der Aufsichtsbehörde nach Art. 36 DSGVO und Art. 23 DSG. Bei einem KI-Assistenten mit Anbindung an betriebliche Systeme ist eine Folgenabschätzung der Regelfall und nicht die Ausnahme. Die Anbieterin stellt die dafür nötigen Angaben bereit: Bearbeitungsvorgänge und Datenflüsse, eingesetzte Unterauftragsverarbeiter und Drittlandbezüge, technische und organisatorische Massnahmen, Aufbewahrung und Löschung, bekannte Risiken der eingesetzten Komponenten.' },
          { n:'30', t:'Nachweis, Auskunft und Überprüfung', b:'Die Anbieterin stellt dem Kunden alle Informationen zur Verfügung, die zum Nachweis der Einhaltung der Pflichten aus Art. 28 DSGVO erforderlich sind, und ermöglicht Überprüfungen (Art. 28 Abs. 3 lit. h DSGVO). Auskünfte erteilt sie in Textform innert 30 Tagen [Vorschlag] ab Anfrage. Darüber hinaus kann der Kunde ein Audit pro Kalenderjahr [Vorschlag] durchführen oder durch einen Prüfer durchführen lassen, mit einer Vorankündigung von 30 Tagen [Vorschlag] und während der ordentlichen Geschäftszeiten. Nach einem meldepflichtigen Vorfall oder auf Anordnung einer Aufsichtsbehörde ist ein ausserplanmässiges Audit ohne Anrechnung auf dieses Kontingent zulässig. Der Prüfer ist zur Verschwiegenheit verpflichtet und darf kein Wettbewerber der Anbieterin sein. Zertifikate, Prüfberichte und Testate ersetzen eine Prüfung vor Ort, soweit sie den Prüfzweck abdecken; sie schliessen eine Inspektion nicht aus, wenn offene Punkte bleiben. Die Rechte dieses Abschnitts gelten auch gegenüber den Unterauftragsverarbeitern: Die Anbieterin verschafft sie dem Kunden durch entsprechende Vereinbarung oder führt die Prüfung auf Verlangen stellvertretend durch und übergibt das Ergebnis. Jede Partei trägt ihre eigenen Kosten; das jährliche Audit und Auskünfte im üblichen Umfang sind für den Kunden unentgeltlich, Aufwand für weitere Prüfungen ohne Anlass in der Sphäre der Anbieterin wird nach Aufwand verrechnet.' },
          { n:'31', t:'Aufsichtsbehörden, Ansprechstelle und Verzeichnis', b:'Die Anbieterin arbeitet auf Anfrage mit dem Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten und mit der für den Kunden zuständigen Aufsichtsbehörde in der EU zusammen und informiert den Kunden über an sie gerichtete Anfragen, die dessen Daten betreffen. Ansprechstelle für Datenschutzfragen ist die Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. Die Anbieterin führt ein Verzeichnis aller Kategorien von Bearbeitungstätigkeiten, die sie im Auftrag ausführt (Art. 30 Abs. 2 DSGVO, Art. 12 DSG), und stellt es dem Kunden auf Verlangen zur Verfügung. Soweit die Anbieterin der Pflicht nach Art. 27 DSGVO unterliegt, benennt sie einen Vertreter in der Union und weist ihn im Impressum aus; ein solcher Vertreter ist heute nicht benannt.' },
          { n:'32', t:'Aufbewahrung im laufenden Betrieb', b:'Der Kunde legt die Aufbewahrungsfrist im Admin-Panel fest; das Setzen und Ändern dieser Frist gilt als Weisung. Ab Werk ist keine Frist gesetzt: Ohne gesetzte Frist bleiben Konversationen gespeichert, bis Nutzer oder Administration sie löschen. Ist eine Frist gesetzt, werden abgelaufene Konversationen samt Nachrichten, geteilten Links und Suchindex-Einträgen endgültig entfernt; massgeblich ist die letzte Änderung, nicht das Anlagedatum. Abrechnungsdaten sind von der Frist nicht erfasst und bleiben erhalten, damit der Verbrauch vergangener Perioden nachvollziehbar bleibt; sie werden erst bei einer Volllöschung entfernt, vorbehalten bleiben handels- und steuerrechtliche Aufbewahrungspflichten. Beim Inferenz-Anbieter fallen Nutzungs-Metadaten an, die dort bis zu zwölf Monate aufbewahrt werden.' },
          { n:'33', t:'Rückgabe und Löschung nach Vertragsende', b:'Der Kunde wählt, ob die Daten zurückgegeben oder gelöscht werden (Art. 28 Abs. 3 lit. g DSGVO), und teilt seine Wahl bis zum Ende der Laufzeit mit. Ohne Mitteilung gilt als Standardfall die Rückgabe mit anschliessender Löschung. Die Rückgabe erfolgt innert 30 Tagen [Vorschlag] ab Vertragsende in einem strukturierten, gängigen und maschinenlesbaren Format: Datenbankexport der Konversationen und Konten, Dateien im Original, Protokolle als CSV. Anschliessend löscht die Anbieterin die produktiven Daten. Die vollständige Löschung einschliesslich sämtlicher Sicherungskopien ist innert 90 Tagen [Vorschlag] ab Vertragsende abgeschlossen; die Frist entspricht dem Rotationszyklus der Sicherungen. Bis zum Ablauf einer Sicherung bleiben die darin enthaltenen Daten gesperrt und werden zu keinem anderen Zweck als der Wiederherstellung im Notfall bearbeitet. Audit- und Zugriffsprotokolle teilen das Schicksal der Inhalte. Auf Verlangen bestätigt die Anbieterin die Löschung in Textform. Ausgenommen bleiben Abrechnungsdaten und Daten, für die eine gesetzliche Aufbewahrungspflicht besteht; diese werden gesperrt und nach Ablauf der Pflicht gelöscht.' },
          { n:'34', t:'Kosten der Unterstützungsleistungen', b:'Die Unterstützung bei Betroffenenrechten, bei Meldungen und bei der Folgenabschätzung ist im üblichen Umfang mit dem Entgelt des Hauptvertrags abgegolten. Übersteigt der Aufwand das übliche Mass deutlich, insbesondere bei einer hohen Zahl gleichartiger Anfragen oder bei Anfragen, die auf eine Konfiguration des Kunden zurückgehen, verrechnet die Anbieterin ihn nach Aufwand zu den vereinbarten Sätzen, nachdem sie den Kunden vorgängig darauf hingewiesen und dessen Zustimmung eingeholt hat. Rückgabe und Löschung nach Vertragsende sind im Standardformat unentgeltlich; darüber hinausgehende Aufbereitungen werden nach Aufwand verrechnet.' },
          { n:'35', t:'Haftung', b:'Für Schäden aus der Bearbeitung personenbezogener Daten gehen die zwingenden gesetzlichen Bestimmungen vor, namentlich Art. 82 DSGVO. Der Haftungsausschluss für Datenverlust in Ziff. 10 der AGB gilt nicht, soweit der Verlust auf einer Verletzung der Pflichten aus diesem Vertrag beruht, insbesondere der Massnahmen nach dem Abschnitt „Technische und organisatorische Massnahmen". Haften mehrere Beteiligte gegenüber einer betroffenen Person, richtet sich der Ausgleich im Innenverhältnis nach dem jeweiligen Verantwortungsanteil (Art. 82 Abs. 5 DSGVO). Für ihre Unterauftragsverarbeiter haftet die Anbieterin wie für eigenes Verhalten.' },
          { n:'36', t:'Anwendbares Recht, Gerichtsstand und Sprachfassungen', b:'Es gilt schweizerisches Recht unter Ausschluss des Kollisionsrechts. Ausschliesslicher Gerichtsstand ist Windisch, Kanton Aargau, soweit gesetzlich zulässig. Zwingende Gerichtsstände betroffener Personen und die Zuständigkeit der Aufsichtsbehörden bleiben vorbehalten, ebenso die unmittelbare Anwendbarkeit der DSGVO, soweit sie für die Bearbeitung gilt. Dieser Vertrag liegt in fünf Sprachen vor. Massgeblich ist die deutsche Fassung; die übrigen Fassungen dienen der Information.' },
          { n:'37', t:'Stand, Version und Änderungen', b:'Stand: August 2026, Version 1.0. Änderungen und Ergänzungen bedürfen der Textform und der Zustimmung beider Parteien. Davon ausgenommen sind die Aktualisierung der Liste der Unterauftragsverarbeiter nach dem dafür vereinbarten Verfahren und die Fortentwicklung der technischen und organisatorischen Massnahmen im Rahmen des Verschlechterungsverbots. Mit [Vorschlag] gekennzeichnete Fristen und Mengen sind Vorschläge der Anbieterin und bis zum Vertragsschluss verhandelbar.' }
        ],
        disclaimer:'Hinweis: Dieser Text stellt keine Rechtsberatung dar. Er wird erst mit der Unterzeichnung durch beide Parteien oder mit der Annahme im Rahmen des Hauptvertrags verbindlich. Mit [Vorschlag] gekennzeichnete Werte sind Vorschläge der Anbieterin.'
      },
      en: {
        back:'Back to Trust Center', status:'As of: August 2026',
        h1:'Data Processing Agreement (DPA)',
        intro:'This agreement governs how Herr Informatik GmbH processes personal data on behalf of the Customer when it operates the EU Cowork AI service as a managed service. It follows Art. 28 GDPR and Art. 9 of the revised Swiss Federal Act on Data Protection (revised FADP, German abbreviation DSG). Periods and quantities that have not yet been negotiated with the Customer carry the marker [proposed] and state the customary market value that the Provider proposes.',
        sections:[
          { n:'1', t:'Parties and subject matter', b:'The parties to this agreement are Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Switzerland, company identification number CHE-112.168.836 (hereinafter “the Provider”), and the Customer. “EU Cowork AI” is the name of the service and not a party to the agreement. The subject matter is the processing of personal data that the Provider carries out on behalf of the Customer when providing the managed service.' },
          { n:'2', t:'Roles of the parties', b:'The Customer is the controller within the meaning of Art. 4(7) GDPR and Art. 5(j) of the revised FADP, and the Provider is the processor (Auftragsbearbeiter under Art. 9 revised FADP). The Customer decides on the purposes and means of the processing. The Provider is a controller in its own right solely for its billing data, for the security and operating logs of its own infrastructure, for the contact details of the contractual contact persons and for statutory record-keeping duties; for those its privacy policy applies and not this agreement. Outside that list the Provider determines neither purpose nor means; otherwise it would be deemed a controller under Art. 28(10) GDPR.' },
          { n:'3', t:'Scope and state of the service', b:'This agreement applies to managed operation, in which the Provider makes the service available on its own infrastructure. Where the Customer self-hosts the open-source software on its own infrastructure, no data flows to the Provider; no processing on behalf of a controller arises, and this agreement remains without object for as long as no operating or support services involving access to data are agreed separately. The managed service is under construction. Measures that are not yet implemented today are expressly marked as planned in the section “Certifications and planned measures” and are not warranted.' },
          { n:'4', t:'Order of precedence and constituent parts', b:'In all questions concerning the processing of personal data, this agreement takes precedence over the General Terms and Conditions. The deemed-approval provision for amendments to the GTC (clause 12 GTC) does not apply to this agreement: amendments require the consent of the Customer in text form. Excepted are the updating of the list of subprocessors under the procedure provided for that purpose and the further development of the technical and organisational measures within the limits of the prohibition on lowering the level of protection. The annex “Technical and organisational measures” in its respective dated version and the list of subprocessors form part of this agreement.' },
          { n:'5', t:'Purpose, nature and operations of the processing', b:'Processing is carried out for the following purposes: operation of the chat and assistant function; forwarding of inputs to the inference provider in order to generate answers; web search with source references; calls to connected systems via the MCP gateway and via direct connections; generation of files; searchability through a search index; automated storage of memory entries; logging of use and administration; backup and restoration; fault clearance and support; billing of use. The processing operations are collection, recording, organisation, storage, adaptation, retrieval, consultation, use, disclosure by transmission to subprocessors, alignment, restriction, erasure and destruction. The Provider takes no automated individual decisions concerning data subjects; whether outputs of the service are used for such decisions is determined by the Customer alone.' },
          { n:'6', t:'Types of data', b:'The following are processed: content that users enter, together with attachments and the answers generated; account and profile data as well as usage metadata (timestamps, model choice, token counts); billing data; audit and access logs including the logs of administrator actions; content read from connected systems at the request of users (for example ERP, SharePoint, file stores); search queries of the web search; memory entries that the service derives from conversations and stores without any separate action by the users. The Provider lists the memory entries in its record as a processing activity of its own, because they arise without any active input by the data subject.' },
          { n:'7', t:'Categories of data subjects', b:'Data subjects are employees of the Customer and its auxiliary persons, business contacts, customers of the Customer, suppliers and their employees, job applicants and all other persons mentioned in entered texts, in attachments or in the content of connected systems.' },
          { n:'8', t:'Special categories of personal data', b:'The service is not designed for particularly sensitive personal data. Two catalogues are relevant and they do not coincide: Art. 9 and Art. 10 GDPR on the one hand, Art. 5(c) revised FADP on the other. Without a separate written agreement on additional safeguards, the Customer may not introduce such data into the service and instructs its users accordingly. The service does not technically prevent such input. If such data nevertheless enters the service, the same technical and organisational measures apply as for all other content; the Customer is answerable for the lawfulness of the processing and for any additional protective arrangements.' },
          { n:'9', t:'Duration and wind-down phase', b:'This agreement begins with the main contract and ends with it. A wind-down phase then follows, in which return, erasure and the expiry of the backup copies are completed. During the wind-down phase all obligations under this agreement continue to apply unchanged. The confidentiality obligations continue to apply without any time limit.' },
          { n:'10', t:'Instructions: form, addressee and configuration', b:'The Customer issues instructions in text form to the Provider at info@herr-informatik.ch. The configuration in the product itself expressly also counts as a documented instruction, that is, the settings that the Customer or its administrators make in the admin panel: retention periods, model selection, connections and tool permissions, user and group permissions, activation of the web search and of the memory function, export and erasure of individual persons. In practice this is the most frequent form of instruction. The Customer confirms instructions given orally in text form without delay. The Provider documents the instructions it receives and retains them for the term of this agreement and the wind-down phase.' },
          { n:'11', t:'Duty to give notice of an unlawful instruction', b:'If the Provider is of the opinion that an instruction infringes the GDPR, the revised FADP or other data protection provisions, it informs the Customer without delay (Art. 28(3), second subparagraph, GDPR). It may suspend execution of the instruction concerned until the matter is clarified, without thereby being in breach of contract. If the Customer insists on a manifestly unlawful instruction, the Provider may refuse execution and terminate the part of the service affected.' },
          { n:'12', t:'Obligations and rights of the controller', b:'The Customer is responsible for the lawfulness of the collection of the data and of the instructions it issues, has its own legal basis for the processing and informs the data subjects. It manages accounts, roles and permissions itself and blocks users who have left. It is responsible for the connections it configures to its own and to third-party systems, for the service accounts stored there and the scope of their permissions, and for model endpoints it integrates itself. It sets the retention period. It has the rights to information and to review under the section “Evidence, information and review”.' },
          { n:'13', t:'Warranties under Swiss law', b:'The Provider processes the data only in the way in which the Customer would itself be permitted to process it (Art. 9(1) revised FADP). The Customer warrants that no statutory or contractual duty of confidentiality precludes the processing by the Provider (Art. 9(2) revised FADP). If such a duty arises only later, the Customer gives notice of this without delay and the parties agree the additional measures required.' },
          { n:'14', t:'Professional and official secrecy', b:'If the Customer is subject to professional secrecy, for example under Art. 321 of the Swiss Criminal Code (StGB) or under Art. 47 of the Banking Act, it notifies the Provider of this before the processing begins. In that case the Provider and the persons it deploys act as auxiliary persons of the Customer and are subject to the same duty of secrecy to the same extent. The Provider binds its subprocessors accordingly, in so far as they may have access to the data concerned.' },
          { n:'15', t:'Confidentiality of the persons deployed', b:'The Provider deploys only persons who are bound to confidentiality or who are subject to an appropriate statutory duty of secrecy (Art. 28(3)(b) GDPR). The undertaking is given before work begins, in text form, and continues to apply without any time limit after the employment or contractual relationship ends. The Provider evidences the undertaking at the request of the Customer. The persons deployed are trained on the requirements of this agreement and on data protection.' },
          { n:'16', t:'Access by Provider personnel to Customer data', b:'Access to the systems of the Customer is granted only to individually named persons of the Provider and only in so far as this is necessary for operation, maintenance, fault clearance or support. Every administrative access is logged. Access to user content takes place only at the request of the Customer or in order to remedy a specific fault, and in that case under the four-eyes principle. The Customer can view the logs of administrative access and export them as CSV. On request the Provider names the group of persons authorised to access.' },
          { n:'17', t:'Technical and organisational measures', b:'The Provider takes the measures required under Art. 32(1) GDPR and Art. 8 revised FADP in order to ensure a level of protection appropriate to the risk. These include pseudonymisation, in so far as it is compatible with the purpose, encryption, ensuring the confidentiality, integrity, availability and resilience of the systems, the ability to restore quickly after an incident, and a procedure for regularly reviewing and evaluating the effectiveness of these measures. The details are set out in the annex “Technical and organisational measures”, which in its dated version forms part of this agreement. The Provider may adapt the measures to the state of the art, provided that the agreed level of protection is not thereby fallen below; it notifies the Customer of material changes.' },
          { n:'18', t:'Warranted scope of encryption, separation and logging', b:'Transmissions are encrypted. At rest, encryption of the storage media in managed operation is part of the server provisioning; encryption of individual records at application level going beyond that is not warranted. To separate customers, each customer receives its own stack with its own database, its own search index, its own file store, its own configuration, its own network and its own inference key. The dividing line is this stack and not the physical machine: up to about 15 users, several customers may share one machine, with the container images and an upstream reverse proxy being used jointly. The log of administrator actions is chained, each entry carries a checksum over the preceding one, and a built-in check reports a broken chain. Subsequent interference is therefore noticeable; technical immutability is not warranted. Where the identity of the person is passed through into a connected target system, the logging by the Provider ends at the system boundary, and the logging of the target system applies.' },
          { n:'19', t:'Certifications and planned measures', b:'The managed operation takes place in the ISO 27001-certified data centres of Green in Lupfig, canton of Aargau. This certification is held by Green as the data centre operator, not by the Provider, and is not a technical measure of the Provider itself. The Provider holds no certification of its own today; its own ISO 27001 certification is in progress, and no SOC 2 report is available. The following likewise count as planned and not as warranted: an egress proxy with an allow list for network access from the code sandbox (in progress); the strongest isolation level of the code sandbox, which presupposes virtualisation support on the server and for that reason is not the default setting everywhere; the automatic provisioning and blocking of accounts via SCIM (planned; today blocking takes place through the directory service).' },
          { n:'20', t:'Subprocessors: authorisation and changes', b:'The Provider engages subprocessors only with the prior authorisation of the Customer; Art. 9(3) revised FADP requires this and Art. 61(b) revised FADP makes a breach a criminal offence, so mere information is not sufficient. For the bodies named in the list of subprocessors, the Customer grants the authorisation upon conclusion of this agreement. For new or replaced bodies the following applies: the Provider announces the change 30 days [proposed] in advance in text form, stating the name, legal entity, registered office, purpose and basis for the transfer. The Customer may object within 14 days [proposed] of receipt of the announcement on a data protection ground. In the case of a justified objection the Provider suspends the change; if the service cannot be provided without the new subprocessor, the Customer may terminate the part of the service affected as at the date of the change and receives a pro rata refund of fees paid in advance.' },
          { n:'21', t:'The actual chain', b:'The chain comprises the data centre operator Green in Lupfig and the inference gateway EuRouter. EuRouter does not perform the inference itself but passes the requests on to model providers; those providers are part of the chain. In the case of the web search, the following also belong to it: the retrieval of the web pages found and the external search engines queried. The Provider sets out this level in the list of subprocessors and, on request, makes it available to the Customer for inspection with legal entity, registered office and basis for the transfer. Components that the Provider operates on its own infrastructure are not subprocessors; this applies to the self-hosted search service.' },
          { n:'22', t:'Passing on the obligations and liability for subprocessors', b:'The Provider binds every subprocessor in writing to substantially the same obligations as this agreement imposes on it, including the rights of the Customer to evidence and review, and ensures that these rights are also enforceable against the subprocessor (Art. 28(4) GDPR). Where a subprocessor fails to fulfil its data protection obligations, the Provider remains liable to the Customer for that subprocessor’s conduct as for its own. The Customer thus has, in every case, a party against which to bring claims in Switzerland.' },
          { n:'23', t:'Place of processing and the exceptions named', b:'Storage and operation take place in Switzerland at Green in Lupfig. The model inference takes place via EuRouter in the EU. Two exceptions are expressly named. First, the web search: search queries are forwarded to external search engines without user identity and may in the process leave the EU, EEA and Swiss area. The statement that everything stays in Europe applies to storage and inference, not to the search query itself. Second, an additional model provider outside Europe: such a provider can be integrated. Where that is the case in the instance of the Customer, the EU assurance does not apply to that provider, and the basis for the transfer lies with the Customer as controller.' },
          { n:'24', t:'Third-country transfers: the three legal bases', b:'First, from the Customer in the EU or the EEA to the Provider in Switzerland: no standard contractual clauses are required for this. An adequacy decision of the European Commission exists for Switzerland; the transfer is thereby placed on the same footing as one within Europe. Second, from the Provider in Switzerland to the inference in the EU: this transfer is based on Art. 16(1) revised FADP in conjunction with Annex 1 of the Data Protection Ordinance, which lists the EEA states as providing adequate protection. Third, the level below EuRouter: for each model provider the Provider names, on request, the legal entity, registered office and transfer mechanism. Where the registered office lies outside the EU, the EEA and Switzerland, the transfer is based on the standard contractual clauses of the European Commission together with an assessment of the legal situation in the destination country, and alongside that on a separate Swiss basis under Art. 16(2) revised FADP, because the European and the Swiss recognitions are separate legal acts and an EU basis does not replace the Swiss one.' },
          { n:'25', t:'Government requests for disclosure', b:'The binding effect of instructions under Art. 28(3)(a) GDPR also applies to transfers to third countries. Without an instruction from the Customer, the Provider transfers data only where it is obliged to do so under applicable law; in that case it informs the Customer before the transfer, unless the law prohibits that information. If the Provider receives an administrative or judicial order to hand over Customer data, it examines the lawfulness of that order, hands over nothing in the absence of a legal obligation, challenges manifestly inadmissible orders or exhausts the legal remedies that can reasonably be expected of it, limits any disclosure to what is legally required and notifies the Customer as early as is permissible. Where notification is permanently prohibited, the Provider documents the matter and reports it in aggregated form in its periodic reporting.' },
          { n:'26', t:'No training on Customer data', b:'The Provider does not use Customer data for the training or improvement of models and does not pass it on for that purpose. For the inference via EuRouter the following applies: there, the content of the requests is by default not retained and not used for training. This is a default setting of the gateway. The Provider keeps this default setting in place for the access paths it operates, checks this periodically and notifies the Customer if anything changes in that respect. EuRouter retains usage metadata such as timestamps and token counts for up to twelve months. If the Customer integrates a model endpoint of its own, the terms of that endpoint apply; the undertaking of the Provider does not extend to that endpoint.' },
