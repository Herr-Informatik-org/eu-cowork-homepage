          { n:'10', t:'Instrucciones: forma, destinatario y configuración', b:'El Cliente imparte sus instrucciones en forma textual al Proveedor en la dirección info@herr-informatik.ch. Vale expresamente también como instrucción documentada la configuración en el propio producto, esto es, los ajustes que el Cliente o su administración realiza en el panel de administración: plazos de conservación, elección de modelos, conexiones y derechos sobre las herramientas, derechos de usuarios y de grupos, activación de la búsqueda web y de la función de memoria, exportación y supresión de personas concretas. En la práctica esta es la forma de instrucción más frecuente. El Cliente confirma sin demora en forma textual las instrucciones impartidas verbalmente. El Proveedor documenta las instrucciones recibidas y las conserva durante la vigencia del presente contrato y durante la fase poscontractual.' },
          { n:'11', t:'Deber de advertencia en caso de instrucción ilícita', b:'Si el Proveedor considera que una instrucción infringe el RGPD, la nLPD u otras disposiciones sobre protección de datos, lo comunica al Cliente sin demora (art. 28, apdo. 3, párrafo segundo, del RGPD). Puede suspender la ejecución de la instrucción de que se trate hasta su aclaración, sin incurrir por ello en incumplimiento del contrato. Si el Cliente mantiene una instrucción manifiestamente ilícita, el Proveedor puede negarse a ejecutarla y resolver la parte de la prestación afectada.' },
          { n:'12', t:'Obligaciones y derechos del responsable del tratamiento', b:'El Cliente responde de la licitud de la recogida de los datos y de las instrucciones que imparte, dispone de una base jurídica propia para el tratamiento e informa a los interesados. Gestiona por sí mismo las cuentas, los papeles y las autorizaciones y bloquea a los usuarios que han salido. Responde de las conexiones que configura hacia sistemas propios y ajenos, de las cuentas de servicio depositadas en ellos y del alcance de sus derechos, así como de los puntos de acceso de modelos que él mismo integra. Fija el plazo de conservación. Le corresponden los derechos de información y de control previstos en la sección «Prueba, información y verificación».' },
          { n:'13', t:'Garantías conforme al derecho suizo', b:'El Proveedor trata los datos únicamente del modo en que el propio Cliente podría tratarlos (art. 9, apdo. 1, de la nLPD). El Cliente garantiza que al tratamiento por parte del Proveedor no se opone ningún deber legal o contractual de secreto (art. 9, apdo. 2, de la nLPD). Si tal deber surge solo posteriormente, el Cliente lo comunica sin demora y las partes acuerdan las medidas adicionales necesarias.' },
          { n:'14', t:'Secretos profesionales y de función', b:'Si el Cliente está sujeto a un secreto profesional, por ejemplo conforme al art. 321 del Código Penal suizo (StGB) o al art. 47 de la Ley de Bancos, lo comunica al Proveedor antes del inicio del tratamiento. En ese caso el Proveedor y las personas que emplea actúan como auxiliares del Cliente y quedan sujetos al mismo deber de secreto en la misma medida. El Proveedor vincula a sus subencargados del tratamiento en consecuencia, en la medida en que estos puedan tener acceso a los datos afectados.' },
          { n:'15', t:'Confidencialidad de las personas empleadas', b:'El Proveedor emplea únicamente a personas obligadas a la confidencialidad o sujetas a un deber legal de sigilo adecuado (art. 28, apdo. 3, letra b, del RGPD). El compromiso se asume antes del inicio de la actividad, en forma textual, y sigue aplicándose sin límite temporal tras la finalización de la relación laboral o de encargo. El Proveedor acredita el compromiso a petición del Cliente. Las personas empleadas reciben formación sobre los requisitos del presente contrato y sobre la protección de datos.' },
          { n:'16', t:'Acceso del personal del Proveedor a los datos del Cliente', b:'Solo obtienen acceso a los sistemas del Cliente personas del Proveedor designadas nominalmente y solo en la medida en que ello sea necesario para la explotación, el mantenimiento, la resolución de incidencias o la asistencia. Todo acceso administrativo queda registrado. Un acceso a los contenidos de los usuarios solo tiene lugar a petición del Cliente o para subsanar una incidencia concreta y, en ese caso, conforme al principio de doble control. El Cliente puede consultar los registros de los accesos administrativos y exportarlos en formato CSV. A requerimiento, el Proveedor indica el círculo de personas autorizadas a acceder.' },
          { n:'17', t:'Medidas técnicas y organizativas', b:'El Proveedor adopta las medidas exigidas por el art. 32, apdo. 1, del RGPD y por el art. 8 de la nLPD para garantizar un nivel de protección adecuado al riesgo. Entre ellas figuran la seudonimización, en la medida en que sea compatible con el fin, el cifrado, la garantía de la confidencialidad, la integridad, la disponibilidad y la resiliencia de los sistemas, la capacidad de restablecer rápidamente la situación tras un incidente, así como un procedimiento de verificación y evaluación regulares de la eficacia de estas medidas. Los detalles figuran en el anexo «Medidas técnicas y organizativas», que en su versión fechada forma parte del presente contrato. El Proveedor puede adaptar las medidas al estado de la técnica, siempre que con ello no se rebaje el nivel de protección acordado; comunica al Cliente las modificaciones sustanciales.' },
          { n:'18', t:'Alcance garantizado del cifrado, de la separación y del registro', b:'Las transmisiones están cifradas. En reposo, el cifrado de los soportes de datos en la explotación gestionada forma parte de la provisión de los servidores; un cifrado que vaya más allá, de registros concretos en el nivel de la aplicación, no está garantizado. Para la separación de los clientes, cada cliente recibe una pila propia con base de datos propia, índice de búsqueda propio, repositorio de archivos propio, configuración propia, red propia y clave de inferencia propia. La línea de separación es esta pila y no la máquina física: hasta unos 15 usuarios, varios clientes pueden compartir una máquina, utilizándose en común las imágenes de contenedor y un proxy inverso situado por delante. El registro de las actuaciones de administración está encadenado, cada entrada lleva una suma de verificación sobre la anterior y una comprobación integrada avisa de una cadena interrumpida. Las intervenciones posteriores se notan así; una inalterabilidad técnica no está garantizada. Cuando la identidad de la persona se traslada hasta un sistema de destino conectado, el registro del Proveedor termina en la frontera del sistema y rige el registro del sistema de destino.' },
          { n:'19', t:'Certificaciones y medidas previstas', b:'La explotación gestionada tiene lugar en los centros de datos de Green en Lupfig, cantón de Argovia, certificados conforme a ISO 27001. Esta certificación corresponde a Green como operador del centro de datos, no al Proveedor, y no constituye una medida técnica propia del Proveedor. El Proveedor no dispone hoy de ninguna certificación propia; una certificación ISO 27001 propia está en curso y no se dispone de un informe SOC 2. Se consideran además previstos y no garantizados: un proxy de salida con lista de autorización para los accesos de red desde el entorno aislado de código (en curso); el nivel de aislamiento más fuerte del entorno aislado de código, que presupone soporte de virtualización en el servidor y que por ello no es en todas partes el ajuste predeterminado; el aprovisionamiento y el bloqueo automáticos de cuentas mediante SCIM (previsto; hoy el bloqueo se efectúa a través del servicio de directorio).' },
          { n:'20', t:'Subencargados del tratamiento: autorización y cambio', b:'El Proveedor recurre a subencargados del tratamiento únicamente con la autorización previa del Cliente; así lo exige el art. 9, apdo. 3, de la nLPD y su incumplimiento está sancionado penalmente conforme al art. 61, letra b, de la nLPD, por lo que una mera información no basta. Respecto de las entidades mencionadas nominalmente en la lista de subencargados del tratamiento, el Cliente otorga la autorización con la celebración del presente contrato. Para las entidades nuevas o sustituidas rige lo siguiente: el Proveedor anuncia el cambio con 30 días [propuesta] de antelación en forma textual, indicando el nombre, la persona jurídica, la sede, el fin y la base de la transferencia. El Cliente puede oponerse dentro de los 14 días [propuesta] siguientes a la recepción del anuncio por un motivo relativo a la protección de datos. En caso de oposición fundada, el Proveedor suspende el cambio; si la prestación no puede realizarse sin el nuevo subencargado del tratamiento, el Cliente puede resolver la parte de la prestación afectada con efecto a la fecha del cambio y obtiene la devolución proporcional de las remuneraciones pagadas por adelantado.' },
          { n:'21', t:'La cadena efectiva', b:'Forman parte de la cadena el operador del centro de datos Green en Lupfig y la pasarela de inferencia EuRouter. EuRouter no presta la inferencia por sí mismo, sino que traslada las solicitudes a proveedores de modelos; esos proveedores forman parte de la cadena. En la búsqueda web forman parte de ella igualmente: la consulta de las páginas web encontradas y los motores de búsqueda externos interrogados. El Proveedor indica este nivel en la lista de subencargados del tratamiento y lo hace consultable para el Cliente a requerimiento, con la persona jurídica, la sede y la base de la transferencia. Los componentes que el Proveedor explota en su propia infraestructura no son subencargados del tratamiento; ello vale para el servicio de búsqueda alojado por él mismo.' },
          { n:'22', t:'Traslado de las obligaciones y responsabilidad por los subencargados del tratamiento', b:'El Proveedor vincula por escrito a cada subencargado del tratamiento a obligaciones esencialmente idénticas a las que el presente contrato le impone a él, incluidos los derechos de prueba y de control del Cliente, y asegura que estos derechos sean también exigibles frente al subencargado del tratamiento (art. 28, apdo. 4, del RGPD). Si un subencargado del tratamiento no cumple sus obligaciones en materia de protección de datos, el Proveedor responde ante el Cliente de su comportamiento como del propio. El Cliente dispone así en todo caso de un obligado en Suiza frente al que dirigir sus pretensiones.' },
          { n:'23', t:'Lugar del tratamiento y excepciones señaladas', b:'La conservación y la explotación tienen lugar en Suiza, en Green en Lupfig. La inferencia de los modelos se realiza a través de EuRouter en la UE. Se señalan expresamente dos excepciones. En primer lugar, la búsqueda web: las consultas se trasladan a motores de búsqueda externos sin identidad del usuario y pueden con ello salir del espacio de la UE, del EEE y de Suiza. La afirmación de que todo permanece en Europa vale para la conservación y para la inferencia, no para la propia consulta de búsqueda. En segundo lugar, un proveedor de modelos adicional fuera de Europa: tal proveedor puede integrarse. Si ese es el caso en la instancia del Cliente, para ese proveedor no rige la garantía relativa a la UE, y la base de la transferencia corresponde al Cliente como responsable del tratamiento.' },
          { n:'24', t:'Transferencia a terceros países: las tres bases jurídicas', b:'En primer lugar, del Cliente en la UE o en el EEE al Proveedor en Suiza: para ello no se requieren cláusulas contractuales tipo. Para Suiza existe una decisión de adecuación de la Comisión Europea; la transferencia queda así equiparada a una transferencia intraeuropea. En segundo lugar, del Proveedor en Suiza a la inferencia en la UE: esta transferencia se basa en el art. 16, apdo. 1, de la nLPD en relación con el anexo 1 de la Ordenanza sobre la protección de datos, que enumera los Estados del EEE como países con protección adecuada. En tercer lugar, el nivel situado por debajo de EuRouter: respecto de cada proveedor de modelos, el Proveedor indica a requerimiento la persona jurídica, la sede y el mecanismo de transferencia. Si la sede se encuentra fuera de la UE, del EEE y de Suiza, la transferencia se basa en las cláusulas contractuales tipo de la Comisión Europea junto con un examen de la situación jurídica en el Estado de destino y, además, en una base suiza autónoma conforme al art. 16, apdo. 2, de la nLPD, porque los reconocimientos europeos y los suizos son actos jurídicos separados y una base de la UE no sustituye a la suiza.' },
          { n:'25', t:'Requerimientos de entrega de las autoridades', b:'La vinculación a las instrucciones conforme al art. 28, apdo. 3, letra a, del RGPD rige también para las transferencias a terceros países. Sin instrucción del Cliente, el Proveedor solo transfiere si está obligado a ello en virtud del derecho aplicable; en ese caso informa al Cliente antes de la transferencia, siempre que el derecho no prohíba esa información. Si el Proveedor recibe una resolución administrativa o judicial de entrega de datos del Cliente, examina su licitud, no entrega nada sin obligación jurídica, impugna las resoluciones manifiestamente inadmisibles o agota los recursos jurídicos que razonablemente se le pueden exigir, limita una entrega a lo jurídicamente debido y avisa al Cliente tan pronto como ello sea admisible. Si el aviso está prohibido de forma duradera, el Proveedor documenta la actuación y la refleja de forma agregada en su informe periódico.' },
          { n:'26', t:'Ningún entrenamiento con datos del Cliente', b:'El Proveedor no utiliza los datos del Cliente para el entrenamiento o la mejora de modelos y no los cede con ese fin. Para la inferencia a través de EuRouter rige lo siguiente: allí los contenidos de las solicitudes no se conservan por defecto ni se utilizan para el entrenamiento. Se trata de un ajuste predeterminado de la pasarela. El Proveedor mantiene fijado este ajuste predeterminado para los accesos que él explota, lo verifica periódicamente y comunica al Cliente si algo cambia al respecto. EuRouter conserva los metadatos de uso, como las marcas de tiempo y el número de tokens, hasta doce meses. Si el Cliente integra un punto de acceso de modelo propio, rigen las condiciones de este; el compromiso del Proveedor no se extiende a ese punto de acceso.' },
          { n:'27', t:'Asistencia en materia de derechos de los interesados', b:'El Proveedor asiste al Cliente, mediante medidas técnicas y organizativas adecuadas, para dar curso a las solicitudes de los interesados (art. 28, apdo. 3, letra e, del RGPD). A tal efecto, el servicio pone a disposición en el panel de administración la exportación de datos y la supresión por persona, incluida la supresión completa; el Cliente ejecuta por sí mismo estas operaciones. Si un interesado se dirige directamente al Proveedor, este no responde por sí mismo a la solicitud, sino que la traslada sin demora al Cliente e informa de ello a la persona. Si las funciones del servicio no bastan en un caso concreto, el Proveedor presta asistencia complementaria.' },
          { n:'28', t:'Notificación de violaciones de la protección de datos', b:'El Proveedor notifica al Cliente toda violación de la seguridad de los datos personales sin demora, a más tardar dentro de las 48 horas [propuesta] siguientes a tener conocimiento de ella, en forma textual al punto designado por el Cliente. El plazo está fijado de modo que el Cliente pueda cumplir su propio plazo de 72 horas conforme al art. 33, apdo. 1, del RGPD y su deber de notificación conforme al art. 24 de la nLPD. La notificación describe la naturaleza del incidente, los tipos de datos y las categorías de interesados afectados, las consecuencias probables, las medidas adoptadas y las propuestas, así como un punto de contacto. Si todavía no se dispone de todos los datos, el Proveedor notifica primero y completa de forma sucesiva. La notificación a la autoridad de control y la comunicación a los interesados siguen siendo asunto del Cliente; el Proveedor le asiste en ello.' },
          { n:'29', t:'Asistencia en la evaluación de impacto y en la consulta previa', b:'El Proveedor asiste al Cliente en la evaluación de impacto relativa a la protección de datos conforme al art. 35 del RGPD y al art. 22 de la nLPD, así como en una eventual consulta previa a la autoridad de control conforme al art. 36 del RGPD y al art. 23 de la nLPD. En el caso de un asistente de inteligencia artificial conectado a sistemas empresariales, una evaluación de impacto es la regla y no la excepción. El Proveedor pone a disposición los datos necesarios para ello: operaciones de tratamiento y flujos de datos, subencargados del tratamiento empleados y elementos referidos a terceros países, medidas técnicas y organizativas, conservación y supresión, riesgos conocidos de los componentes empleados.' },
          { n:'30', t:'Prueba, información y verificación', b:'El Proveedor pone a disposición del Cliente toda la información necesaria para demostrar el cumplimiento de las obligaciones derivadas del art. 28 del RGPD y permite verificaciones (art. 28, apdo. 3, letra h, del RGPD). Facilita la información en forma textual dentro de los 30 días [propuesta] siguientes a la solicitud. Además, el Cliente puede realizar, o hacer realizar por un auditor, una auditoría por año natural [propuesta], con un preaviso de 30 días [propuesta] y durante el horario comercial ordinario. Tras un incidente sujeto a notificación o por orden de una autoridad de control se admite una auditoría extraordinaria sin imputación a ese contingente. El auditor está obligado al sigilo y no puede ser un competidor del Proveedor. Los certificados, informes de auditoría y dictámenes sustituyen una verificación in situ en la medida en que cubran la finalidad de la verificación; no excluyen una inspección si quedan puntos abiertos. Los derechos de la presente sección rigen también frente a los subencargados del tratamiento: el Proveedor los procura al Cliente mediante el acuerdo correspondiente o, a requerimiento, lleva a cabo la verificación en su lugar y entrega el resultado. Cada parte soporta sus propios costes; la auditoría anual y la información de alcance usual son gratuitas para el Cliente, mientras que el trabajo por verificaciones adicionales sin motivo en la esfera del Proveedor se factura según el tiempo empleado.' },
          { n:'31', t:'Autoridades de control, punto de contacto y registro', b:'A requerimiento, el Proveedor coopera con el Encargado Federal de Protección de Datos y Transparencia (EDÖB) y con la autoridad de control competente para el Cliente en la UE, e informa al Cliente de las solicitudes que se le dirijan y que afecten a los datos de este. El punto de contacto para cuestiones de protección de datos es Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, info@herr-informatik.ch. El Proveedor lleva un registro de todas las categorías de actividades de tratamiento que realiza por cuenta ajena (art. 30, apdo. 2, del RGPD, art. 12 de la nLPD) y lo pone a disposición del Cliente a requerimiento. En la medida en que el Proveedor esté sujeto al deber previsto en el art. 27 del RGPD, designa un representante en la Unión y lo indica en el aviso legal; hoy no hay designado ningún representante de ese tipo.' },
          { n:'32', t:'Conservación en la explotación corriente', b:'El Cliente fija el plazo de conservación en el panel de administración; fijar y modificar este plazo vale como instrucción. De fábrica no hay fijado ningún plazo: sin plazo fijado, las conversaciones permanecen almacenadas hasta que los usuarios o la administración las supriman. Si hay un plazo fijado, las conversaciones vencidas se eliminan definitivamente junto con los mensajes, los enlaces compartidos y las entradas del índice de búsqueda; es determinante la última modificación, no la fecha de creación. Los datos de facturación no están comprendidos en el plazo y se conservan para que el consumo de los periodos transcurridos siga siendo trazable; solo se eliminan con una supresión completa, sin perjuicio de los deberes de conservación del derecho mercantil y fiscal. En el proveedor de inferencia se generan metadatos de uso que allí se conservan hasta doce meses.' },
          { n:'33', t:'Devolución y supresión tras la finalización del contrato', b:'El Cliente elige si los datos se devuelven o se suprimen (art. 28, apdo. 3, letra g, del RGPD) y comunica su elección hasta el final de la vigencia. A falta de comunicación, rige como caso estándar la devolución con la supresión subsiguiente. La devolución se realiza dentro de los 30 días [propuesta] siguientes a la finalización del contrato, en un formato estructurado, de uso común y legible por máquina: exportación de la base de datos de las conversaciones y de las cuentas, archivos en su forma original, registros en formato CSV. A continuación, el Proveedor suprime los datos productivos. La supresión completa, incluidas todas las copias de seguridad, queda concluida dentro de los 90 días [propuesta] siguientes a la finalización del contrato; el plazo corresponde al ciclo de rotación de las copias de seguridad. Hasta la caducidad de una copia de seguridad, los datos que contiene permanecen bloqueados y no se tratan con ningún fin distinto del restablecimiento en caso de emergencia. Los registros de auditoría y de acceso corren la misma suerte que los contenidos. A requerimiento, el Proveedor confirma la supresión en forma textual. Se exceptúan los datos de facturación y los datos para los que existe un deber legal de conservación; estos se bloquean y se suprimen una vez expirado el deber.' },
          { n:'34', t:'Costes de las prestaciones de asistencia', b:'La asistencia en materia de derechos de los interesados, de notificaciones y de evaluación de impacto queda compensada, en la medida usual, con la remuneración del contrato principal. Si el trabajo excede claramente la medida usual, en particular en caso de un número elevado de solicitudes similares o de solicitudes que se deban a una configuración del Cliente, el Proveedor lo factura según el tiempo empleado a las tarifas acordadas, tras haberlo advertido previamente al Cliente y haber obtenido su consentimiento. La devolución y la supresión tras la finalización del contrato son gratuitas en el formato estándar; las preparaciones que vayan más allá se facturan según el tiempo empleado.' },
          { n:'35', t:'Responsabilidad', b:'Para los daños derivados del tratamiento de datos personales prevalecen las disposiciones legales imperativas, en particular el art. 82 del RGPD. La exclusión de responsabilidad por pérdida de datos prevista en la cláusula 10 de las CG no se aplica en la medida en que la pérdida se base en una infracción de las obligaciones del presente contrato, en particular de las medidas previstas en la sección «Medidas técnicas y organizativas». Si varios intervinientes responden frente a un interesado, el reparto en la relación interna se rige por la respectiva cuota de responsabilidad (art. 82, apdo. 5, del RGPD). De sus subencargados del tratamiento responde el Proveedor como de su propio comportamiento.' },
          { n:'36', t:'Derecho aplicable, fuero y versiones lingüísticas', b:'Se aplica el derecho suizo, con exclusión de las normas de conflicto de leyes. El fuero exclusivo es Windisch, cantón de Argovia, en la medida en que ello sea legalmente admisible. Quedan reservados los fueros imperativos de los interesados y la competencia de las autoridades de control, así como la aplicabilidad directa del RGPD en la medida en que este se aplique al tratamiento. El presente contrato existe en cinco idiomas. Hace fe la versión alemana; las demás versiones sirven a efectos informativos.' },
          { n:'37', t:'Estado, versión y modificaciones', b:'Estado: agosto de 2026, versión 1.0. Las modificaciones y los complementos requieren la forma textual y el consentimiento de ambas partes. Se exceptúan la actualización de la lista de subencargados del tratamiento conforme al procedimiento acordado a tal efecto y el desarrollo ulterior de las medidas técnicas y organizativas dentro de los límites de la prohibición de rebajar el nivel de protección. Los plazos y las cantidades marcados con [propuesta] son propuestas del Proveedor y siguen siendo negociables hasta la celebración del contrato.' }
        ],
        disclaimer:'Nota: el presente texto no constituye asesoramiento jurídico. Solo pasa a ser vinculante con la firma de ambas partes o con la aceptación en el marco del contrato principal. Los valores marcados con [propuesta] son propuestas del Proveedor.'
      },
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){ const lang = this.state.lang || 'de'; return { t: this.C[lang] || this.C.de }; }
}
</script>
