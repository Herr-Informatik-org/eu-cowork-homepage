<noscript>
  <h1>Datenschutz</h1>
  <p>Wie wir mit personenbezogenen Daten umgehen, nach revDSG (Schweiz) und DSGVO. Kurz, weil wir wenig erheben. Telemetrie standardmässig aus.</p>
  <ul>
    <li><strong>Verantwortliche Stelle:</strong> Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Schweiz. Kontakt: info@herr-informatik.ch.</li>
    <li><strong>Welche Daten wir verarbeiten:</strong> Konto- und Abrechnungsdaten sowie die Inhalte, die ihr aktiv in den Dienst eingebt. Keine Werbe-Tracker.</li>
    <li><strong>Kein Training mit euren Daten:</strong> Eure Inhalte werden nicht zum Training von Modellen verwendet.</li>
    <li><strong>Telemetrie:</strong> Standardmässig deaktiviert, aggregierte Nutzungsmetriken nur nach ausdrücklicher Aktivierung.</li>
    <li><strong>Ort der Verarbeitung:</strong> Betrieb in der Schweiz (Green, Lupfig), Modell-Inferenz EU-verarbeitet über EuRouter.</li>
    <li><strong>Speicherdauer:</strong> Nur so lange wie für den Dienst nötig oder gesetzlich verlangt. Löschung auf Anfrage.</li>
    <li><strong>Eure Rechte:</strong> Auskunft, Berichtigung, Löschung, Einschränkung und Datenübertragbarkeit.</li>
  </ul>
  <h2>Weiter</h2>
  <ul>
    <li><a href="/sicherheit">Trust Center: Sicherheit &amp; Datenschutz</a></li>
    <li><a href="/self-hosting">Self-Hosting in 60 Sekunden</a></li>
    <li><a href="/warteliste">Warteliste: frühen Zugang sichern</a></li>
  </ul>
</noscript>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { lang: (typeof localStorage!=='undefined' && localStorage.getItem('eucowork_lang')) || 'de' };
    this._onLang = (e)=>this.setState({ lang:e.detail });
    this.C = {
      de: {
        h1:'Datenschutz',
        intro:'Wie wir mit personenbezogenen Daten umgehen — nach revDSG (Schweiz) und DSGVO. Kurz, weil wir wenig erheben.',

          { n:'1', t:'Verantwortliche Stelle', b:'Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Schweiz (Anbieterin von EU-Cowork). Kontakt: info@herr-informatik.ch.' },
          { n:'2', t:'Welche Daten wir verarbeiten', b:'Konto- und Abrechnungsdaten sowie die Inhalte, die ihr aktiv in den Dienst eingebt. Keine Werbe-Tracker, keine Weitergabe an Werbenetzwerke.' },
          { n:'3', t:'Kein Training mit euren Daten', b:'Eure Inhalte werden nicht zum Training von Modellen verwendet. No-Training ist vertraglich zugesichert.' },
          { n:'4', t:'Telemetrie', b:'Standardmässig deaktiviert. Optionale, aggregierte Nutzungsmetriken nur nach ausdrücklicher Aktivierung.' },
          { n:'5', t:'Ort der Verarbeitung', b:'Betrieb in der Schweiz (Green, Lupfig); Modell-Inferenz EU-verarbeitet über EuRouter. Beim Self-Hosting bleiben Daten vollständig bei euch.' },
          { n:'6', t:'Speicherdauer', b:'Daten werden nur so lange gespeichert, wie es für den Dienst nötig ist oder gesetzliche Pflichten es verlangen. Löschung auf Anfrage.' },
          { n:'7', t:'Eure Rechte', b:'Auskunft, Berichtigung, Löschung, Einschränkung und Datenübertragbarkeit. Anfragen an privacy@eu-cowork.example.' }
        ],
        disclaimer:'Hinweis: Diese Datenschutzerklärung ist eine Vorschau. Die verbindliche Fassung mit vollständigen Firmenangaben wird vor Launch veröffentlicht und ersetzt Platzhalter.'
      },
      en: {
        h1:'Privacy',
        intro:'How we handle personal data — under revDSG (Switzerland) and GDPR. Short, because we collect little.',
        badge:'Telemetry off by default',
        sections:[
          { n:'1', t:'Controller', b:'Herr Informatik GmbH, Klosterzelgstrasse 1a, 5210 Windisch, Switzerland (provider of EU-Cowork). Contact: info@herr-informatik.ch.' },
          { n:'2', t:'What data we process', b:'Account and billing data plus the content you actively enter into the service. No advertising trackers, no sharing with ad networks.' },
          { n:'3', t:'No training on your data', b:'Your content is never used to train models. No-training is contractually assured.' },
          { n:'4', t:'Telemetry', b:'Disabled by default. Optional, aggregated usage metrics only after explicit opt-in.' },
          { n:'5', t:'Place of processing', b:'Operated in Switzerland (Green, Lupfig); model inference EU-processed via EuRouter. When self-hosting, data stays entirely with you.' },
          { n:'6', t:'Retention', b:'Data is stored only as long as needed for the service or required by law. Deletion on request.' },
          { n:'7', t:'Your rights', b:'Access, rectification, erasure, restriction and data portability. Requests to privacy@eu-cowork.example.' }
        ],
        disclaimer:'Note: this privacy statement is a preview. The binding version with full company details will be published before launch and replaces placeholders.'
      }
    };
  }
  componentDidMount(){ window.addEventListener('eucowork:langchange', this._onLang); }
  componentWillUnmount(){ window.removeEventListener('eucowork:langchange', this._onLang); }
  renderVals(){ const lang = this.state.lang || 'de'; return { t: this.C[lang] || this.C.de }; }
}
</script>
